# Ported from docs/manual-usuario.md § 9 (lines 660-846) as it stands.
# Faithful port; see 04-introduccion.yaml for what the format changes and why.
#
# Observation for the later update pass, recorded and NOT acted on here: the
# module map says `canViewTimeMetrics` is on for `lv` only, while this section's
# "Tiempos de gestión" filter is documented for every deployment because the
# legacy says `Tenants: Todos`. Left exactly as the legacy has it.

id: security-dashboard
title: Security Dashboard
subtitle: Análisis y estadísticas en tiempo real

# Named by reading the product, one path per subject this section describes —
# not from the module map, which holds no reference into `pages/Reports/`.
# Declaring coverage is not the same as claiming it was checked: this section
# has NO baseline in baselines.json and is not to be stamped until someone has
# read the last three against what the manual says of them. Only the filters
# have been audited (control by control, against ReportsFilters.tsx). The
# declaration exists so that drift in the other three can reach this module at
# all — with no `documents:` it read `unknown coverage` while the product's
# movement landed squarely here, which is how six undocumented filters went
# unnoticed.
sourceBase: src/render/
documents:
  paths:
    # "Filtros" — audited.
    - pages/Reports/ReportsFilters.tsx
    # "Ventanas de Datos" — the widgets and the charts that fill them.
    - pages/Reports/ReportsPage.tsx
    - pages/Reports/ReportsCharts.tsx
    # "Mapa de Calor" — ReportsCharts.tsx:9 imports it, and renders it at :1221.
    - components/GoogleMap/ControlHeatMap.tsx
  # A capability fact joins by FLAG, never by the file that reads it
  # (`coverage.ts`, `matchesFlagEntry`) — so declaring ReportsFilters.tsx does
  # not catch a flag flipping in a tenant config. Without these, the three
  # capability facts standing today (canViewComparisonDateRange,
  # canViewReportsFilterCity, canViewReportsFilterDepartment) report as
  # undeclared while naming controls this very section documents.
  flags:
    - canViewComparisonDateRange
    - canViewReportsFilterCity
    - canViewReportsFilterDepartment
    - canViewFilterZone
    - canViewFilterCommune
    - canViewFilterNeighborhood
    - canViewFilterResponseForce
    - canViewFilterTrafficDetails
    - canViewFilterStation
    # Governs the removed "Tipo de Finalización" control. Declared although
    # nothing is written about it: this is the module the change would belong
    # to if the flag were ever switched on, and a flag nobody claims reports as
    # undeclared — which is the one state that guarantees nobody looks.
    - canViewFilterCompletionType
    # The "Tiempos de gestión" window, which this section documents for every
    # deployment because the legacy said so. See the note at the top of the
    # file: the module map has it on for `lv` alone and it was never reconciled.
    - canViewTimeMetrics

children:
  - id: dashboard.intro
    type: prose
    props:
      text: >-
        El módulo de Security Dashboard permite verificar, ordenar, categorizar,
        clasificar y cuantificar los casos que se atienden en la plataforma.
        Ofrece acceso rápido a indicadores clave, métricas y estadísticas en
        tiempo real sobre los incidentes y casos registrados, con el fin de
        facilitar la toma de decisiones y el seguimiento de la operación.

  # Overview figure: the module at a glance, before any detail.
  - id: dashboard.fig
    type: figure
    props:
      caption: "Vista general del Security Dashboard."
      widthPercent: 90

  - id: dashboard.areas.intro
    type: prose
    props:
      text: >-
        El dashboard se organiza en tres áreas principales, que se detallan en las
        siguientes subsecciones.

  - id: dashboard.areas
    type: field-list
    props:
      items:
        - id: dashboard.area.filtros
          label: Filtros
          text: >-
            Acotan la información mostrada según distintos criterios de tiempo.
          layout: beside
        - id: dashboard.area.ventanas
          label: Ventanas de Datos
          text: >-
            Muestran métricas y gráficos de los casos (tiempos de respuesta,
            cantidad de emergencias, categorías y casos frecuentes).
          layout: beside
        - id: dashboard.area.mapa
          label: Mapa de Calor
          text: "Representa geográficamente la concentración de los casos."
          layout: beside

  - id: dashboard.filtros
    title: Filtros
    children:
      - id: dashboard.filtros.rango
        title: Rango de tiempo
        children:
          - id: dashboard.filtros.rango.texto
            type: prose
            props:
              text: >-
                Permite filtrar por un rango de días: última semana, último mes,
                último año, o un rango personalizado con fechas específicas.
          - id: dashboard.filtros.rango.fig
            type: figure
            props:
              caption: "Filtro de rango de tiempo del dashboard."
              widthPercent: 70

      # ReportsFilters.tsx:628 — this whole subsection is gated by
      # `config.canViewComparisonDateRange`, rendered right after the main
      # date-range controls (Grid/Menu ending line 627) and before the
      # location filters (Box at line 708). `true` only in mv.config.ts:20
      # (`false` in med.config.ts:568).
      - id: dashboard.filtros.comparacion
        title: Rango de Comparación
        when:
          tenant: [mv]
        children:
          - id: dashboard.filtros.comparacion.intro
            type: prose
            props:
              text: >-
                Permite comparar las métricas del período principal con las de
                un segundo período, para contrastar la evolución de los
                indicadores.
          - id: dashboard.filtros.comparacion.acceso
            type: prose
            props:
              text: >-
                Se encuentra en el panel de Filtros, debajo del Rango de
                tiempo.
          - id: dashboard.filtros.comparacion.fig
            type: figure
            props:
              caption: "Control de Rango de Comparación en el panel de Filtros."
              widthPercent: 70
          # reportsPage.comparisonRangeLinkedTooltip (es.json:1090) — "El
          # rango de comparación sigue automáticamente al rango principal"
          # reportsPage.comparisonRangeUnlinkedTooltip (es.json:1091) — "El
          # rango de comparación es fijo. Haz clic para volver a vincularlo"
          # dataStore.ts:24-33,59-60 — `comparisonRangeLinked` defaults to
          # true; while linked, `comparisonDates` is derived from the main
          # range (the period immediately preceding it, of equal length,
          # via `deriveLinkedComparisonDates`/`getLastPeriod`). Editing the
          # comparison dates by hand sets `comparisonRangeLinked` to false
          # (ReportsFilters.tsx:695-701).
          - id: dashboard.filtros.comparacion.vinculo
            type: prose
            props:
              text: >-
                De forma predeterminada, el rango de comparación está
                vinculado al rango de tiempo principal: corresponde
                automáticamente al período inmediatamente anterior, de igual
                duración. Al editar sus fechas manualmente, el vínculo se
                desactiva y el rango de comparación queda fijo.
          # ReportsFilters.tsx:687-703 (CustomDateTimeRange, comparison dates)
          # and 653-676 (ChainLinkIcon button) — the two controls this
          # procedure operates.
          - id: dashboard.filtros.comparacion.editar
            type: procedure
            props:
              steps:
                - id: dashboard.filtros.comparacion.paso.editar
                  title: Edite las fechas de comparación
                  text: >-
                    Haga clic sobre el campo de fechas del **Rango de
                    Comparación** y seleccione el nuevo período de inicio y
                    fin. Esta acción desvincula el rango de comparación del
                    rango de tiempo principal.
                - id: dashboard.filtros.comparacion.paso.vincular
                  title: Vuelva a vincular el rango de comparación
                  text: >-
                    Haga clic en el ícono de cadena, junto al título **Rango
                    de Comparación**, para que vuelva a seguir
                    automáticamente al rango de tiempo principal.
          - id: dashboard.filtros.comparacion.resultado
            type: prose
            props:
              text: >-
                Al confirmarlo, el período de comparación queda activo y las
                ventanas de datos del dashboard lo utilizan para contrastar
                sus métricas con las del rango principal.
          # filters.comparisonRange (es.json:1424) — "Rango de Comparación"
          # FilterChips.tsx:236-259 — the active comparison range renders as
          # a chip above the charts. Clicking it (`handleFilter`,
          # FilterChips.tsx:43-48, case "comparison-dates-range") reopens
          # this same date selector; it does not remove the comparison.
          - id: dashboard.filtros.comparacion.chip
            type: prose
            props:
              text: >-
                Mientras el rango de comparación está activo, se muestra
                como un chip identificado **Rango de Comparación** encima de
                los gráficos del dashboard. Al hacer clic sobre él se reabre
                el selector de fechas de comparación.

      - id: dashboard.filtros.ubicacion
        title: Ubicación
        children:
          # ReportsFilters.tsx:757,839 — the Departamento and Ciudad filter
          # blocks are gated by `config.canViewReportsFilterDepartment` /
          # `canViewReportsFilterCity`, `true` only in med.config.ts:561-562
          # (`false` in mv.config.ts:13-14).
          - id: dashboard.filtros.ubicacion.texto
            type: prose
            props:
              text: >-
                Permite filtrar por Departamento y Ciudad. Al seleccionar el
                Departamento se habilita la selección de ciudades.
            when:
              tenant: [med]
          - id: dashboard.filtros.ubicacion.fig-depto
            type: figure
            props:
              caption: "Filtro de ubicación por Departamento y Ciudad."
              widthPercent: 91
            when:
              tenant: [med]
          # The figure above shows controls this deployment does not render
          # (mv.config.ts:13-14), so it is conditioned to med — and the
          # submodule would be left without the overview figure that
          # `module-completeness` requires of every submodule. This is that
          # figure for mv.
          #
          # It shows the Zona filter open rather than the three rows together,
          # and the caption says so. The drawer has no section containers — a
          # DOM walk found the innermost element holding Zona, Comuna and
          # Barrio to be the one that holds every other filter too, so "those
          # three rows" is not a thing any capture can frame. Zona is also the
          # only one of the three with contents: Comuna and Barrio read 0/0
          # until a zone is picked, so the three collapsed would have shown an
          # operator three headings and no mechanism. See `capture-recipes.yaml`.
          - id: dashboard.filtros.ubicacion.fig-zona
            type: figure
            props:
              caption: "Filtro de Zona desplegado, con las zonas disponibles."
              widthPercent: 91
            when:
              tenant: [mv]
          # Unconditioned: `canViewFilterZone`/`canViewFilterCommune`/
          # `canViewFilterNeighborhood` are `true` for both mv.config.ts:15-17
          # and med.config.ts:563-565 — this was not part of the change.
          - id: dashboard.filtros.ubicacion.zona-texto
            type: prose
            props:
              text: "Permite filtrar por Zona, Comuna y/o Barrio."
          - id: dashboard.filtros.ubicacion.zona
            type: prose
            props:
              text: >-
                Al seleccionar la Zona se habilita la selección de Comuna y, tras
                ella, la de Barrio.
          # mv.config.ts:32-33 — `reportsDepartment: ["5"]` and
          # `reportsCity: ["5001"]` ("Antioquia y Medellín, solo en el
          # dashboard de reportes") preset the department/city the reports
          # request uses (dataStore.ts:35-46, `getUserDepartment`/
          # `getUserCity`), even though this deployment has no Departamento
          # or Ciudad control to change them (mv.config.ts:13-14).
          - id: dashboard.filtros.ubicacion.alcance-mv
            type: prose
            props:
              text: >-
                En este despliegue, los reportes muestran únicamente los
                casos de Antioquia y Medellín; no se ofrece un control para
                modificar este alcance.
            when:
              tenant: [mv]

      - id: dashboard.filtros.variables
        title: Variables de Gestión
        children:
          # ReportsFilters.tsx:1195-1202 — this control (a DropDownReports)
          # renders unconditionally for every tenant; only its title varies.
          # `title={t(config.reportsEmergencyTypeLabel ||
          # "reportsPage.emergencyType")}` (ReportsFilters.tsx:1198-1200).
          # mv.config.ts:25 sets `reportsEmergencyTypeLabel:
          # "reportsPage.filters.policeCode"`; no other tenant config sets
          # that field, so every other deployment (med included) falls back
          # to `reportsPage.emergencyType`. The AST's section node carries one
          # title for every tenant that sees it — there is no per-tenant
          # variant of `title` in the catalogue — so the two wordings are two
          # tagged sibling subsections instead of one section with a
          # conditioned title. This is the smallest split the catalogue
          # allows; see the block-authoring skill on requesting a new block
          # type before improvising further.
          - id: dashboard.variables.emergencia.mv
            # reportsPage.filters.policeCode (es.json:1199) — "Código Policial"
            title: Código Policial
            when:
              tenant: [mv]
            children:
              - id: dashboard.variables.emergencia.mv.texto
                type: prose
                props:
                  text: "Muestra los tipos de emergencia y sus subcategorías."
              - id: dashboard.variables.emergencia.mv.fig
                type: figure
                props:
                  caption: "Filtro por código policial."
                  widthPercent: 70

          - id: dashboard.variables.emergencia.med
            # reportsPage.emergencyType (es.json:1109) — "Tipo de Reporte"
            title: Tipo de Reporte
            when:
              tenant: [med]
            children:
              - id: dashboard.variables.emergencia.med.texto
                type: prose
                props:
                  text: "Muestra los tipos de emergencia y sus subcategorías."
              - id: dashboard.variables.emergencia.med.fig
                type: figure
                props:
                  caption: "Filtro por tipo de reporte."
                  widthPercent: 70

          # ReportsFilters.tsx:1427 — gated by `config.canViewFilterResponseForce`,
          # `false` in mv.config.ts:21 and `true` in med.config.ts:569 (and in
          # every other tenant config). The legacy manual carried this
          # unconditioned; the audit found the tag inverted for this
          # deployment pair — correct tag is med, not mv.
          - id: dashboard.variables.fuerzas
            title: Fuerzas de Respuesta
            when:
              tenant: [med]
            children:
              - id: dashboard.variables.fuerzas.texto
                type: prose
                props:
                  text: "Hace referencia a la fuerza que actuó en el incidente."
              - id: dashboard.variables.fuerzas.fig
                type: figure
                props:
                  caption: "Filtro por fuerza de respuesta."
                  widthPercent: 70

          # REMOVED — "Tipo de Finalización" (`dashboard.variables.finalizacion`,
          # with its five-term list and figure). The control is gated by
          # `config.canViewFilterCompletionType` (ReportsFilters.tsx:1484),
          # which is `false` in ALL SEVEN tenant configs, so no deployment
          # renders it and the manual was sending the operator to look for a
          # filter that is not on their screen. The product did render it once:
          # a real capture of it was delivered and is still in git history along
          # with this content, so both are recoverable if the flag is ever
          # switched back on. Removed on the owner's explicit instruction,
          # 2026-09-15. Do NOT re-import it from the legacy document.

          # ReportsFilters.tsx:1579 — this filter renders only when
          # `config.name === "MV"`, an inline tenant check rather than a
          # named `canView*` flag. The legacy manual carried this
          # unconditioned; the audit found the tag inverted for this
          # deployment pair — correct tag is mv, not med.
          # reportsPage.filters.typeOfMobility (es.json:1198) — "Vehículos
          # Involucrados". The legacy title "Tipo de Movilidad" was typed by
          # hand instead of quoted from the product.
          - id: dashboard.variables.movilidad
            title: Vehículos Involucrados
            when:
              tenant: [mv]
            children:
              - id: dashboard.variables.movilidad.texto
                type: prose
                props:
                  text: >-
                    Tipo de actor vial involucrado en el incidente (motocicleta,
                    cuatrimoto, bicicleta eléctrica, peatón, metro cable,
                    patineta eléctrica, etc.).
              - id: dashboard.variables.movilidad.fig
                type: figure
                props:
                  caption: "Filtro por vehículos involucrados."
                  widthPercent: 70

          # ReportsFilters.tsx:1634-1885 — six filter controls (checkbox
          # lists via CheckboxFilterReports) rendered after the mobility
          # filter (config.name === "MV", ReportsFilters.tsx:1579) and before
          # the time-range controls (ReportsFilters.tsx:1914). Visible to mv
          # only; the legacy manual never documented them.
          - id: dashboard.variables.estado-caso
            # reportsPage.filters.caseStates (es.json:1203) — "Estado del Caso"
            title: Estado del Caso
            when:
              tenant: [mv]
            children:
              - id: dashboard.variables.estado-caso.texto
                type: prose
                props:
                  text: >-
                    Filtra los casos según su estado de gestión (por ejemplo,
                    Caso Pendiente, En Camino, En Sitio o Caso Cerrado),
                    mediante una lista de casillas de verificación con la
                    opción **Todos** para seleccionarlas en conjunto.
              - id: dashboard.variables.estado-caso.fig
                type: figure
                props:
                  caption: "Filtro por estado del caso."
                  widthPercent: 70

          # ReportsFilters.tsx:1671 — same gate,
          # `config.canViewFilterTrafficDetails`.
          - id: dashboard.variables.tipo-caso
            # reportsPage.filters.accidentTypes (es.json:1204) — "Tipo de Caso"
            title: Tipo de Caso
            when:
              tenant: [mv]
            children:
              - id: dashboard.variables.tipo-caso.texto
                type: prose
                props:
                  text: >-
                    Filtra los casos según el tipo de accidente de tránsito
                    registrado (por ejemplo, con heridos, solo con daños o con
                    víctima fatal), mediante una lista de casillas de
                    verificación con la opción **Todos** para seleccionarlas
                    en conjunto.
              - id: dashboard.variables.tipo-caso.fig
                type: figure
                props:
                  caption: "Filtro por tipo de caso."
                  widthPercent: 70

          # ReportsFilters.tsx:1713 — same gate.
          - id: dashboard.variables.clase-siniestro
            # reportsPage.filters.roadAccidentClass (es.json:1205) — "Clase
            # de Siniestro Vial"
            title: Clase de Siniestro Vial
            when:
              tenant: [mv]
            children:
              - id: dashboard.variables.clase-siniestro.texto
                type: prose
                props:
                  text: >-
                    Filtra los casos según la clase de siniestro vial (por
                    ejemplo, choque, caída de ocupante, atropello o
                    volcamiento), mediante una lista de casillas de
                    verificación con la opción **Todos** para seleccionarlas
                    en conjunto.
              - id: dashboard.variables.clase-siniestro.fig
                type: figure
                props:
                  caption: "Filtro por clase de siniestro vial."
                  widthPercent: 70

          # ReportsFilters.tsx:1755 — same gate.
          - id: dashboard.variables.recursos-asignados
            # reportsPage.filters.assignedResources (es.json:1206) —
            # "Recursos Asignados al Caso"
            title: Recursos Asignados al Caso
            when:
              tenant: [mv]
            children:
              - id: dashboard.variables.recursos-asignados.texto
                type: prose
                props:
                  text: >-
                    Filtra los casos según los recursos asignados a su
                    atención (por ejemplo, PMV, cámaras, grúa o motocicleta),
                    mediante una lista de casillas de verificación con la
                    opción **Todos** para seleccionarlas en conjunto.
              - id: dashboard.variables.recursos-asignados.fig
                type: figure
                props:
                  caption: "Filtro por recursos asignados al caso."
                  widthPercent: 70

          # ReportsFilters.tsx:1799 — same gate. Options load from the
          # platform's own closed-reasons catalogue
          # (useClosedReasonsList.ts:5-6, `GET /closed-reasons`), not from a
          # fixed i18n list.
          - id: dashboard.variables.motivo-cierre
            # reportsPage.filters.closedReasons (es.json:1207) — "Motivo de
            # Cierre"
            title: Motivo de Cierre
            when:
              tenant: [mv]
            children:
              - id: dashboard.variables.motivo-cierre.texto
                type: prose
                props:
                  text: >-
                    Filtra los casos según su motivo de cierre, con las
                    opciones cargadas desde el catálogo de motivos de cierre
                    de la plataforma, mediante una lista de casillas de
                    verificación con la opción **Todos** para seleccionarlas
                    en conjunto.
              - id: dashboard.variables.motivo-cierre.fig
                type: figure
                props:
                  caption: "Filtro por motivo de cierre."
                  widthPercent: 70

          # ReportsFilters.tsx:1844 — gated by `config.canViewFilterStation`,
          # `true` only in mv.config.ts:18 (`false` in every other tenant
          # config, med.config.ts:566 included). Options load from the
          # platform's own station catalogue (useStationCalltakerList.ts:16-18,
          # `GET /station-calltaker`), filtered to exclude legacy station
          # codes (ReportsFilters.tsx:197-202).
          - id: dashboard.variables.estacion
            # reportsPage.filters.stationCalltakerApex (es.json:1208) —
            # "Estación"
            title: Estación
            when:
              tenant: [mv]
            children:
              - id: dashboard.variables.estacion.texto
                type: prose
                props:
                  text: >-
                    Filtra los casos según la estación de despacho que los
                    gestionó, con las opciones cargadas desde el catálogo de
                    estaciones de la plataforma, mediante una lista de
                    casillas de verificación con la opción **Todos** para
                    seleccionarlas en conjunto.
              - id: dashboard.variables.estacion.fig
                type: figure
                props:
                  caption: "Filtro por estación."
                  widthPercent: 70

      - id: dashboard.filtros.tiempos
        title: Tiempos de gestión
        children:
          - id: dashboard.filtros.tiempos.intro
            type: prose
            props:
              text: >-
                Permite consultar y analizar los distintos tiempos asociados a la
                atención de un incidente, para medir la eficiencia operativa.
          - id: dashboard.filtros.tiempos.lista
            type: term-list
            props:
              entries:
                - id: dashboard.tiempo.gestion
                  term: Tiempo de gestión
                  definition: >-
                    Período invertido en la atención y resolución del incidente.
                - id: dashboard.tiempo.llegada
                  term: Tiempo de llegada
                  definition: >-
                    Intervalo entre la recepción del incidente y la llegada del
                    recurso asignado.
                - id: dashboard.tiempo.total
                  term: Tiempo total de respuesta
                  definition: >-
                    Suma de todos los tiempos involucrados en la atención.
          - id: dashboard.filtros.tiempos.fig
            type: figure
            props:
              caption: "Filtro por tiempos de gestión."
              widthPercent: 70

      - id: dashboard.filtros.aplicar
        type: prose
        props:
          text: >-
            Una vez aplicados los filtros deseados, use el botón **Aplicar**
            ubicado en la parte inferior del panel de filtros.

  - id: dashboard.ventanas
    title: Ventanas de Datos
    children:
      - id: dashboard.ventanas.intro
        type: prose
        props:
          text: >-
            Las ventanas de datos presentan las métricas y los gráficos del
            dashboard. Se pueden quitar para liberar espacio, volver a mostrar, y
            exportar.

      - id: dashboard.ventanas.quitar
        title: Quitar y aplicar ventanas
        children:
          - id: dashboard.ventanas.quitar.texto
            type: prose
            props:
              text: >-
                Funcionalidad del Dashboard que permite cerrar una ventana
                mediante el ícono **X**, liberando espacio en la interfaz para
                mostrar otras estadísticas.
          - id: dashboard.ventanas.quitar.fig
            type: figure
            props:
              caption: "Cerrar una ventana o widget del dashboard."
              widthPercent: 70
          - id: dashboard.ventanas.restaurar
            type: prose
            props:
              text: >-
                Para volver a mostrar una ventana o estadística eliminada,
                localícela en la opción **Widgets**, ubicada en la parte superior
                del Dashboard.
          - id: dashboard.ventanas.fig-widgets
            type: figure
            props:
              caption: "Menú de Widgets para restaurar ventanas."
              widthPercent: 70
          - id: dashboard.ventanas.restaurada
            type: prose
            props:
              text: "Al seleccionarla, la ventana se restaura en el dashboard."
          - id: dashboard.ventanas.fig-restaurado
            type: figure
            props:
              caption: "Widget restaurado en el dashboard."
              widthPercent: 70

      - id: dashboard.ventanas.exportar
        title: Exportar
        children:
          - id: dashboard.ventanas.exportar.texto
            type: prose
            props:
              text: >-
                En la parte superior derecha se encuentra la funcionalidad
                **Exportar**, que genera un archivo PDF con los gráficos
                estadísticos y los datos del período seleccionado.
          - id: dashboard.ventanas.exportar.fig
            type: figure
            props:
              caption: "Botón de exportación del dashboard."
              widthPercent: 60

      - id: dashboard.widgets
        title: Widgets del Dashboard
        children:
          - id: dashboard.widgets.intro
            type: prose
            props:
              text: "Los widgets disponibles en el Dashboard son los siguientes."
          - id: dashboard.widgets.lista
            type: field-list
            props:
              items:
                - id: dashboard.widget.total
                  label: Total de Emergencias
                  text: >-
                    Muestra el total de emergencias registradas en el período
                    establecido en el filtro.
                  layout: beside
                - id: dashboard.widget.promedio-respuesta
                  label: Tiempo Promedio de Respuesta
                  text: >-
                    Muestra el tiempo promedio de respuesta desde la recepción de
                    la llamada hasta el despacho.
                  layout: beside
                - id: dashboard.widget.sin-despacho
                  label: Casos sin despacho
                  text: >-
                    Muestra todos los casos que no se despacharon en el período
                    seleccionado, con su estadística.
                  layout: beside
                - id: dashboard.widget.promedio-llegada
                  label: Tiempo Promedio de Llegada
                  text: >-
                    Muestra el tiempo promedio desde el despacho del agente hasta
                    su llegada al incidente.
                  layout: beside
                - id: dashboard.widget.tiempo-respuesta
                  label: Tiempo de respuesta
                  text: >-
                    Gráfico de torta con el porcentaje de casos atendidos en
                    distintos rangos de tiempo de respuesta.
                  layout: beside
                - id: dashboard.widget.cantidad
                  label: Cantidad de Emergencias
                  text: >-
                    Gráfico de líneas del número de emergencias atendidas a lo
                    largo de días, semanas o meses.
                  layout: beside
                - id: dashboard.widget.categoria
                  label: Emergencia por categoría
                  text: >-
                    Gráfico de torta con el porcentaje de casos según nueve
                    categorías de clasificación de emergencias.
                  layout: beside
                - id: dashboard.widget.frecuentes
                  label: Tipos de Casos Frecuentes
                  text: >-
                    Gráfico de barras de los casos agrupados por las cinco
                    tipologías (tipos de emergencia) más frecuentes.
                  layout: beside
          - id: dashboard.widgets.modificar
            type: prose
            props:
              text: >-
                Es posible modificar las especificaciones de este gráfico usando
                el filtro de la interfaz en **Variables de Gestión** y luego
                **Tipo de Emergencia**.
          - id: dashboard.widgets.fig-modificar
            type: figure
            props:
              caption: >-
                Filtro de Variables de Gestión para los tipos de casos
                frecuentes.
              widthPercent: 70

  - id: dashboard.mapa-calor
    title: Mapa de Calor
    children:
      - id: dashboard.mapa-calor.intro
        type: prose
        props:
          text: >-
            En la parte inferior del Dashboard se puede visualizar el **Mapa de
            Casos**, que por defecto muestra el mapa de calor de los incidentes
            registrados.

      # Overview figure: the submodule at a glance, before any detail.
      - id: dashboard.mapa-calor.fig
        type: figure
        props:
          caption: "Mapa de calor de casos en el dashboard."
          widthPercent: 90

      - id: dashboard.mapa-calor.opacidad
        type: prose
        props:
          text: >-
            Se puede modificar la opacidad de los colores del mapa para tener una
            visualización más clara de la densidad de incidentes por zona.

      - id: dashboard.mapa-calor.fig-opacidad
        type: figure
        props:
          caption: "Control de opacidad del mapa de casos."
          widthPercent: 10

      - id: dashboard.mapa-calor.maximizar
        type: prose
        props:
          text: >-
            También se puede maximizar el mapa mediante el ícono ubicado en la
            esquina superior derecha del widget, para una visión más amplia.

      - id: dashboard.mapa-calor.fig-maximizado
        type: figure
        props:
          caption: "Mapa de casos maximizado."
          widthPercent: 36

      - id: dashboard.mapa-calor.modo
        type: prose
        props:
          text: >-
            Es posible cambiar el modo de visión de los casos para observarlos
            individualmente, alternando entre **Mapa de calor** y **Marcadores**.

      - id: dashboard.mapa-calor.fig-modo
        type: figure
        props:
          caption: "Alternar entre Mapa de calor y Marcadores."
          widthPercent: 70

      - id: dashboard.mapa-calor.marcadores
        type: prose
        props:
          text: >-
            Al activar **Marcadores**, cada caso se muestra individualmente sobre
            el mapa.

      - id: dashboard.mapa-calor.fig-marcadores
        type: figure
        props:
          caption: "Vista de casos individuales, con marcadores, en el mapa."
          widthPercent: 90

      - id: dashboard.lista
        title: Visualización de Casos en Lista
        children:
          - id: dashboard.lista.texto
            type: prose
            props:
              text: >-
                Para ver todos los casos en modo lista, con distintas
                especificaciones, haga clic sobre la opción **Los Casos** en el
                Dashboard.
          - id: dashboard.lista.fig-boton
            type: figure
            props:
              caption: "Botón Los Casos para el modo lista."
              widthPercent: 60
          - id: dashboard.lista.reemplazo
            type: prose
            props:
              text: >-
                Al activarla, el mapa de la parte inferior se reemplaza por la
                lista completa de casos con sus detalles.
          - id: dashboard.lista.fig-lista
            type: figure
            props:
              caption: "Visualización de casos en modo lista."
              widthPercent: 90
          - id: dashboard.lista.detalle
            type: prose
            props:
              text: >-
                Para ver información más específica, haga clic sobre un caso y se
                mostrarán todos los detalles del incidente seleccionado.
          - id: dashboard.lista.fig-detalle
            type: figure
            props:
              caption: "Detalle de un caso seleccionado en la lista."
              widthPercent: 90
