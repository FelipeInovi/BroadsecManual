# Broadsec of Things (BoT) — a module that does NOT exist in Manual_Broadsec_v5.
#
# Written against skills/module-completeness/SKILL.md: every submodule the
# product offers is covered, each with what it does, how to reach it, its main
# functions and its procedures.
#
# Sources, all read rather than assumed:
#   AppRoutes.tsx:202-214                             route and gating
#   pages/PMV/PMVPage.tsx                             tab shell, panes and polling
#   pages/PMV/components/PMVProgramming.tsx           flashing + multi-day schedules
#   pages/PMV/components/PMVMessageList.tsx           PMV — Registros (message log)
#   pages/PMV/components/PMVLogsList.tsx              PMV activity log (opened from Registros)
#   pages/PMV/components/PMVTemplateList.tsx           editable predefined messages
#   pages/BroadsecOfThings/BOTSidebar.tsx              sidebar nav items
#   pages/BroadsecOfThings/BOTHeader.tsx                header tab captions
#   pages/BroadsecOfThings/ARSExportModal.tsx          ARS — Exportar CSV
#   pages/Alarms/AlarmsManagmentPage.tsx               Alarmas
#   src/render/components/AlarmsTable/columns.tsx       alarm columns, incl. PMV panel faults
#   pages/ResourcesManagment/ResourcesManagmentPage.tsx Recursos
#   src/render/components/ResourcesTable/Columns.tsx    resource columns, incl. case history
#   src/render/components/ResourcesTable/ResourceLogsModal.tsx  case history modal
#   src/render/components/ResourcesTable/ResourcesTable.tsx     PJ marking dialog
#   src/render/pages/Resources/useResourcesTable.ts       agentMobileFilter
#   src/render/components/GoogleMap/GlobalGoogleMap.tsx  map dim control AND
#                                                          panelPresentation="cards"
#                                                          on the BoT map (mapa tab)
#   src/render/components/GoogleMap/PanelCardsOverlay.tsx  panel cards layer
#   src/render/components/GoogleMap/PanelCard.tsx          one panel's card
#   src/render/components/GoogleMap/panelCards.constants.ts/geometry.ts  sizing/placement
#   src/render/components/GoogleMap/CustomMarker.tsx      panel pin click -> card toggle
#   src/render/components/LayersMap.tsx                   Panel layer control gating
#   src/render/pages/PMV/components/PMVFamilyList.tsx     family/subfamily guards
#   src/render/pages/PMV/components/PMVCalendar.tsx       event detail message preview
#   src/render/pages/PMV/components/PMVMessageList.tsx    panel "+N" hover on Registros
#   src/render/components/AlarmsTable/AlarmsManagmentPage.tsx  acknowledge feedback
#   locales/translations/es.json                        every UI label quoted below
#
# Second pass, same day, on the SAME baseline (98210678): the first pass scoped
# itself to pages/BroadsecOfThings, pages/PMV and pages/CCTV only and missed a
# major feature living under components/GoogleMap/ — the PMV panel cards on the
# BoT map — plus several smaller gaps in Recursos, Predeterminados, Calendario,
# Programación, Registros and Alarmas, none of them under those three folders
# either. `documents.paths` widened accordingly, below.
#
# Re-verified 2026-09-25 against origin/develop @ 98210678 (2026-09-23) — the
# product's checked-out state, per the owner (see ESTADO.md, Unresolved #11,
# now Decided). The unmerged DF-32 alarm-levels branch is OUT of scope.
#
# Whole-module gating: AppRoutes.tsx:207 — allowedProjects={["DEMO", "MV"]}.
# Role gating (AppRoutes.tsx:205-206, allowedRoles ["admin"], deniedRoles
# ["manager", "agent"]) cannot be a build axis today — only `tenant` is
# declared — so it is stated in prose. First real case for a second axis.
#
# No image exists for this module. Per the image rule, every slot shows its
# reference instead of a blank gap.

id: broadsec-of-things
title: Broadsec of Things
subtitle: Gestión de dispositivos en campo
when:
  tenant: [mv, demo]

# Resolved from the header's source list, not from the product:
# `AppRoutes.tsx` -> sources/registry.yaml:27 (extract.routes); the PMV, BoT,
# CCTV, PRT, Resources and Alarms page paths -> sources/registry.yaml:32
# (extract.pages); the i18n file -> sources/registry.yaml:30 (extract.i18n).
# Design ADR-010 records that `routes/AppRoutes.tsx` and
# `locales/translations/es.json` lie outside the two scanned roots
# (`components/`, `pages/`) and so are UNJOINABLE — expected, not a defect;
# `documents <manual>` annotates it. No `flags:` declared here: whether this
# module documents `canSeeBoT` is a content judgement left to whoever
# re-grounds the module (design ADR-010, "What could not be determined").
#
# Widened 2026-09-25: the module always documented CCTV, PRT, Recursos and
# Alarmas in full, but `documents:` only ever declared the PMV/BoT-sidebar
# paths — so drift in the other four screens could never be reported. Each
# now has its own directory entry.
sourceBase: src/render/
documents:
  paths:
    - routes/AppRoutes.tsx
    - pages/PMV/
    - pages/BroadsecOfThings/*.tsx
    - pages/CCTV/
    - pages/PRT/
    - pages/ResourcesManagment/
    - pages/Alarms/
    - locales/translations/es.json
    - components/GoogleMap/GlobalGoogleMap.tsx
    - components/GoogleMap/PanelCardsOverlay.tsx
    - components/GoogleMap/PanelCard.tsx
    - components/GoogleMap/panelCards.constants.ts
    - components/GoogleMap/panelCards.geometry.ts
    - components/GoogleMap/CustomMarker.tsx
    - components/LayersMap.tsx
    - pages/Resources/useResourcesTable.ts

children:
  - id: bot.intro
    type: prose
    props:
      text: >-
        **Broadsec of Things (BoT)** reúne en una sola pantalla la operación de
        los dispositivos desplegados en campo: paneles de mensajería variable,
        cámaras, recursos, alarmas y personal en vía. Se organiza como un panel
        lateral de navegación a la izquierda y un área de trabajo que cambia
        según la sección seleccionada.

  - id: bot.acceso
    type: callout
    props:
      variant: important
      text: >-
        El acceso a este módulo está restringido a los perfiles de
        administrador. Los perfiles de supervisor y de agente no lo visualizan.

  # ============================================================ Navegación ===
  # Overview figure: the module/submodule at a glance, before any detail.
  - id: bot.fig
    type: figure
    props:
      caption: "Pantalla general del módulo: el panel lateral de navegación y el área de trabajo."
      widthPercent: 90

  - id: bot.navegacion
    title: Panel lateral de navegación
    children:
      - id: bot.navegacion.que-hace
        type: prose
        props:
          text: >-
            El panel lateral concentra el acceso a todas las secciones del
            módulo y permanece visible en todo momento. Puede contraerse para
            ampliar el área de trabajo. Las secciones **CCTV** y **PMV** agrupan
            subsecciones que se despliegan al seleccionarlas.

      - id: bot.navegacion.cabecera
        type: prose
        props:
          text: >-
            Sobre el área de trabajo, la barra superior indica en todo momento
            la sección activa e incluye el botón de inicio, que devuelve al
            operador a la pantalla principal de la plataforma.

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.navegacion.fig
        type: figure
        props:
          caption: "El panel lateral con las secciones del módulo y el estado de las integraciones."
          widthPercent: 18

      - id: bot.secciones
        type: icon-table
        props:
          labelHeader: Sección
          descriptionHeader: Descripción
          rows:
            # BOTSidebar.tsx getNavItems — labels from botSidebar.navItems
            - id: bot.seccion.mapa
              label: Mapa
              description: Vista geográfica de la operación.
            - id: bot.seccion.prt
              label: PRT
              description: Personal y vehículos desplegados en vía.
            - id: bot.seccion.recursos
              label: Recursos
              description: Monitoreo y despacho operativo en tiempo real.
            - id: bot.seccion.cctv
              label: CCTV
              description: Video de las cámaras del sistema.
            - id: bot.seccion.pmv
              label: PMV
              description: Paneles de mensajería variable.
            - id: bot.seccion.alarmas
              label: Alarmas
              description: Supervisión y reconocimiento de alarmas.
            # BOTSidebar.tsx — "ars" is a nav item with its own sub-item
            # ("Exportar CSV"), not just a status-only integration anymore.
            - id: bot.seccion.ars
              label: ARS
              description: >-
                Estado de la integración con el sistema de semaforización y
                exportación de su historial de tráfico.

      - id: bot.integraciones.header
        type: detail-header
        props:
          text: Estado de las integraciones

      - id: bot.integraciones.intro
        type: prose
        props:
          text: >-
            En la parte inferior del panel lateral se listan otras
            integraciones del sistema. Estos elementos **no son secciones
            navegables**: cada uno indica únicamente si la integración se
            encuentra activa. El estado de ARS se muestra junto a su propia
            sección, más arriba en el panel.

      - id: bot.integraciones
        type: data-table
        props:
          labelHeader: Integración
          descriptionHeader: Descripción
          rows:
            # BOTSidebar.tsx — items marked `statusOnly: true`. ARS moved out
            # of this table: it is no longer status-only, see bot.seccion.ars
            # and the ARS subsection below.
            - id: bot.integracion.citra
              label: CITRA
              description: Integración con la plataforma CITRA.
            - id: bot.integracion.icad
              label: ICAD
              description: Integración con la plataforma ICAD.
            - id: bot.integracion.avl
              label: AVL
              description: Seguimiento automático de vehículos.

      - id: bot.integraciones.refresco
        type: callout
        props:
          variant: info
          text: >-
            El estado de las integraciones se actualiza automáticamente cada 30
            segundos. No es necesario recargar la pantalla.

  # ================================================================== Mapa ===
  - id: bot.mapa
    title: Mapa
    children:
      - id: bot.mapa.que-hace
        type: prose
        props:
          text: >-
            Presenta la operación sobre el mapa: la ubicación de los paneles de
            mensajería variable, los vehículos con seguimiento automático, los
            puntos semaforizados y las cámaras disponibles. Es la vista inicial
            del módulo.

      - id: bot.mapa.como-llegar
        type: prose
        props:
          text: >-
            Diríjase a **Mapa** en el panel lateral. Es la sección que se
            muestra al ingresar al módulo.

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.mapa.fig
        type: figure
        props:
          caption: "La operación sobre el mapa: paneles, vehículos, puntos semaforizados y cámaras."
          widthPercent: 90

      - id: bot.mapa.funciones
        type: term-list
        props:
          entries:
            - id: bot.mapa.fn.capas
              term: Control de capas
              definition: >-
                Activa y desactiva de forma independiente cada tipo de elemento
                sobre el mapa.
            - id: bot.mapa.fn.tipo
              term: Tipo de mapa
              definition: Alterna entre las vistas estándar, satelital y de tráfico.
            - id: bot.mapa.fn.camara
              term: Acceso directo a una cámara
              definition: >-
                Al seleccionar una cámara sobre el mapa, el módulo abre el
                mosaico de CCTV en vista individual con esa cámara ya cargada.
            # GlobalGoogleMap.tsx:404,534 (dimmable prop, passed true from
            # PMVPage.tsx for this map) — es.json → mapDimControl.
            - id: bot.mapa.fn.atenuar
              term: Atenuar Mapa
              definition: >-
                Reduce el brillo del mapa mediante un control deslizante de
                **Opacidad del Mapa**, para resaltar los elementos superpuestos.

      # ---------------------------------------------------- Tarjetas de paneles ---
      # NEW integration: PMVPage.tsx:145 passes panelPresentation="cards" to
      # GlobalGoogleMap — the BoT map is the ONLY map in the product that does;
      # every other GlobalGoogleMap mount (the Home map among them) keeps the
      # default "infoWindow" (GlobalGoogleMap.tsx:162), so panel pins there still
      # open the pre-existing pop-up and show no card. Restricted here to [mv]
      # rather than the module's own [mv, demo]: the "Panel" entry in the layer
      # selector — the only control that turns the layer on — only exists when
      # `config.name === "MV"` (LayersMap.tsx:136-138), so a demo operator has no
      # way to switch the layer on and never sees a panel, a pin or a card.
      - id: bot.mapa.paneles.header
        type: detail-header
        props:
          text: Tarjetas de los paneles en el mapa
        when:
          tenant: [mv]

      - id: bot.mapa.paneles.que-hace
        type: prose
        props:
          text: >-
            Con la capa de Panel activa, cada panel de mensajería variable se
            muestra sobre el mapa como una tarjeta compacta, separada de su
            marcador y unida a él por una línea. La tarjeta reproduce en vivo
            el mensaje que el panel está mostrando en ese momento, con la
            misma sucesión de páginas y la misma duración configuradas al
            programarlo.
        when:
          tenant: [mv]

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.mapa.paneles.fig
        type: figure
        props:
          caption: "Los paneles sobre el mapa, cada uno con su tarjeta de mensaje en vivo."
          widthPercent: 90
        when:
          tenant: [mv]

      - id: bot.mapa.paneles.funciones
        type: term-list
        props:
          entries:
            - id: bot.mapa.paneles.fn.encabezado
              term: Encabezado de la tarjeta
              definition: >-
                Identifica el panel por su nombre y, cuando el panel tiene
                sentido de circulación asignado, lo indica junto al nombre.
            - id: bot.mapa.paneles.fn.ubicacion
              term: Ubicación de la tarjeta
              definition: >-
                La plataforma la ubica en un espacio libre cercano al panel,
                de modo que no cubra su marcador, otro elemento del mapa ni
                otra tarjeta. Cuando varios paneles quedan muy próximos entre
                sí en el nivel de acercamiento actual, sus tarjetas y líneas
                se ocultan hasta acercar el mapa lo suficiente para
                separarlos.
            - id: bot.mapa.paneles.fn.ventanas
              term: Ventanas de información abiertas
              definition: >-
                Ninguna tarjeta cubre una ventana de información que esté
                abierta sobre otro elemento del mapa.
        when:
          tenant: [mv]

      - id: bot.mapa.paneles.expandir
        type: procedure
        props:
          lead: >-
            Para ver el mensaje completo de un panel, y activarlo o
            desactivarlo desde el propio mapa, siga estos pasos.
          steps:
            - id: bot.mapa.paneles.paso.abrir
              layout: beside
              title: Seleccione la tarjeta o el marcador del panel
              text: >-
                Haga clic sobre la tarjeta del panel, o sobre su marcador en
                el mapa. La tarjeta se expande y muestra el mensaje completo.
            # PanelCard.tsx:207-211 — literal button text, not an i18n key:
            # "Desactivar panel" / "Reactivar panel".
            - id: bot.mapa.paneles.paso.accionar
              layout: beside
              title: Active o desactive el panel, si lo necesita
              text: >-
                La tarjeta expandida ofrece el botón **Desactivar panel** o,
                si el panel ya estaba desactivado, **Reactivar panel**.
            - id: bot.mapa.paneles.paso.cerrar
              layout: beside
              title: Cierre la tarjeta
              text: >-
                Haga clic en cualquier otro punto del mapa para volver a
                colapsarla.
        when:
          tenant: [mv]

  # =================================================================== PRT ===
  - id: bot.prt
    title: PRT
    children:
      - id: bot.prt.que-hace
        type: prose
        props:
          text: >-
            Consolida el personal y los vehículos desplegados en vía, con su
            asignación de zona, horario y punto de control. Permite verificar de
            un vistazo quién está en servicio y dónde.

      - id: bot.prt.como-llegar
        type: prose
        props:
          text: Diríjase a **PRT** en el panel lateral.

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.prt.fig
        type: figure
        props:
          caption: "El personal y los vehículos desplegados en vía, con su asignación."
          widthPercent: 90

      - id: bot.prt.columnas
        type: data-table
        props:
          labelHeader: Columna
          descriptionHeader: Descripción
          rows:
            # locales → prtPage.tableHeaders
            - id: bot.prt.col.cedula
              label: Cédula
              description: Documento de identidad del agente.
            - id: bot.prt.col.nombre
              label: Nombres y Apellidos
              description: Nombre completo del agente.
            - id: bot.prt.col.seccion
              label: Sección
              description: Sección a la que pertenece.
            - id: bot.prt.col.horario
              label: Horario
              description: Franja horaria de su turno.
            - id: bot.prt.col.vehiculo
              label: Vehículo
              description: Tipo de vehículo asignado.
            - id: bot.prt.col.placa
              label: Placa
              description: Placa del vehículo.
            - id: bot.prt.col.zona
              label: Zona / SubZona
              description: Área geográfica de responsabilidad.
            - id: bot.prt.col.punto
              label: Punto de Control
              description: Ubicación puntual asignada dentro de la zona.
            - id: bot.prt.col.observaciones
              label: Observaciones
              description: Anotaciones registradas sobre el agente o su turno.

      - id: bot.prt.buscar
        type: procedure
        props:
          lead: Para localizar a un agente o a un vehículo, siga estos pasos.
          steps:
            - id: bot.prt.paso.buscar
              layout: beside
              title: Escriba el criterio de búsqueda
              text: >-
                Use el campo de búsqueda. Admite nombre, cédula, placa o
                vehículo, de forma indistinta.
            - id: bot.prt.paso.filtrar
              layout: beside
              title: Acote por tipo de vehículo
              text: >-
                El selector de vehículo permite restringir el listado a un tipo
                en particular. La opción **Todos los vehículos** lo restablece.
            - id: bot.prt.paso.limpiar
              layout: beside
              title: Restablezca el listado
              text: >-
                El botón **Limpiar** descarta todos los filtros aplicados. Si
                ninguna fila coincide, la plataforma indica que no hay
                resultados para los filtros aplicados.

  # ============================================================== Recursos ===
  - id: bot.recursos
    title: Recursos
    children:
      - id: bot.recursos.que-hace
        type: prose
        props:
          text: >-
            Permite el monitoreo y el despacho operativo en tiempo real. Desde
            aquí se asigna un recurso a un incidente, se registra su llegada al
            sitio, se cierra su atención y se dejan observaciones.

      - id: bot.recursos.como-llegar
        type: prose
        props:
          text: Diríjase a **Recursos** en el panel lateral.

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.recursos.fig
        type: figure
        props:
          caption: "El listado de recursos desde donde se monitorea y despacha."
          widthPercent: 90

      - id: bot.recursos.columnas
        type: data-table
        props:
          labelHeader: Columna
          descriptionHeader: Descripción
          rows:
            # locales → resourcesManagmentPage.columns
            - id: bot.recursos.col.recurso
              label: Recurso
              description: Identificación del recurso.
            # Columns.tsx — a colour dot on the mobile-app icon reflects the
            # agent's real-time status when both shift_mobile and broad_mobile
            # are true.
            # Columns.tsx:107-124 — agentMobileFilter, fixedOptions "Sin
            # Mobile"/"Con Mobile"/"Comp. Activa"/"Comp. Inactiva" (literal
            # strings, not i18n keys). useResourcesTable.ts:44-48.
            - id: bot.recursos.col.agente
              label: Agente
              description: >-
                Agente a cargo. Un punto de color junto al ícono de la app
                móvil indica su estado en tiempo real. La columna puede
                filtrarse por conectividad móvil: **Sin Mobile**, **Con
                Mobile**, **Comp. Activa** o **Comp. Inactiva**.
            - id: bot.recursos.col.placa
              label: Placa
              description: Placa del vehículo asociado.
            - id: bot.recursos.col.seccion
              label: Sección
              description: Sección a la que pertenece.
            - id: bot.recursos.col.punto
              label: Pto. Ctrl
              description: Punto de control asignado.
            - id: bot.recursos.col.turno
              label: Turno
              description: Turno en curso.
            - id: bot.recursos.col.zona
              label: Zona
              description: Área geográfica de responsabilidad.
            - id: bot.recursos.col.pj
              label: PJ
              description: Indica si el recurso está marcado como Policía Judicial.
            - id: bot.recursos.col.despacho
              label: Despacho
              description: >-
                Muestra **ASIGNAR** cuando el recurso está libre y **ASIGNADO**
                cuando ya atiende un incidente.

      - id: bot.recursos.asignar
        type: procedure
        props:
          lead: Para asignar un recurso a un incidente, siga estos pasos.
          steps:
            - id: bot.recursos.paso.ubicar
              layout: beside
              title: Ubique el recurso
              text: >-
                Use el campo de búsqueda o el filtro por columna hasta encontrar
                el recurso disponible.
            - id: bot.recursos.paso.asignar
              layout: beside
              title: Abra la asignación
              text: >-
                En la columna **Despacho**, accione **ASIGNAR**. La plataforma
                abre la ventana *Asignar recurso a un incidente*, con el recurso
                y su placa a la vista.
            - id: bot.recursos.paso.caso
              layout: beside
              title: Elija el incidente
              text: >-
                Seleccione el caso de la lista y confirme con **Confirmar
                asignación**. Si no hay casos disponibles, la plataforma lo
                indica y permite volver a la lista.
            - id: bot.recursos.paso.resultado
              layout: beside
              title: Verifique el resultado
              text: >-
                La columna **Despacho** pasa a mostrar **ASIGNADO**. Al
                accionarla nuevamente se abre el detalle del incidente, desde
                donde puede registrar **Recurso en sitio**, **Finalizar
                atención** o **Desasignar**.

      - id: bot.recursos.pj
        type: procedure
        props:
          lead: Para marcar un recurso como Policía Judicial, siga estos pasos.
          steps:
            - id: bot.recursos.paso.pj-accionar
              layout: beside
              title: Accione la marca en la columna PJ
              text: >-
                La plataforma solicita confirmación antes de aplicar el cambio,
                indicando el recurso y la acción a realizar.
            # ResourcesTable.tsx — pjType radio ("En Puertas" / "Emergente"),
            # required only when marking (Confirmar stays deshabilitado sin
            # elección); no aplica al desmarcar.
            - id: bot.recursos.paso.pj-tipo
              layout: beside
              title: Elija el tipo, si está marcando
              text: >-
                Al marcar un recurso que todavía no es Policía Judicial, elija
                el tipo: **En Puertas** o **Emergente**. Al desmarcar uno ya
                marcado, este paso no aplica.
            - id: bot.recursos.paso.pj-confirmar
              layout: beside
              title: Confirme
              text: >-
                Al confirmar, la plataforma informa que el recurso quedó marcado
                como Policía Judicial. La misma acción, sobre un recurso ya
                marcado, lo desmarca.

      - id: bot.recursos.historial.header
        type: detail-header
        props:
          text: Historial de casos de un recurso

      - id: bot.recursos.historial.intro
        type: prose
        props:
          text: >-
            Cada recurso tiene un acceso a su historial de casos atendidos
            durante el turno en curso.

      - id: bot.recursos.historial
        type: procedure
        props:
          lead: Para consultar el historial de casos de un recurso, siga estos pasos.
          steps:
            - id: bot.recursos.paso.historial-abrir
              layout: beside
              title: Accione el ícono de historial de la fila
              text: >-
                La plataforma abre el historial del recurso, identificado por
                su código de vehículo y su placa.
            - id: bot.recursos.paso.historial-consultar
              layout: beside
              title: Revise los casos listados
              text: >-
                Cada caso muestra su tipo y su estado. Si no hay casos para el
                recurso en el turno, la plataforma lo indica.
            - id: bot.recursos.paso.historial-abrir-caso
              layout: beside
              title: Abra un caso, si lo necesita
              text: >-
                Al seleccionar un caso de la lista, la plataforma lo lleva al
                detalle de ese incidente.

      - id: bot.recursos.observacion.header
        type: detail-header
        props:
          text: Observaciones sobre un recurso

      - id: bot.recursos.observacion.texto
        type: prose
        props:
          text: >-
            La columna **Observ.** permite agregar, editar y eliminar
            anotaciones sobre el recurso. La plataforma no guarda una
            observación vacía ni una sin cambios, y solicita confirmación antes
            de eliminar.

  # ================================================================== CCTV ===
  - id: bot.cctv
    title: CCTV
    children:
      - id: bot.cctv.que-hace
        type: prose
        props:
          text: >-
            Da acceso al video de las cámaras del sistema, en vivo, con control
            de movimiento sobre las cámaras que lo admiten.

      - id: bot.cctv.como-llegar
        type: prose
        props:
          text: >-
            Despliegue **CCTV** en el panel lateral y seleccione **Mosaico**.
            También se llega seleccionando una cámara directamente sobre el
            mapa, lo que abre el mosaico en vista individual con esa cámara ya
            cargada.

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.cctv.fig
        type: figure
        props:
          caption: "El mosaico de cámaras con la lista de cámaras disponibles."
          widthPercent: 90

      - id: bot.cctv.funciones
        type: field-list
        props:
          items:
            - id: bot.cctv.fn.lista
              label: Lista de cámaras
              text: >-
                Permite buscar por alias, identificador o nombre. Indica cuántas
                cámaras coinciden y advierte cuando no se encuentra ninguna.
              # -35% of the 70% that `figure.figure--item img` caps item figures
              # at — this item declared no width, so 70 is the real base.
              widthPercent: 46
            - id: bot.cctv.fn.grilla
              label: Grilla del mosaico
              text: >-
                Define cuántas cámaras se visualizan de forma simultánea. La
                vista individual corresponde a una sola cámara en pantalla.
            - id: bot.cctv.fn.estado
              label: Estado de la transmisión
              text: >-
                Una cámara sin video muestra **SIN SEÑAL**, y una que perdió
                conexión muestra **FUERA DE COMUNICACIONES**. La opción de
                reintentar conexión vuelve a solicitar la transmisión.
            - id: bot.cctv.fn.ptz
              label: Control PTZ
              text: >-
                Sobre las cámaras que lo admiten, permite desplazar la vista en
                ocho direcciones y acercar o alejar la imagen.

      - id: bot.cctv.preset
        type: procedure
        props:
          lead: Para guardar y reutilizar una posición de cámara, siga estos pasos.
          steps:
            - id: bot.cctv.paso.encuadrar
              layout: beside
              title: Encuadre la vista
              text: >-
                Con el control PTZ, desplace la cámara y ajuste el zoom hasta
                obtener el encuadre deseado.
            - id: bot.cctv.paso.nombrar
              layout: beside
              title: Nombre la posición
              text: >-
                En **Presets de posición**, escriba un nombre y accione
                **Guardar posición actual**.
            - id: bot.cctv.paso.reutilizar
              layout: beside
              title: Reutilice la posición
              text: >-
                El preset queda listado y puede invocarse en cualquier momento
                para devolver la cámara a ese encuadre. También puede
                eliminarse. Si no hay ninguno guardado, la plataforma lo indica.

  # ======================================================= PMV Programación ===
  - id: bot.pmv-programacion
    title: PMV — Programación
    children:
      - id: bot.pmv.que-hace
        type: prose
        props:
          text: >-
            Permite crear y editar el mensaje que se mostrará en uno o varios
            paneles de mensajería variable, junto con su vigencia.

      - id: bot.pmv.como-llegar
        type: prose
        props:
          text: Despliegue **PMV** en el panel lateral y seleccione **Programación**.

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.pmv.fig
        type: figure
        props:
          caption: "El formulario de programación de un mensaje y su vigencia."
          widthPercent: 90

      - id: bot.pmv.programar
        type: procedure
        props:
          lead: Para programar un mensaje, siga estos pasos.
          steps:
            # Field labels from locales → pmv.programming
            - id: bot.pmv.paso.identificar
              layout: beside
              title: Identifique el mensaje
              text: >-
                Indique el **Título Interno**. Este título identifica el mensaje
                dentro de la plataforma y no se muestra en el panel. Seleccione
                a continuación el **Tipo** de mensaje.
            - id: bot.pmv.paso.clasificar
              layout: beside
              title: Clasifique el mensaje
              text: >-
                De forma opcional, asocie el mensaje a una **Familia de
                Mensajes** y a una **Subfamilia**. La clasificación permite
                reutilizar mensajes predefinidos y ordenar el catálogo.
            - id: bot.pmv.paso.destino
              layout: beside
              title: Seleccione los paneles de destino
              text: >-
                Elija un **Grupo de Paneles** o seleccione los paneles de forma
                individual. No es posible combinar ambas formas: si ya
                seleccionó paneles sueltos, la plataforma advierte antes de
                aplicar un grupo, y a la inversa.
            - id: bot.pmv.paso.contenido
              layout: beside
              title: Componga el contenido
              text: >-
                Defina las **Páginas del Panel** y el **Texto a Mostrar** de
                cada una. Cada página tiene su propia duración en segundos, y
                pueden agregarse o eliminarse páginas según sea necesario. El
                texto de una página no puede quedar vacío. Si corresponde,
                seleccione un **Pictograma**.
            # pmv.programming.flash / flashLevels — PMVProgramming.tsx, per-page
            # flash slider.
            - id: bot.pmv.paso.parpadeo
              layout: beside
              title: Configure el parpadeo de la página
              text: >-
                Cada página admite un nivel de **Parpadeo** independiente:
                **Sin parpadeo**, **Lento**, **Normal**, **Rápido** o **Muy
                rápido**.
            # pmv.programming.dateRange / schedules / addScheduleButton —
            # PMVProgramming.tsx, multi-day schedules added since this module
            # was last written.
            - id: bot.pmv.paso.vigencia
              layout: beside
              title: Defina la vigencia y los horarios
              text: >-
                Establezca el **Rango de Fechas** durante el cual el mensaje
                estará vigente. Luego defina uno o varios **Horarios**: cada uno
                combina los días de la semana en que rige y una franja horaria
                de inicio y fin, y pueden agregarse tantos como se necesiten. La
                plataforma no permite guardar con un rango inválido o vencido, y
                advierte cuando el mensaje entra en conflicto de programación
                con otro ya existente sobre el mismo panel.
            - id: bot.pmv.paso.guardar
              layout: beside
              title: Guarde el mensaje
              text: >-
                Al guardar, la plataforma lo redirige a **PMV › Gestión**, donde
                el mensaje queda listado.

      # PMVProgramming.tsx:922-925 — a conflict normally blocks saving; marking
      # the message priority allows saving anyway (`conflicts.length === 0 ||
      # priority`), and the warning banner turns from red to amber and states
      # the consequence (es.json → pmv.programming.scheduleConflictsPriority).
      - id: bot.pmv.prioritario
        type: callout
        props:
          variant: important
          text: >-
            Un mensaje marcado como **Mensaje Prioritario** puede guardarse
            aunque exista un conflicto de programación con otro mensaje sobre
            el mismo panel: la advertencia de conflicto cambia de color e
            indica que el mensaje prioritario lo reemplaza. Verifique la
            vigencia antes de guardarlo.

      # PMVPage.tsx — leaving Programación con cambios sin guardar, hacia
      # cualquier otra pestaña, pide confirmación
      # (pmv.programming.unsavedChangesTitle/Body).
      - id: bot.pmv.salir-sin-guardar
        type: callout
        props:
          variant: info
          text: >-
            Si intenta salir de esta pantalla con cambios sin guardar, la
            plataforma le pide confirmación antes de descartarlos.

  # =========================================================== PMV Calendario ===
  # botSidebar.navItems.calendario — "Calendario" (was documented as "Gestión";
  # re-verified 2026-09-25 against the current sidebar label).
  - id: bot.pmv-gestion
    title: PMV — Calendario
    children:
      - id: bot.pmv-gestion.que-hace
        type: prose
        props:
          text: >-
            Lista los mensajes existentes con su estado y su vigencia, y permite
            editarlos, activarlos o desactivarlos.

      - id: bot.pmv-gestion.como-llegar
        type: prose
        props:
          text: >-
            Despliegue **PMV** en el panel lateral y seleccione **Calendario**.
            La plataforma también lo trae aquí al guardar un mensaje nuevo.

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.pmv-gestion.fig
        type: figure
        props:
          caption: "El listado de mensajes existentes con su estado y su vigencia."
          widthPercent: 90

      - id: bot.pmv-gestion.filtros
        type: term-list
        props:
          entries:
            # locales → pmv.calendar
            - id: bot.pmv-gestion.f.busqueda
              term: Búsqueda
              definition: Localiza un mensaje por su título o por su texto.
            - id: bot.pmv-gestion.f.paneles
              term: Todos Los Paneles
              definition: Restringe el listado a los mensajes de un panel.
            - id: bot.pmv-gestion.f.familias
              term: Todas las familias
              definition: Restringe por familia o subfamilia de mensajes.
            - id: bot.pmv-gestion.f.tipos
              term: Todos los tipos
              definition: Restringe por tipo de mensaje.
            - id: bot.pmv-gestion.f.estados
              term: Todos los estados
              definition: Restringe por estado de ejecución.

      - id: bot.pmv-gestion.estados
        type: data-table
        props:
          labelHeader: Estado
          descriptionHeader: Significado
          rows:
            - id: bot.pmv-gestion.e.corriendo
              label: Corriendo
              description: El mensaje se está mostrando en el panel en este momento.
            - id: bot.pmv-gestion.e.pendiente
              label: Pendiente
              description: Programado, aún no alcanzó su ventana de vigencia.
            - id: bot.pmv-gestion.e.desactivado
              label: Desactivado
              description: Retirado de la programación.

      # PMVCalendar.tsx — the event detail popup now also previews the
      # message content (pmv.calendar.detailMessage), page by page when the
      # message has more than one.
      - id: bot.pmv-gestion.detalle
        type: prose
        props:
          text: >-
            El detalle de cada mensaje indica su **Horario**, su **Vigencia**,
            su **Familia**, su **Grupo**, los **Paneles** afectados y el
            texto del mensaje, página por página si tiene más de una. Los
            mensajes prioritarios se distinguen con una marca.

      - id: bot.pmv-gestion.desactivar
        type: procedure
        props:
          lead: Para desactivar un mensaje, siga estos pasos.
          steps:
            - id: bot.pmv-gestion.paso.desactivar
              layout: beside
              title: Accione Desactivar sobre el mensaje
              text: >-
                Si el mensaje no se está ejecutando, se desactiva de inmediato.
            - id: bot.pmv-gestion.paso.elegir
              layout: beside
              title: Elija cómo retirarlo si está corriendo
              text: >-
                Cuando el mensaje se está ejecutando, la plataforma pregunta
                cómo desea desactivarlo y ofrece **Esperar a que termine** o
                **Quitar ya**.
            - id: bot.pmv-gestion.paso.reactivar
              layout: beside
              title: Reactive si corresponde
              text: >-
                Un mensaje desactivado puede volver a ponerse en circulación con
                **Activar**, siempre que su vigencia siga siendo válida.

  # ============================================================ PMV Registros ===
  # NEW submodule (a89a20ff, feat(pmv): add message list tab). Sidebar label is
  # "Registros" (botSidebar.navItems.lista, renamed from "Lista" in 620aad9b).
  - id: bot.pmv-registros
    title: PMV — Registros
    children:
      - id: bot.pmv-registros.que-hace
        type: prose
        props:
          text: >-
            Lista el histórico de mensajes creados, con sus paneles, sus días y
            horarios de programación y quién los creó o actualizó por última
            vez. Desde aquí también se exporta el listado y se consulta el
            registro de actividad de la programación.

      - id: bot.pmv-registros.como-llegar
        type: prose
        props:
          text: Despliegue **PMV** en el panel lateral y seleccione **Registros**.

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.pmv-registros.fig
        type: figure
        props:
          caption: "El histórico de mensajes, con sus filtros, su exportación y su registro de actividad."
          widthPercent: 90

      - id: bot.pmv-registros.columnas
        type: data-table
        props:
          labelHeader: Columna
          descriptionHeader: Descripción
          rows:
            # locales → pmv.management.list.columns
            - id: bot.pmv-registros.col.titulo
              label: Título
              description: Título interno con el que se identificó el mensaje.
            - id: bot.pmv-registros.col.texto
              label: Texto
              description: Contenido mostrado en la primera página del mensaje.
            # PMVMessageList.tsx:275-292 — renderTargets: beyond dos paneles
            # sueltos, la columna agrega un indicador "+N" con un listado
            # completo al pasar el cursor.
            - id: bot.pmv-registros.col.panel
              label: Panel
              description: >-
                Paneles de destino. Si el mensaje se programó por grupo,
                muestra el nombre del grupo; si se programó sobre varios
                paneles sueltos, muestra el primero y un indicador **+N** que,
                al pasar el cursor, despliega el listado completo.
            - id: bot.pmv-registros.col.dias
              label: Días
              description: Días de la semana en que el mensaje está programado.
            - id: bot.pmv-registros.col.horarios
              label: Horarios
              description: Franjas horarias configuradas para el mensaje.
            - id: bot.pmv-registros.col.creado
              label: Creado por
              description: Usuario que creó el mensaje.
            - id: bot.pmv-registros.col.actualizado
              label: Actualizado por
              description: Usuario que realizó la última modificación.

      - id: bot.pmv-registros.funciones
        type: term-list
        props:
          entries:
            # locales → pmv.management.list — search + selects + optional-column
            # toggles (Tipo/Familia/Subfamilia) + date range.
            - id: bot.pmv-registros.f.busqueda
              term: Búsqueda y filtros
              definition: >-
                Localiza mensajes por título o texto, y permite acotar por
                panel, familia, subfamilia, tipo, usuario creador y rango de
                fechas.
            - id: bot.pmv-registros.f.columnas
              term: Columnas opcionales
              definition: >-
                Muestra u oculta las columnas **Tipo**, **Familia** y
                **Subfamilia** del listado.

      - id: bot.pmv-registros.exportar
        type: procedure
        props:
          lead: Para exportar el listado de mensajes, siga estos pasos.
          steps:
            - id: bot.pmv-registros.paso.filtrar
              layout: beside
              title: Aplique los filtros deseados
              text: >-
                La exportación respeta el usuario creador y el rango de fechas
                seleccionados.
            - id: bot.pmv-registros.paso.exportar
              layout: beside
              title: Accione Exportar
              text: >-
                La plataforma descarga un archivo CSV con el listado. Si la
                exportación falla, lo indica.

      - id: bot.pmv-registros.logs.header
        type: detail-header
        props:
          text: Registro de actividad

      - id: bot.pmv-registros.logs.intro
        type: prose
        props:
          text: >-
            El botón **Registros** abre el historial de acciones realizadas
            sobre mensajes, paneles, grupos, familias, subfamilias y mensajes
            predefinidos: quién hizo qué y cuándo.

      - id: bot.pmv-registros.logs.funciones
        type: term-list
        props:
          entries:
            # locales → pmv.logs — filters (action/entityType/entityId/operator/dates)
            - id: bot.pmv-registros.logs.f.filtros
              term: Filtros
              definition: >-
                Acota el registro por acción, tipo de entidad, ID de entidad,
                operador y rango de fechas.
            - id: bot.pmv-registros.logs.f.paneles
              term: Detalle de paneles
              definition: >-
                Una acción sobre mensajes indica, cuando aplica, cuántos
                paneles quedaron en blanco, activados o fallidos.

  # ========================================================== PMV Predeterminados ===
  # botSidebar.navItems.variables — "Predeterminados" (was documented as
  # "Variables"; re-verified 2026-09-25, 620aad9b). The header's internal tab
  # caption (BOTHeader.tsx TAB_LABELS) still reads "PMV - Variables" — that is
  # the product's own top-bar caption, not the clickable sidebar label the
  # operator actually reads to navigate here.
  - id: bot.pmv-variables
    title: PMV — Predeterminados
    children:
      - id: bot.pmv-variables.que-hace
        type: prose
        props:
          text: >-
            Administra los elementos reutilizables de la programación: la
            clasificación de los mensajes, las agrupaciones de paneles y los
            textos predefinidos.

      - id: bot.pmv-variables.como-llegar
        type: prose
        props:
          text: >-
            Despliegue **PMV** en el panel lateral y seleccione
            **Predeterminados**.

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.pmv-variables.fig
        type: figure
        props:
          caption: "La administración de clasificaciones, agrupaciones y textos predefinidos."
          widthPercent: 90

      - id: bot.pmv-variables.secciones
        type: field-list
        props:
          items:
            # locales → pmv.variables
            # PMVFamilyList.tsx — deleting asks the API on demand rather than
            # trusting a stale count: a family is blocked while it still has
            # subfamilies (familyHasSubfamilies, es.json:1915-1916) and a
            # subfamily is blocked while it still has messages
            # (subfamilyHasMessages). Expanding a subfamily lists its
            # messages, each with a button that opens it in Programación.
            - id: bot.pmv-variables.s.familias
              label: Familias
              text: >-
                Clasificación de los mensajes en familias y subfamilias. Cada
                familia indica cuántos elementos contiene, y puede editarse.
                No puede eliminarse mientras tenga subfamilias, ni una
                subfamilia mientras tenga mensajes: la plataforma lo indica.
                Al desplegar una subfamilia se listan sus mensajes, cada uno
                con un acceso directo para abrirlo en **Programación** y
                editarlo; si no tiene ninguno, la plataforma lo indica.
            - id: bot.pmv-variables.s.grupos
              label: Grupos
              text: >-
                Agrupaciones de paneles que se aplican de una sola vez al
                programar. Cada grupo indica cuántos paneles reúne, y puede
                editarse o eliminarse.
            - id: bot.pmv-variables.s.predefinidos
              label: Mensajes Predefinidos
              text: >-
                Textos guardados para reutilizar al componer una página, sin
                volver a escribirlos. Cada uno puede editarse o eliminarse.

      - id: bot.pmv-variables.grupo
        type: procedure
        props:
          lead: Para crear un grupo de paneles, siga estos pasos.
          steps:
            - id: bot.pmv-variables.paso.anadir
              layout: beside
              title: Inicie la creación
              text: Accione **Añadir Grupo** en la sección de grupos.
            - id: bot.pmv-variables.paso.nombrar
              layout: beside
              title: Nombre el grupo
              text: >-
                Indique el nombre con el que aparecerá al programar un mensaje.
            - id: bot.pmv-variables.paso.seleccionar
              layout: beside
              title: Seleccione los paneles
              text: >-
                Elija los paneles que formarán parte del grupo y guarde. La
                plataforma confirma la creación y el grupo queda disponible en
                **Programación**.

  # PMV Monitoreo and PMV Auditoria were REMOVED, not left undocumented.
  #
  # Both panes exist in the product — PMVPage renders them and BOTSidebar
  # declares "monitoreo" and "auditoria" in its Tab union — but NOTHING ever
  # sets activeTab to either. There is no sidebar entry and no setActiveTab call
  # anywhere in the source, so an operator cannot reach either screen.
  #
  # The product is the source of truth. Documenting a screen nobody can open
  # sends the reader hunting through a menu for something that is not there,
  # which is worse than an absent section. If the entries come back, restore
  # these from git history rather than rewriting them.

  # ============================================================== Alarmas ===
  - id: bot.alarmas
    title: Alarmas
    children:
      - id: bot.alarmas.que-hace
        type: prose
        props:
          text: >-
            Permite supervisar, filtrar y reconocer las alarmas del sistema. El
            reconocimiento deja constancia de que un operador se hizo cargo de
            la alarma.

      # columns.tsx SHORT_ERROR_BITS + alarmsPage.pmvErrors — panel-hardware
      # faults reported by PMV now surface here alongside ARS alarms.
      - id: bot.alarmas.origenes
        type: callout
        props:
          variant: info
          text: >-
            Las alarmas provienen de dos orígenes: el sistema de semaforización
            (**ARS**) y los paneles de mensajería variable (**PMV**), que
            reportan aquí sus propias fallas de hardware — de comunicación, de
            energía, de lámpara, de píxeles, entre otras.

      - id: bot.alarmas.como-llegar
        type: prose
        props:
          text: Diríjase a **Alarmas** en el panel lateral.

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.alarmas.fig
        type: figure
        props:
          caption: "El listado de alarmas desde donde se supervisan y se reconocen."
          widthPercent: 90

      - id: bot.alarmas.columnas
        type: data-table
        props:
          labelHeader: Columna
          descriptionHeader: Descripción
          rows:
            # locales → alarmsPage.columns
            - id: bot.alarmas.col.fecha
              label: Fecha
              description: Momento en que se generó la alarma.
            - id: bot.alarmas.col.estado
              label: Estado
              description: Indica si la alarma está activa o inactiva.
            - id: bot.alarmas.col.alarma
              label: Alarma
              description: Descripción de la condición detectada.
            - id: bot.alarmas.col.nivel
              label: Nivel
              description: Criticidad de la alarma.
            - id: bot.alarmas.col.origen
              label: Origen
              description: Sistema que la reportó — ARS o PMV.
            - id: bot.alarmas.col.recurso
              label: Recurso
              description: >-
                Recurso afectado: la cámara y su ubicación para una alarma de
                ARS, o el panel para una alarma de PMV.
            # columns.tsx — once acknowledged, shows the operator's comment
            # plus who acknowledged it and when (acknowledgment_by/_at).
            - id: bot.alarmas.col.gestion
              label: Gestión
              description: >-
                Estado de atención de la alarma. Una alarma reconocida
                muestra el comentario registrado, junto con quién la
                reconoció y cuándo.

      - id: bot.alarmas.reconocer
        type: procedure
        props:
          lead: Para reconocer una o varias alarmas, siga estos pasos.
          steps:
            - id: bot.alarmas.paso.filtrar
              layout: beside
              title: Acote el listado
              text: >-
                Filtre por columna o use la búsqueda para ubicar las alarmas que
                va a atender. **Limpiar** descarta los filtros aplicados.
            - id: bot.alarmas.paso.seleccionar
              layout: beside
              title: Seleccione las alarmas
              text: >-
                Marque una o varias. La plataforma indica cuántas quedaron
                seleccionadas.
            - id: bot.alarmas.paso.reconocer
              layout: beside
              title: Accione Reconocer
              text: >-
                La plataforma abre una ventana de confirmación, que indica si se
                reconoce una alarma o varias, y permite escribir un comentario.
            # AlarmsManagmentPage.tsx — enqueueSnackbar on success
            # (alarmsPage.acknowledgeSuccess / acknowledgeSuccessMany).
            - id: bot.alarmas.paso.resultado
              layout: beside
              title: Verifique el resultado
              text: >-
                Al confirmar, la plataforma muestra un mensaje de
                confirmación y la columna **Gestión** refleja el
                reconocimiento. Si no hay alarmas en el rango consultado, la
                plataforma lo indica.

  # ==================================================================== ARS ===
  # NEW submodule (18308a52, feat(ars): add CSV export modal). "ars" is a
  # BOTSidebar nav item like PMV or CCTV, not merely a status-only integration
  # anymore (see bot.seccion.ars and bot.integraciones above). Its only
  # function is opening this export dialog — it has no work area of its own.
  - id: bot.ars
    title: ARS
    children:
      - id: bot.ars.que-hace
        type: prose
        props:
          text: >-
            Indica el estado de la integración con el sistema de
            semaforización (ARS) y permite exportar su historial de tráfico
            registrado a un archivo CSV.

      - id: bot.ars.como-llegar
        type: prose
        props:
          text: >-
            Despliegue **ARS** en el panel lateral y seleccione **Exportar
            CSV**.

      # Overview figure: the module/submodule at a glance, before any detail.
      - id: bot.ars.fig
        type: figure
        props:
          caption: "El diálogo de exportación de ARS, con el rango de fechas, el intervalo y los cruces."
          widthPercent: 90

      - id: bot.ars.exportar
        type: procedure
        props:
          lead: Para exportar el historial de tráfico de ARS, siga estos pasos.
          steps:
            - id: bot.ars.paso.rango
              layout: beside
              title: Seleccione el rango de fechas
              text: Elija el rango de fechas y horas a exportar en el calendario.
            - id: bot.ars.paso.intervalo
              layout: beside
              title: Elija el intervalo
              text: >-
                Seleccione cada cuánto se agrupan los datos: **Cada minuto**,
                **Cada 5 minutos**, **Cada 15 minutos** o **Cada hora**.
            - id: bot.ars.paso.cruces
              layout: beside
              title: Seleccione los cruces y cámaras
              text: >-
                Marque los cruces y sus cámaras a incluir, o use
                **Seleccionar todo**. Un buscador permite localizar una
                intersección por nombre.
            - id: bot.ars.paso.confirmar
              layout: beside
              title: Confirme la exportación
              text: >-
                La plataforma descarga un archivo CSV con los datos
                seleccionados. Si la exportación falla, o si no se
                seleccionó un rango de fechas, la plataforma lo indica.

