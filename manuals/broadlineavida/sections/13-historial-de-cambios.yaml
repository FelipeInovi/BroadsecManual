# Historial de cambios — the manual's own delivery history.
#
# THIS SECTION IS NOT ABOUT THE PRODUCT, which is what sets it apart from every
# other file here:
#
#  - **No `labels` block, and none is missing.** Nothing below is quoted from
#    Broadsec SIMM. A version number is not a UI label and the column headers
#    are this manual's own words.
#
#  - **No overview figure, and none is missing either.** `module-completeness`
#    opens every module with a screenshot of the whole screen. There is no
#    screen. See `manuals/AGENTS.md`, "Versioning".
#
#  - **It must sort LAST.** `13-` puts it after `12-broadsec-of-things.yaml`,
#    and the build enforces the outcome (`assertChangeLogIsLast`).
#
# THE NUMBERING RESTARTS HERE, and it is not the legacy one.
#
# These rows read 1.0.0 and 1.1.0. They used to read 1.4.7 and 1.5.0, which were
# the numbers of the manual Broadsec maintained BEFORE this pipeline existed —
# 1.4.7 being the delivery this project imported and rebuilt from.
#
# The Broadsec team decided on 2026-08-27 to restart the count: this manual is a
# new document produced by a new system, and continuing someone else's sequence
# only invited the question of which numbering a given PDF belonged to. Nothing
# was ever delivered from this repository under the old numbers — `deliveries/`
# held nothing and no row carried a proof — so no client's document is
# contradicted by the change.
#
# THE TWO ROWS DO NOT BOTH BELONG TO BOTH TENANTS, and that is the whole reason
# the block conditions its rows individually.
#
# 1.0.0 is the manual as it was received: the delivery this project imported and
# rebuilt from. Both tenants have it.
#
# 1.1.0 adds Broadsec of Things, which `12-broadsec-of-things.yaml` declares as
# `when: {tenant: [mv, demo]}` — `med` does not receive that module, so `med`
# must not be told it received that version. Its history ends at 1.0.0. The
# selector below is copied from that section deliberately, `demo` included: if
# `demo` ever becomes a build target, the module and its delivery row appear
# together rather than one without the other.
#
# Verified, not assumed: `build broadlineavida` reports 9 sections for mv and 8
# for med.

id: historial-cambios
title: Historial de cambios
subtitle: Versiones entregadas de este manual

children:
  - id: historial.proposito
    type: prose
    props:
      text: >-
        Esta tabla registra cada versión de este manual entregada al cliente,
        con su fecha y un resumen de lo que esa entrega incorporó. Permite
        confirmar que el ejemplar en uso es el vigente y, cuando no lo es,
        identificar qué cambió desde entonces.

  - id: historial.tabla
    type: change-log
    props:
      versionHeader: Versión
      dateHeader: Fecha
      descriptionHeader: Descripción de cambios
      rows:
        - id: historial.tabla.1-0-0
          version: 1.0.0
          date: 2026-02-28
          delivered:
            med:
              commit: 15c2821bfcd8ad8a309af1037539a668b9bea3ea
              files:
                manual-operador-med-v1.0.0.pdf: 8affd38b7c0c04c6859f30a0bbedb61be9791422ed748e31040081bbf67951ed
                manual-operador-med-v1.0.0.docx: 4fbd16d393c6aa90de6822124cd560979243223bd2c1742c3489dc144f97d57b
          description: >-
            Versión actual documentada en este manual. Incluye mejoras en
            interfaz, Call AI, Fuerzas en Campo y Security Dashboard.

        - id: historial.tabla.1-1-0
          version: 1.1.0
          date: 2026-08-26
          delivered:
            mv:
              commit: cb6f0ebcf1d88b96c106064732324022dd7ae42b
              files:
                manual-operador-mv-v1.1.0.pdf: 5692efaa8e4825972dbd4560f891308a81b603014a0980b997570e9f5170cc2b
                manual-operador-mv-v1.1.0.docx: bcb3f0649641123b76b1eb4ed9b99c1cf9da53956aa95517d78227d7b5af13f7
          # Same selector as the module this row announces. See the note above.
          when:
            tenant: [mv, demo]
          description: >-
            Incorpora el módulo Broadsec of Things, con la gestión de
            dispositivos en campo.

        - id: historial.tabla.1-2-0
          version: 1.2.0
          date: 2026-09-22
          delivered:
            mv:
              commit: 7c000818bbbcd5c03c0489c92f9658d474afbb43
              files:
                manual-operador-mv-v1.2.0.pdf: 5d22f2d44cb62caccfd55aa523db12a149fee7e7557b2069c91dc2c7132fc3ec
                manual-operador-mv-v1.2.0.docx: 997b14493e164edafdfb16fd416a385f0dcf03735e91cb58ca6c6271181d1949
                manual-operador-mv-v1.2.0-notas-de-version.docx: 74440835e6fe2b56ad29936ec137c967f4ee31980d5d72b977b7bd1ee148f27b
          # Names Fuerzas en Campo, which med does not receive.
          when:
            tenant: [mv, demo]
          description: >-
            Amplía **Security Dashboard** y **Fuerzas en Campo** con nuevos
            procedimientos y sus figuras, y completa el catálogo de capas del
            mapa en **Interfaz General**.
