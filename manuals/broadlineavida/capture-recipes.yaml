      - click: "button::-p-text(Exportar CSV)"
    screenIs: "::-p-text(Exportar reporte ARS)"
    dataReady: "::-p-text(Seleccionar todo)"
    clip: '::-p-xpath(//label[contains(text(),"Cruces y c") and contains(text(),"maras")]/parent::div)'
    settleMs: 800
    viewport: { width: 1600, height: 900 }

  # PHOTOGRAPHED, NOT PRESSED — see the boundary note above this section.
  # `actions.acept` is "Aceptar" (es.json), the literal button text.
  - slot: bot.ars.paso.confirmar
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Exportar CSV)"
    screenIs: "::-p-text(Exportar reporte ARS)"
    dataReady: "::-p-text(Seleccionar todo)"
    clip: '::-p-xpath(//button[contains(.,"Aceptar")])'
    settleMs: 800
    viewport: { width: 1600, height: 900 }

  # ---------------------------------------------------------------------
  # Fuerzas en Campo (sections/10-fuerzas-en-campo.yaml). Read-only: these
  # open a profile by clicking a row in a list. Nothing here dispatches,
  # assigns, releases or submits, and no control on an agent is pressed.
  #
  # Both recipes reach the profile the way an operator does, by clicking the
  # first row of the agents list, rather than by navigating to `/#/agent/<id>`.
  # An id typed into a recipe names one agent of a live directory and rots the
  # first time that person leaves.
  # ---------------------------------------------------------------------

  # The BACK control of the top bar, which is why this recipe opens a profile
  # first: `NavigationButtons` renders `canGoBack() && <BackButton />`
  # (components/Back/NavigationButtons.tsx), and a freshly loaded screen has no
  # history, so the button does not exist to photograph. Clicking a row fills
  # the navigation store and the control appears.
  #
  # `data-tip` is the handle for every button of this bar: `MenuBtn`
  # (components/Header/BtnsHeader.tsx:32) writes the tooltip there. It comes
  # from the source, not from a stylesheet, so it does not move with a redesign
  # the way an emotion class hash does.
  - slot: fuerzas.barra.navegacion
    route: /#/home-agents
    steps:
      - click: ".simplebar-content button"
    screenIs: "::-p-text(Intendencia)"
    dataReady: '[data-tip="Atrás"]'
    clip: '[data-tip="Atrás"]'
    viewport: { width: 1600, height: 900 }

  # The Agente tab — the one the profile opens on.
  #
  # `clipUp` rather than a clip of its own: `[role="tab"]` is a stable handle
  # and `div.w-full` is the wrapper AgentDetailsPage.tsx:110-121 puts around the
  # identity card and the tab bar together, which is exactly what the caption
  # promises. Clipping by the panel's own class was the alternative and it is
  # not one — MUI emits `css-8atqhb`, an emotion hash that changes when anyone
  # edits a style.
  #
  # `screenIs` is "Intendencia" (inventory.title, es.json:1398), the endowment
  # panel's heading, which renders only on this tab — so it proves the shot is
  # the Agente tab and not one of its siblings. `dataReady` asks for the tabs,
  # which AgentsDetailsTabs only reaches once the agent record has loaded; until
  # then the page returns its "agente no encontrado" fallback instead.
  - slot: fuerzas.perfil.agente.fig
    route: /#/home-agents
    steps:
      - click: ".simplebar-content button"
    screenIs: "::-p-text(Intendencia)"
    dataReady: '[role="tab"]'
    clip: '[role="tab"]'
    clipUp: "div.w-full"
    viewport: { width: 1600, height: 900 }

  # The Asignar tab of a shift detail. READ-ONLY, and the boundary matters here
  # more than anywhere else in this file: mounting this tab renders a search box
  # and a list of cases and nothing more (`DispatchTab.tsx` — its state is three
  # `useState` calls). The dispatch itself needs a case to be SELECTED and then
  # CONFIRMED in `InstaDispatchModal`. This recipe stops at the tab.
  #
  # The first row of the list is an ongoing shift, which is what makes the tab
  # exist at all: `ShiftsDetailsTabs.tsx:96` renders it only while
  # `statusShift !== "Finished"`.
  #
  # `screenIs` asks for the Asignar tab to be the SELECTED one
  # (`aria-selected={page === 1}`, :105) rather than for text on the pane. The
  # pane has no stable visible string — its only fixed label is the search
  # box's `placeholder`, and this file's own rule says `::-p-text()` cannot see
  # an attribute. A tab's selected state is a better gate than a caption
  # anyway: it cannot be satisfied by the sibling tab still being up, which is
  # exactly how bot.cctv.fig was once captured as PRT.
  #
  # `dataReady` asks for a ROW of the case list, not for the list. The
  # difference is the whole gate: `AssignAgentMobilityCase.tsx:47-50` keeps only
  # cases whose `case_state` is `case_open`, and its empty-state block at :52
  # renders only `if (filteredCases.length === 0 && searchTerm)`. With no search
  # term and no open case it falls through to :70 and renders
  # `div.space-y-0.5` with NO children — a container that exists and holds
  # nothing. A `dataReady` on the container would have passed and delivered a
  # photograph of an empty pane.
  #
  # FIRST RUN FAILED HERE, and correctly: `screenIs` passed, so the clicks
  # landed and the Asignar tab was selected; there simply were no open cases to
  # dispatch at that moment. That is a state of Medellin's traffic, not a
  # broken selector. Re-run when there are; an unshot slot costs nothing and a
  # picture of an empty list would tell the operator this screen has nothing in
  # it.
  - slot: fuerzas.turno-asignar.fig
    route: /#/home-shifts
    steps:
      - click: ".simplebar-content > div > div"
      - click: "button::-p-text(Asignar)"
    screenIs: '[role="tab"][aria-selected="true"]::-p-text(Asignar)'
    dataReady: 'div.space-y-0\.5 > div'
    clip: '[role="tab"]'
    clipUp: "div.w-full"
    viewport: { width: 1600, height: 900 }

  # ---------------------------------------------------------------------
  # The emergency-release procedure. SHOOT THESE AGAINST demo, never mv:
  # they need an agent who is actually in `emergency`, and the only way to
  # produce that state on mv would be to put a real officer on a real street
  # into it. On demo the state is arranged deliberately, for this purpose.
  #
  # Neither recipe releases anybody. `handleOpen`
  # (AgentInformation.tsx:59-63) is `showModal()` and nothing else; the
  # mutation hangs off `handleReleaseAgent`, which is the "Liberar" button
  # INSIDE the dialog and is never clicked here. Opening a dialog to
  # photograph it is looking, not acting.
  #
  # Neither hardcodes a person. The agent is found by the RED DOT
  # (`getStatusColorAgent`, utils/auth/functions.ts:198-203), and the list's
  # own default filter — `stateValues {"1": true, "4": true}`, on-shift only,
  # CaseFilteringAgents.tsx:95-101 — shows Disponible and Emergencia and
  # nothing else. So in that list a red dot can only be an agent in
  # emergency: the one other red state, No Disponible, is filtered out.
  # ---------------------------------------------------------------------

  # NEITHER OF THESE TWO HAS EVER RUN, and the delivered files did not come
  # from them. `capture` binds the deployment to the manual's build target
  # (main.ts:867-876) and demo is not one, so `--tenant demo` is refused. The
  # owner asked for the two figures by hand, once, off demo; they were taken
  # outside this file and the reasoning is in ESTADO.md. Left here because they
  # are correct and become runnable the day the pipeline can say which
  # deployment a figure is shot FROM — do not "fix" them to explain the files.
  #
  # The red control itself. `dataReady` is the MUI CloseIcon it contains,
  # which AgentInformation.tsx:116 renders ONLY while the agent's state is
  # emergency — so if the state was not arranged, this fails and delivers
  # nothing rather than photographing an ordinary profile.
  #
  # The tab bar's own "✕" is not this and cannot be confused with it: it is a
  # plain text glyph (AgentsDetailsTabs.tsx:174-180), not an icon component.
  - slot: fuerzas.perfil.liberar.abrir
    route: /#/home-agents
    steps:
      - click: '::-p-xpath(//*[contains(@class,"bg-[#F44336]")]/ancestor::button[1])'
    screenIs: "::-p-text(Intendencia)"
    dataReady: 'svg[data-testid="CloseIcon"]'
    clip: 'svg[data-testid="CloseIcon"]'
    clipUp: "button"
    viewport: { width: 1600, height: 900 }

  # The confirmation. `screenIs` is `#agentReleaseModal[open]`, and that
  # attribute is the whole point: the <dialog> is in the DOM from first paint,
  # so a gate on the element would pass before anything was clicked. `open` is
  # set by `showModal()`, so it is false until the step above lands.
  #
  # `dataReady` takes a substring that skips the accented letter of
  # "Liberación", per this file's own rule about ::-p-text and accents. The
  # window for this shot is somebody deliberately holding an agent in
  # emergency; it is not the place to find out whether an accent matched.
  - slot: fuerzas.perfil.liberar.confirmar
    route: /#/home-agents
    steps:
      - click: '::-p-xpath(//*[contains(@class,"bg-[#F44336]")]/ancestor::button[1])'
      - click: '::-p-xpath(//button[.//*[@data-testid="CloseIcon"]])'
    screenIs: '#agentReleaseModal[open]'
    dataReady: '::-p-text(n del Agente)'
    clip: '#agentReleaseModal .modal-box'
    viewport: { width: 1600, height: 900 }
