# How to photograph a pending figure off the running product.
#
# Run with: broadsec-manual capture broadlineavida --tenant mv
#
# WHY THIS FILE IS THE POINT. The screenshot is the easy half. Today a change to
# the product silently rots every figure that shows it and nobody finds out. A
# recipe per slot turns that drift into one command.
#
# CREDENTIALS ARE NEVER WRITTEN HERE. This file is committed. `auth` names the
# environment variables to read; the schema rejects a literal password outright.
# The login lives in .env.capture, which is gitignored.
#
# ONE URL IS ONE TENANT. src/render/config/index.ts picks the tenant config from
# `VITE_NAME_PROJECT`, a BUILD-time variable, so the deployment decides which
# tenant it is and no URL parameter can change it. `basePath` says where a build
# is served, NOT which config it loaded — demo and lv both use "lv" — so the URL
# alone cannot identify a tenant. Hence `verify`: every tenant config names a
# different logo file, and matching it turns "I pointed it at the right place"
# from an assumption into a check.
#
# BoT is enabled for demo, dev and mv only (canSeeBoT). med and lv do not have
# the module at all, so there is nothing there to photograph.
#
# ROUTES ARE HASH ROUTES. AppRoutes.tsx uses `createHashRouter`, so the path
# lives after a `#`. A plain "/broadsec-of-things" silently serves the app shell
# and the capture would shoot whatever screen happened to be up.

version: 1

target:
  deployments:
    # The manual's own deployment, and where BoT actually runs in production.
    mv:
      baseUrl: https://medellin.inovisec.com/mv
      verify: 'img[src*="movilidad_logo"]'
    # Kept for a dry run against non-production data. It has BoT too.
    demo:
      baseUrl: https://web.inovisec.com/lv
      verify: 'img[src*="bridge_logo"]'
  auth:
    route: /#/login
    userEnv: BROADSEC_CAPTURE_USER
    passwordEnv: BROADSEC_CAPTURE_PASSWORD
    # From src/render/pages/Login/LoginPage.tsx. All three confirmed present on
    # the live demo login page.
    userSelector: 'input[name="email"]'
    passwordSelector: 'input[name="password"]'
    submitSelector: "#submit-button"
    # Proof the session exists. Without it a wrong password leaves us on the
    # login form and every capture below quietly shoots that same form.
    doneWhen: "nav, header"

# `dataReady` is REQUIRED on every recipe and must only match once real data has
# rendered. A route paints its header and its empty table long before the first
# row arrives, and a screenshot of an empty alarms list tells the operator the
# screen is empty — worse than the placeholder it replaced.
#
# `steps` exists because the whole BroadSec of Things module is ONE route
# (`broadsec-of-things`); its sections are sidebar state. The product puts no
# test id on those buttons and its repository is read-only, so the only stable
# handle is the visible label — taken from botSidebar.navItems in
# src/render/locales/translations/es.json, the same catalogue the manual quotes.
recipes:
  - slot: bot.mapa.fig
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Mapa)"
    dataReady: ".gm-style"
    viewport: { width: 1600, height: 900 }

  - slot: bot.recursos.fig
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Recursos)"
    dataReady: "table tbody tr"
    viewport: { width: 1600, height: 900 }

  - slot: bot.alarmas.fig
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Alarmas)"
    dataReady: "table tbody tr"
    viewport: { width: 1600, height: 900 }
