  # ==========================================================================
  # SECURITY DASHBOARD — the filter drawer (section 09).
  #
  # THREE THINGS GATE EVERY RECIPE BELOW, and all three were found by reading
  # the product rather than by a failed run.
  #
  # 1. THE FILTERS ARE NOT ON THE PAGE. They live in a MUI `Drawer` that opens
  #    closed (`ReportsPage.tsx:623, 1289`). It has to be opened first, and the
  #    button that opens it is a 30x32 `Box` with no text, no test id and no
  #    aria-label — an `<img alt="Filter">` inside it is the only stable handle
  #    (ReportsCharts.tsx:862-890).
  #
  # 2. THAT BUTTON DOES NOT EXIST UNTIL THE DATA DOES. `ReportsCharts` renders
  #    only when `formatedDataForCharts` is non-null (ReportsPage.tsx:1308),
  #    which needs `useReports` to have answered (:1192). So every recipe waits
  #    on chart data BEFORE clicking anything.
  #
  # 3. ONLY ONE FILTER IS OPEN AT A TIME. Each is a `CheckboxFilterReports`
  #    whose `expanded` is `accordionState === "<its key>"`, so opening one
  #    closes the last (ReportsFilters.tsx:1637-1638). One recipe per filter,
  #    each opening its own.
  #
  # `dataReady` asks for `aria-expanded="true"` ON THE SUMMARY THAT CARRIES
  # THIS FILTER'S TITLE. A MUI Accordion keeps its details in the DOM while
  # collapsed, so matching a checkbox would match a filter nobody opened — the
  # "a box is not visibility" failure, which produces a confident clip of the
  # wrong thing. `aria-expanded` is the only assertion here that means open.
  #
  # Titles are the i18n catalogue's, not the legacy manual's: es.json:1203-1208.
  # READ-ONLY. Opening a drawer and expanding a panel change nothing. Not one
  # checkbox is ticked, and no report is generated.

  - slot: dashboard.variables.estado-caso.fig
