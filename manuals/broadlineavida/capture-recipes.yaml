    clip: '::-p-xpath(//*[normalize-space(text())="Ubicación"]/ancestor::*[.//*[normalize-space(text())="Barrio"]][1])'
    viewport: { width: 1600, height: 900 }

  # NO RECIPE — dashboard.filtros.ubicacion.fig-zona has no element to clip.
  # Its caption promises Zona, Comuna AND Barrio, and the product renders the
  # "Ubicación" heading as a SIBLING of the three filters, not their parent
  # (ReportsFilters.tsx:727-739). The nearest ancestor holding both the heading
  # and "Barrio" is the drawer itself, which is what a run delivered: the whole
  # panel, plus the map behind it, for a caption about three rows.
  #
  # `clipUp` exists for the opposite problem — climbing TO a container the
  # product does not name. Here the climb overshoots, and no selector expresses
  # "these four siblings". Clipping the Zona accordion alone would answer two
  # thirds of its own caption. Needs a hand capture, or a caption that promises
  # what a single element shows.

  # The comparison-range control whole: heading, link icon and the date field.
  # Anchored on the heading and climbed to the block that also holds a time,
