      - click: '::-p-text(Estado del Caso)'
    screenIs: '::-p-text(Estado del Caso)'
    dataReady: '::-p-xpath(//*[@aria-expanded="true"][.//*[normalize-space(text())="Estado del Caso"]])'
    clip: '::-p-xpath(//*[normalize-space(text())="Estado del Caso"]/ancestor::*[contains(@class,"MuiAccordion-root")][1])'
    viewport: { width: 1600, height: 900 }

  # The five siblings of the one above. Identical shape, and only the title
