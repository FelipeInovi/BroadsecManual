  - slot: dashboard.variables.emergencia.mv.fig
    route: /#/dashboard
    steps:
      - click: 'img[alt="Filter"]'
      - click: '::-p-text(Código Policial)'
    screenIs: '::-p-text(Código Policial)'
    dataReady: '::-p-xpath(//*[@aria-expanded="true"][.//*[normalize-space(text())="Código Policial"]])'
    clip: '::-p-xpath(//*[normalize-space(text())="Código Policial"]/ancestor::*[contains(@class,"MuiAccordion-root")][1])'
    viewport: { width: 1600, height: 900 }
  # NO RECIPE, AND NONE IS POSSIBLE HERE — dashboard.variables.emergencia.med.fig
  # is the SAME control under med's heading, "Tipo de Reporte"
  # (reportsPage.emergencyType, es.json:1108), which is why the manual carries
  # two tagged siblings. But `target.deployments` above declares only mv and
  # demo, and one URL is one tenant: `VITE_NAME_PROJECT` is a BUILD-time
  # variable, so no parameter on an mv URL can make it serve med. Shooting it
  # needs med's own deployment declared and reachable — not a different
  # selector.

  # NO RECIPE — dashboard.variables.motivo-cierre.fig could not be shot, and
  # the reason is NOT the one it looks like. Six attempts, every one failing on
  # the same gate, and the run that replaced the clip with `.MuiDrawer-paper`
  # said "matched nothing": THE DRAWER IS CLOSED by the time the shot is taken,
  # so the accordion was never expanded and no `aria-expanded` was ever going
  # to appear. Clicking this title closes the drawer instead of opening the
  # panel.
  #
  # Ruled out, each by a run of its own: it is not the fetched options list
  # (`useClosedReasonsList`, ReportsFilters.tsx:193) — `isLoading` only swaps
  # the accordion's CONTENT, never its title (CheboxFilterReports.tsx:77-92),
  # and the drawer shows it populated at 0/13. It is not a slow network — the
  # failure is identical every time. It is not a render race — opening a static
  # filter first to spend a render changes nothing. It is not the viewport or
  # the element sitting low in a scrolling drawer — 1600x1400 fails exactly
  # like 1600x900, and Estación, which sits BELOW it, captures fine at 900.
  #
  # Every sibling above uses this identical shape and works, so the next step
  # is a headful run to watch where that click actually lands, not another
  # selector guess. Like bot.cctv.fn.estado, this slot stays pending.

  # The Ubicación block, collapsed: its three rows are what the caption
  # promises, and Comuna and Barrio legitimately read 0/0 until a Zona is
  # chosen. Choosing one would be filtering — allowed — but it would also
  # photograph a state no operator starts from.
  - slot: dashboard.filtros.ubicacion.fig-zona
