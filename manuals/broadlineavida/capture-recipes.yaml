# How to photograph a pending figure off the running product.
#
# Run with: broadsec-manual capture broadlineavida --tenant mv
#
# WHY THIS FILE IS THE POINT. The screenshot is the easy half. Today a change to
# the product silently rots every figure that shows it and nobody finds out. A
# recipe per slot turns that drift into one command.
#
# CREDENTIALS ARE NEVER WRITTEN HERE. This file is committed. `auth` names the
# environment variables to read; the schema rejects a literal password outright.
# The login lives in .env.capture, which is gitignored.
#
# ONE URL IS ONE TENANT. src/render/config/index.ts picks the tenant config from
# `VITE_NAME_PROJECT`, a BUILD-time variable, so the deployment decides which
# tenant it is and no URL parameter can change it. `basePath` says where a build
# is served, NOT which config it loaded — demo and lv both use "lv" — so the URL
# alone cannot identify a tenant. Hence `verify`: every tenant config names a
# different logo file, and matching it turns "I pointed it at the right place"
# from an assumption into a check.
#
# BoT is enabled for demo, dev and mv only (canSeeBoT). med and lv do not have
# the module at all. Of the three that do, only MV runs the current BoT — demo
# is behind. Capture BoT from mv, always.
#
# ROUTES ARE HASH ROUTES. AppRoutes.tsx uses `createHashRouter`, so the path
# lives after a `#`. A plain "/broadsec-of-things" silently serves the app shell
# and the capture would shoot whatever screen happened to be up.

# ============================================================================
# NEVER PERFORM A REAL OPERATIONAL ACTION. THIS IS PRODUCTION.
#
# These recipes run against mv, the live system Medellin dispatches from. A
# capture may LOOK and NAVIGATE. It must never do anything an operator, a panel
# on a road, or a camera in the street would feel.
#
# FORBIDDEN — never script these, however good the figure would be:
#   - PMV: saving, sending, scheduling, deactivating or reactivating a message.
#     Anything here reaches physical signs on live roads. The reviewer named
#     this module specifically.
#   - PTZ: moving a camera, saving or recalling a preset. That is a motor
#     turning on a real street.
#   - Dispatch: assigning a resource to an incident, marking PJ, confirming.
#   - Alarms: acknowledging. That is an operational record with a name on it.
#   - Creating or deleting anything: families, groups, predefined messages.
#
# ALLOWED — read-only, leaves no trace:
#   - Navigating, expanding a menu, opening a pane.
#   - Searching, filtering, clearing a filter, paginating.
#   - Dragging a camera into a mosaic tile to watch it (viewing a stream
#     changes nothing).
#   - Filling a form WITHOUT saving, to show what it asks for.
#
# A procedure step whose figure would need a forbidden action stays PENDING and
# is captured by hand, in a controlled environment, by someone authorised. An
# unshot slot costs nothing. A message pushed to a road costs a great deal.
# ============================================================================

version: 1

target:
  deployments:
    # The manual's own deployment, and where BoT actually runs in production.
    mv:
      baseUrl: https://medellin.inovisec.com/mv
      verify:
        route: /#/broadsec-of-things
        selector: 'button::-p-text(Alarmas)'
    # NOT for BoT. demo runs an OUT OF DATE BroadSec of Things, so a capture
    # taken here delivers screens the operator will never see — and nothing in
    # the pipeline can tell an old screen from a current one. `canSeeBoT` being
    # true here is exactly what makes that trap quiet. Kept only for figures
    # outside BoT, or for exercising the login path.
    # The manual's OTHER build target. A separate deployment, not a parameter
    # of mv: `VITE_NAME_PROJECT` is build-time (config/index.ts), so nothing in
    # an mv URL can serve med.
    #
    # It has its own user directory — the account that signs into mv is not
    # accepted here — so it carries its own `auth`. Variable NAMES only, as
    # everywhere in this file.
    #
    # And its `verify` is the first in this file that actually proves WHICH
    # TENANT answered, rather than only that something did. `logoImages[config.name]`
    # renders on the dashboard (ReportsCharts.tsx:666-672, alt="Project logo"),
    # and med's is medellin_logo where mv's is movilidad_logo — so pointing
    # this at mv by mistake fails the gate instead of quietly capturing the
    # wrong deployment. The note in capture.ts about the logo not rendering is
    # true of /#/broadsec-of-things, not of /#/dashboard.
    med:
      baseUrl: https://medellin.inovisec.com/med
      verify:
        route: /#/dashboard
        selector: 'img[alt="Project logo"][src*="medellin_logo"]'
      auth:
        route: /#/login
        userEnv: BROADSEC_CAPTURE_USER_MED
        passwordEnv: BROADSEC_CAPTURE_PASSWORD_MED
        userSelector: 'input[name="email"]'
        passwordSelector: 'input[name="password"]'
        submitSelector: "#submit-button"
        doneWhen: ".h-screen"
    # The deployment to shoot anything that would need a real operational
    # action on mv. It is a training environment, so an agent can be put into
    # emergency and a case can be dispatched without anyone on a street feeling
    # it — which is the only way some of Fuerzas en Campo's controls can be
    # photographed at all.
    #
    # Its `verify` USED to be BoT's Alarmas button, which proved only that
    # something answered. That is not enough here, and the reason is this
    # deployment specifically: `basePath` is "lv", and demo and lv are served
    # from the same one. So the URL cannot say which config loaded, and lv is a
    # deployment where `canSeeForcesInField` is false — capturing this module
    # from it would deliver screens nobody in it can reach.
    #
    # `logoImages` (constants/logoImages.ts) gives DEMO `bridge_logo.webp` and
    # LV `linea_vida_logo.webp`, two different files, and ReportsCharts.tsx:666
    # renders the active one on /#/dashboard. Matching it turns "I pointed it at
    # the right place" into a check, the way med's verify already does.
    #
    # It has its own account, so it carries its own `auth`. Variable NAMES only,
    # as everywhere in this file.
    demo:
      baseUrl: https://web.inovisec.com/lv
      verify:
        route: /#/dashboard
        selector: 'img[alt="Project logo"][src*="bridge_logo"]'
      auth:
        route: /#/login
        userEnv: BROADSEC_CAPTURE_USER_DEMO
        passwordEnv: BROADSEC_CAPTURE_PASSWORD_DEMO
        userSelector: 'input[name="email"]'
        passwordSelector: 'input[name="password"]'
        submitSelector: "#submit-button"
        doneWhen: ".h-screen"
  auth:
    route: /#/login
    userEnv: BROADSEC_CAPTURE_USER
    passwordEnv: BROADSEC_CAPTURE_PASSWORD
    # From src/render/pages/Login/LoginPage.tsx. All three confirmed present on
    # the live demo login page.
    userSelector: 'input[name="email"]'
    passwordSelector: 'input[name="password"]'
    submitSelector: "#submit-button"
    # Proof the session exists. Without it a wrong password leaves us on the
    # login form and every capture below quietly shoots that same form.
    doneWhen: ".h-screen"

# `dataReady` is REQUIRED on every recipe and must only match once real data has
# rendered. A route paints its header and its empty table long before the first
# row arrives, and a screenshot of an empty alarms list tells the operator the
# screen is empty — worse than the placeholder it replaced.
#
# `steps` exists because the whole BroadSec of Things module is ONE route
# (`broadsec-of-things`); its sections are sidebar state. The product puts no
# test id on those buttons and its repository is read-only, so the only stable
# handle is the visible label — taken from botSidebar.navItems in
# src/render/locales/translations/es.json, the same catalogue the manual quotes.
# THE RULE THAT REPLACED A BAD ONE. `table tbody tr` is NOT enough: the loading
# state renders a single <tr> holding "Cargando ..." and matches instantly, which
# is how bot.alarmas.fig was first shot mid-load. A loading state is ONE row, so
# asking for the THIRD proves real data arrived. Never relax this to a bare row.

# TWO GATES, NOT ONE. `dataReady` proves data is on screen; `screenIs` proves it
# is THIS screen's data. CCTV and PMV are sidebar PARENTS — clicking them only
# expands the submenu and leaves the previous section's table up, which satisfied
# `dataReady` instantly. bot.cctv.fig and bot.pmv.fig were both captured as PRT
# that way, and the run reported "4 of 4 captured".
#
# `screenIs` MUST BE VISIBLE TEXT, and accents must match exactly. Two ways this
# was got wrong in one sitting:
#   - "Buscar por nombre" is a `placeholder` ATTRIBUTE, not text. ::-p-text()
#     cannot see it, and the failure reads like a slow page.
#   - "GESTION" never matches "GESTIÓN" — the match is literal. Accents DO work
#     when written correctly (the file is UTF-8); dropping one to "play safe" is
#     what actually breaks it. Write the real text, or take a substring that
#     skips the accented letter — "n de agentes" for "Programación de agentes".
#
# And `dataReady` asks for the THIRD row: a loading state is ONE row holding
# "Cargando ...", which is how bot.alarmas.fig was first shot mid-load.

recipes:
  # VERIFIED: fully populated resources listing.
  - slot: bot.recursos.fig
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Recursos)"
    screenIs: "::-p-text(Monitoreo y despacho operativo)"
    dataReady: "table tbody tr td"
    viewport: { width: 1600, height: 900 }

  # VERIFIED: agent scheduling, 50 rows with vehicle, zone and control point.
  - slot: bot.prt.fig
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(PRT)"
    screenIs: "::-p-text(n de agentes)"
    dataReady: "table tbody tr:nth-child(3) td"
    viewport: { width: 1600, height: 900 }

  # VERIFIED: 17179 alarms across 344 pages, with the Reconocer buttons.
  - slot: bot.alarmas.fig
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Alarmas)"
    screenIs: "::-p-text(reconoce las alarmas del sistema)"
    dataReady: "table tbody tr:nth-child(3) td"
    viewport: { width: 1600, height: 900 }

  # CCTV and PMV are already EXPANDED when the module loads, so their children
  # are clickable straight away. Do NOT click the parent first: that collapses
  # it and the child disappears. Verified by recon: 50 rows, heading "Mensajes".
  - slot: bot.pmv-gestion.fig
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Gestión)"
    screenIs: "::-p-text(Mensajes)"
    dataReady: "table tbody tr:nth-child(3) td"
    viewport: { width: 1600, height: 900 }

  # The top bar carries the screen's own name — "PRT", "Alarmas", "PMV - Gestión".
  # That breadcrumb is the most reliable `screenIs` in this module, and the
  # parent-child form ("PMV - Programación") cannot collide with the sidebar
  # button of the same child name.
  - slot: bot.cctv.fig
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Mosaico)"
    screenIs: "::-p-text(CCTV - Mosaico)"
    dataReady: "::-p-text(CCTV - Mosaico)"
    viewport: { width: 1600, height: 900 }

  - slot: bot.pmv.fig
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Programación)"
    screenIs: "::-p-text(PMV - Programación)"
    dataReady: "::-p-text(PMV - Programación)"
    viewport: { width: 1600, height: 900 }

  - slot: bot.pmv-variables.fig
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Variables)"
    screenIs: "::-p-text(PMV - Variables)"
    dataReady: "::-p-text(PMV - Variables)"
    viewport: { width: 1600, height: 900 }

  # PANEL LAYER MUST BE ENABLED FIRST — it is MV-only (LayersMap.tsx:136-138)
  # and starts off. Clicking the "Panel" layer button ALREADY closes the menu
  # itself: LayersMap.tsx:219-231 calls setAnchorEl(null) right after toggling
  # any layer except AVL/Mobile on AMVA. A THIRD click meant to "close" the
  # menu lands on the menu's own invisible MuiBackdrop (the thing that is
  # actually on top once a Popover is open) and REOPENS it instead of closing
  # an already-closed one — confirmed by instrumenting pointerdown/click
  # targets live: every click after that extra step landed on the backdrop,
  # never the card, so nothing downstream ever expanded. Two steps only.
  - slot: bot.mapa.paneles.fig
    route: /#/broadsec-of-things
    steps:
      - click: 'svg[data-testid="LayersOutlinedIcon"]'
      - click: 'button[aria-label="Panel"]'
    screenIs: ".gm-style"
    dataReady: "div.cursor-pointer.bg-base-200.rounded-lg.shadow-2xl"
    settleMs: 2000
    viewport: { width: 1600, height: 900 }

  # Expands whichever card the DOM lists first — panel identity is live data
  # that rotates, and the manual's own text only promises "la tarjeta o el
  # marcador de UN panel", never a named one. Clipped to whichever card ends
  # up `ring-2`: PanelCard.tsx only puts that ring class on the expanded
  # card, so the shot follows whichever one actually opened rather than a
  # fixed position.
  - slot: bot.mapa.paneles.paso.abrir
    route: /#/broadsec-of-things
    steps:
      - click: 'svg[data-testid="LayersOutlinedIcon"]'
      - click: 'button[aria-label="Panel"]'
      - click: "div.cursor-pointer.bg-base-200.rounded-lg.shadow-2xl"
    screenIs: ".gm-style"
    dataReady: '::-p-xpath(//div[contains(@class,"ring-2")])'
    settleMs: 1000
    clip: '::-p-xpath(//div[contains(@class,"ring-2")])'
    viewport: { width: 1600, height: 900 }

  # PHOTOGRAPHED, NOT PRESSED. "Desactivar panel" / "Reactivar panel"
  # (PanelCard.tsx:196-211) reaches a real PMV panel on a live road through
  # `setPmvPanelStatus` — FORBIDDEN by this file's own boundary. This clips
  # the button inside the expanded card; nothing here ever clicks it.
  - slot: bot.mapa.paneles.paso.accionar
    route: /#/broadsec-of-things
    steps:
      - click: 'svg[data-testid="LayersOutlinedIcon"]'
      - click: 'button[aria-label="Panel"]'
      - click: "div.cursor-pointer.bg-base-200.rounded-lg.shadow-2xl"
    screenIs: ".gm-style"
    dataReady: '::-p-xpath(//div[contains(@class,"ring-2")]//button)'
    settleMs: 1000
    clip: '::-p-xpath(//div[contains(@class,"ring-2")]//button)'
    viewport: { width: 1600, height: 900 }

  # "Haga clic en cualquier otro punto del mapa para volver a colapsarla" —
  # there is no control to isolate for this step, only an instruction about
  # WHERE NOT to click. No clip: the shot shows the same expanded state the
  # reader is being told to click away from, framed wide enough to show the
  # open map around it.
  - slot: bot.mapa.paneles.paso.cerrar
    route: /#/broadsec-of-things
    steps:
      - click: 'svg[data-testid="LayersOutlinedIcon"]'
      - click: 'button[aria-label="Panel"]'
      - click: "div.cursor-pointer.bg-base-200.rounded-lg.shadow-2xl"
    screenIs: ".gm-style"
    dataReady: '::-p-xpath(//div[contains(@class,"ring-2")])'
    settleMs: 1000
    viewport: { width: 1600, height: 900 }

  # The module as the operator meets it, with NO click: landing on it is the
  # whole point of "pantalla general". Shooting it on Recursos was the first
  # attempt and produced a near-duplicate of bot.recursos.fig — two captions,
  # one picture, and nothing in the pipeline would have said so.
  - slot: bot.fig
    route: /#/broadsec-of-things
    screenIs: ".gm-style"
    dataReady: "aside.border-r"
    viewport: { width: 1600, height: 900 }

  # The lateral panel alone. Clipped to the sidebar's own root — the class list
  # comes from BOTSidebar.tsx, and the integration status dots the caption
  # mentions live inside it.
  - slot: bot.navegacion.fig
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Recursos)"
    screenIs: "::-p-text(Monitoreo y despacho operativo)"
    dataReady: "table tbody tr td"
    # It is an <aside>, not a div — BOTSidebar.tsx renders motion.aside.
    clip: "aside.border-r"
    viewport: { width: 1600, height: 900 }

  # The three Variables columns are direct children of one CSS grid, so they clip
  # by position. A grid renders in DOM order, and the pane reads left to right:
  # Familias, Grupos, Mensajes Predefinidos.
  - slot: bot.pmv-variables.s.familias
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Variables)"
    screenIs: "::-p-text(PMV - Variables)"
    dataReady: "section.grid-cols-3 > div"
    clip: "section.grid-cols-3 > div:nth-child(1)"
    viewport: { width: 1600, height: 900 }

  - slot: bot.pmv-variables.s.grupos
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Variables)"
    screenIs: "::-p-text(PMV - Variables)"
    dataReady: "section.grid-cols-3 > div"
    clip: "section.grid-cols-3 > div:nth-child(2)"
    viewport: { width: 1600, height: 900 }

  - slot: bot.pmv-variables.s.predefinidos
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Variables)"
    screenIs: "::-p-text(PMV - Variables)"
    dataReady: "section.grid-cols-3 > div"
    clip: "section.grid-cols-3 > div:nth-child(3)"
    viewport: { width: 1600, height: 900 }

  # CAREFUL: the module sidebar and the camera list are BOTH
  # `aside.shrink-0.border-r`. Only the module sidebar carries `justify-between`,
  # so the camera list is the one WITHOUT it. Clipping on the shared part alone
  # would silently deliver the navigation menu as "the camera list".
  - slot: bot.cctv.fn.lista
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Mosaico)"
    screenIs: "::-p-text(CCTV - Mosaico)"
    dataReady: "aside.shrink-0.border-r:not(.justify-between) img, aside.shrink-0.border-r:not(.justify-between) svg"
    clip: "aside.shrink-0.border-r:not(.justify-between)"
    viewport: { width: 1600, height: 900 }

  # bot.cctv.fn.grilla CANNOT be captured headless, and it is not a selector
  # problem. The drag works — CCTV-Sena lands in tile 1 and the PTZ overlay
  # renders — but the stream never decodes: the tile shows
  # "mediaError: bufferAddCodecError". No wait fixes a codec the browser will
  # not play, so `settleMs` only bought a longer look at the same black tile.
  #
  # Everything below is CORRECT and worth keeping for a headful run or a hand
  # capture. The drag is the part that was hard:
  #   steps:
  #     - click: "button::-p-text(Mosaico)"
  #     - drag:
  #         from: '[aria-roledescription="draggable"]'   # dnd-kit marks handles
  #         to:   "div.grid.h-full.w-full.gap-1 > div:nth-child(1)"
  #   clip: "div.grid.h-full.w-full.gap-1"

  # The PTZ control renders over a tile once a camera is dropped in. SHOWING it
  # is inside the read-only boundary; PRESSING any of these arrows would turn a
  # motor on a real street, so no step here ever touches them.
  # Root class from CCTVPTZControl.tsx.
  - slot: bot.cctv.fn.ptz
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Mosaico)"
      - drag:
          from: '[aria-roledescription="draggable"]'
          to: "div.grid.h-full.w-full.gap-1 > div:nth-child(1)"
    # NOT "CONTROL PTZ": that heading is CSS `uppercase`, so the DOM text differs
    # from what the screen shows and ::-p-text() matches the DOM.
    screenIs: "::-p-text(PTZ)"
    dataReady: "::-p-text(PTZ)"
    settleMs: 4000
    clip: "div.flex.flex-col.gap-4"
    viewport: { width: 1600, height: 900 }

  # Static clips of the controls each step names. The reviewer accepted these:
  # they show WHERE the control is, not the typing. A `type` step would show the
  # action, and is the natural next addition.
  # Placeholders are the most stable handle on this toolbar — they come from the
  # i18n catalogue and are plain CSS attribute selectors.
  - slot: bot.prt.paso.buscar
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(PRT)"
    screenIs: "::-p-text(n de agentes)"
    dataReady: 'input[placeholder*="Buscar por nombre"]'
    clip: 'input[placeholder*="Buscar por nombre"]'
    viewport: { width: 1600, height: 900 }

  - slot: bot.recursos.paso.ubicar
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Recursos)"
    screenIs: "::-p-text(Monitoreo y despacho operativo)"
    dataReady: 'input[placeholder*="Buscar agentes"]'
    clip: 'input[placeholder*="Buscar agentes"]'
    viewport: { width: 1600, height: 900 }

  # PMV Programación, field by field. The form blocks carry generic Tailwind
  # classes (plain `div`, `div.relative`) that cannot be told apart in CSS, so
  # each is anchored on its own LABEL through XPath.
  #
  # NOTHING HERE SAVES. Every one of these is a clip of a control sitting
  # untouched — including `guardar`, which photographs the button rather than
  # pressing it. Showing is not doing; see the boundary at the top of this file.

  - slot: bot.pmv.paso.identificar
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Programación)"
    screenIs: "::-p-text(PMV - Programación)"
    dataReady: "::-p-text(Contenido de Mensaje)"
    clip: '::-p-xpath(//*[normalize-space(text())="Título Interno"]/ancestor::div[.//input or .//textarea][1])'
    viewport: { width: 1600, height: 900 }

  - slot: bot.pmv.paso.clasificar
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Programación)"
    screenIs: "::-p-text(PMV - Programación)"
    dataReady: "::-p-text(Contenido de Mensaje)"
    clip: '::-p-xpath(//*[normalize-space(text())="Tipo"]/ancestor::div[.//input or .//select or .//button][1])'
    viewport: { width: 1600, height: 900 }

  - slot: bot.pmv.paso.destino
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Programación)"
    screenIs: "::-p-text(PMV - Programación)"
    dataReady: "::-p-text(Contenido de Mensaje)"
    clip: '::-p-xpath(//*[normalize-space(text())="Panel"]/ancestor::div[.//input or .//select or .//button][1])'
    viewport: { width: 1600, height: 900 }

  - slot: bot.pmv.paso.contenido
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Programación)"
    screenIs: "::-p-text(PMV - Programación)"
    dataReady: "::-p-text(Contenido de Mensaje)"
    clip: '::-p-xpath(//*[normalize-space(text())="Texto a Mostrar"]/ancestor::div[.//textarea][1])'
    viewport: { width: 1600, height: 900 }

  - slot: bot.pmv.paso.vigencia
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Programación)"
    screenIs: "::-p-text(PMV - Programación)"
    dataReady: "::-p-text(Contenido de Mensaje)"
    clip: '::-p-xpath(//*[normalize-space(text())="Rango de Fechas"]/ancestor::div[.//button][1])'
    viewport: { width: 1600, height: 900 }

  - slot: bot.pmv.paso.guardar
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Programación)"
    screenIs: "::-p-text(PMV - Programación)"
    dataReady: "::-p-text(Contenido de Mensaje)"
    clip: '::-p-xpath(//button[contains(., "Guardar")])'
    viewport: { width: 1600, height: 900 }

  # The Parpadeo (flash) slider. Label from es.json ("pmv.programming.flash" =
  # "Parpadeo"); rendered by PMVProgramming.tsx's own FieldLabel, a plain
  # `<label>{children}</label>`, so the text node is a direct child the same way
  # every other labelled field in this form is anchored. The wrapping `<div>`
  # holds the label and the `input[type="range"]` as siblings — same shape as
  # `bot.pmv.paso.contenido`'s textarea anchor. Untouched: the slider is a
  # control to SHOW, not to move.
  - slot: bot.pmv.paso.parpadeo
    route: /#/broadsec-of-things
    steps:
      - click: "button::-p-text(Programación)"
    screenIs: "::-p-text(PMV - Programación)"
    dataReady: "::-p-text(Contenido de Mensaje)"
    clip: '::-p-xpath(//*[normalize-space(text())="Parpadeo"]/ancestor::div[.//input[@type="range"]][1])'
