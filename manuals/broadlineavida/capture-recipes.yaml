  # The emergency-type filter is a `DropDownReports`, but it is the same
  # accordion underneath (`expanded={accordionState === "emergencySubTypes"}`,
  # ReportsFilters.tsx:1196). On mv its heading comes from
  # `config.reportsEmergencyTypeLabel` = reportsPage.filters.policeCode, which
  # is "Código Policial" — NOT the default "Tipo de Reporte" that med reads.
