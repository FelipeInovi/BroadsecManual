# Broadsec SIMM — operator manual.
#
# `tenant` values mirror the ids used by the product itself
# (`src/render/config/<id>.config.ts`). They are re-derived by `extract`;
# if this list and the extraction disagree, the extraction is right.

version: 1

manual:
  id: broadlineavida
  source: broadlineavida
  title: Manual de operador
  product: Broadsec SIMM
  # SemVer of the manual content.
  # THE OWNER AUTHORISES EVERY CHANGE TO THIS NUMBER. Do not edit it because a
  # change felt significant; a version marks a DELIVERY to the client, not work
  # done internally. See `manuals/AGENTS.md`, "Versioning". The manual's final
  # module carries the row that explains each bump to the reader.
  contentVersion: 0.1.0
  language: es
  register: neutral-formal

# Block catalogue version this manual's content is written against.
# Declarative only: the build imports the catalogue directly from
# `@broadsec-manual/blocks` and does not read this key today.
catalog:
  version: null

# Conditioning axes. Today only `tenant`; the engine supports more.
axes:
  tenant:
    label: Deployment
    values:
      - id: lv
        code: LV
        name: Línea Vida
      - id: amva
        code: AMVA
        name: Área Metropolitana Valle de Aburrá
      - id: ant
        code: ANT
        name: Antioquia
      - id: mv
        code: MV
        name: Movilidad Medellín
      - id: med
        code: MED
        name: Medellín
      - id: demo
        # The product's internal id is DEMO; the manual calls it Demostración.
        code: DEMO
        name: Demostración

# One PDF per target. Client-facing: only that tenant's content, no badges.
#
# ONLY `mv` and `med` are built: they are the manuals under contract. The other
# four deployments are deferred, not dropped.
#
# That is why `axes.tenant.values` above still lists all six while only two are
# built, and the mismatch is deliberate — do not "tidy" it by deleting the
# unused values:
#
#  - The value list mirrors the product's own deployment registry
#    (`src/render/config/<id>.config.ts`) and is re-derived by `extract`.
#    Deleting entries would put this file in disagreement with the source.
#  - Content is tagged against those ids. `tenant: [lv, ant, mv, med, demo]`
#    means "every deployment except amva" — a fact taken from the product's
#    feature gating. Narrowing those tags to the two built targets would destroy
#    it, and it would have to be re-derived from source when the others return.
#
# Adding a deployment back is one line here. Recovering deleted tenant tagging
# is a re-extraction.
targets:
  - { tenant: mv }
  - { tenant: med }

output:
  dir: output
  filename: "manual-operador-{tenant}-v{contentVersion}.pdf"
