id: notas
title: Actualización
lede: >-
  Nuevos filtros de variables de gestión en el Security Dashboard, y perfil del
  agente, liberación de emergencia y asignación desde el turno en Fuerzas en
  Campo.
children:
  - kind: block
    id: notas.vigencia
    type: term-list
    props:
      entries:
        - id: notas.vigencia.1
          term: Módulo de Comando y Control
          definition: Actualización efectiva desde el 23 de septiembre de 2026.

  # Producto: nuevo — 534fccc. canViewFilterTrafficDetails is on for mv alone
  # (knowledge/module-map.json), so this section is too.
  - kind: section
    id: notas.dashboard
    title: Security Dashboard
    when:
      tenant: [mv]
    children:
      - kind: block
        id: notas.dashboard.p1
        type: prose
        props:
          text: >-
            Se incorporaron nuevos filtros en las **Variables de Gestión** del
            panel de Filtros: **Estado del Caso**, **Tipo de Caso**, **Clase de
            Siniestro Vial**, **Recursos Asignados al Caso** y **Motivo de
            Cierre**.
      - kind: block
        id: notas.dashboard.p2
        type: prose
        props:
          text: >-
            Cada uno se presenta como una lista de casillas de verificación, con
            la opción **Todos** para seleccionarlas en conjunto, y acota los
            casos que muestra el tablero según el criterio elegido.

  # Producto: nuevo — 4db553c. Same selector as 10-fuerzas-en-campo.yaml.
  - kind: section
    id: notas.fuerzas
    title: Fuerzas en Campo
    when:
      tenant: [mv, demo]
    children:
      - kind: block
        id: notas.fuerzas.p1
        type: prose
        props:
          text: >-
            Se incorporó el perfil del agente, al que se accede haciendo clic
            sobre un agente en la lista o desde su ubicación en el mapa. Se abre
            en la pestaña **Agente**, que reúne su identificación y su panel de
            **Intendencia** con los elementos de dotación asignados.
      - kind: block
        id: notas.fuerzas.p2
        type: prose
        props:
          text: >-
            Ahora es posible liberar a un agente que se encuentra en estado
            **Emergencia**. Desde su perfil, pulse el botón que se muestra junto
            a su identificación y confirme con **Liberar**; el agente vuelve a
            admitir despachos.
      - kind: block
        id: notas.fuerzas.p3
        type: prose
        props:
          text: >-
            El detalle de un turno que aún no ha finalizado incorpora la pestaña
            **Asignar**, desde la cual se despacha un caso al agente de ese
            turno sin salir de la pantalla. Mientras está seleccionada se
            habilita el botón **Tarea**, que crea una tarea dirigida únicamente
            a ese agente.
