id: notas
title: Actualización
lede: >-
  El Security Dashboard incorpora el Rango de Comparación y la selección por
  variable, que permiten contrastar dos períodos y acotar el tablero sin salir
  de la consulta en curso.
children:
  - kind: block
    id: notas.vigencia
    type: term-list
    props:
      entries:
        - id: notas.vigencia.1
          term: Módulo de Comando y Control
          definition: Actualización efectiva desde el 22 de septiembre de 2026.

  - kind: section
    id: notas.dashboard
    title: Security Dashboard
    children:
      - kind: block
        id: notas.dashboard.p1
        type: prose
        props:
          text: >-
            El tablero incorpora el Rango de Comparación: además del período
            consultado, permite fijar un segundo período y contrastar ambos en
            una misma vista, de modo que cada indicador se lea junto a su
            equivalente anterior.
      - kind: block
        id: notas.dashboard.p2
        type: prose
        props:
          text: >-
            El panel de filtros suma la selección por variable, que restringe el
            tablero a los tipos de emergencia, las fuerzas o las ubicaciones que
            el operador elija, sin salir de la consulta en curso.

  - kind: section
    id: notas.fuerzas
    title: Fuerzas en Campo
    when:
      tenant:
        - mv
        - demo
    children:
      - kind: block
        id: notas.fuerzas.p1
        type: prose
        props:
          text: >-
            La ficha de un agente abre su perfil completo: sus datos, la fuerza
            a la que pertenece, el vehículo asignado y el turno en curso, sin
            necesidad de consultarlos por separado.
      - kind: block
        id: notas.fuerzas.p2
        type: prose
        props:
          text: >-
            Un agente que quedó en estado de emergencia puede liberarse desde su
            propio perfil, mediante una confirmación explícita que devuelve al
            agente a servicio.
      - kind: block
        id: notas.fuerzas.p3
        type: prose
        props:
          text: >-
            El detalle de un turno incorpora la pestaña Asignar, desde la cual
            se despacha un caso abierto al agente seleccionado sin volver al
            listado de incidentes.
