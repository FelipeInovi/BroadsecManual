# Block gallery.
#
# Hand-written fixtures rendered through the real pipeline, so what you see is
# what the system actually produces.
#
# The list being hand-written is the known flaw: a block type added to
# `packages/blocks` does not appear here on its own. Update this file whenever
# the catalogue changes. Closing that gap is what `packages/catalog` is for.

version: 1

manual:
  id: _catalog
  source: broadlineavida
  title: Catálogo de estructuras
  product: Broadsec SIMM
  contentVersion: 0.1.0
  language: es
  register: neutral-formal

catalog:
  version: null

axes:
  tenant:
    label: Deployment
    values:
      - { id: demo, code: DEMO, name: Demostración }

targets:
  - { tenant: demo }

output:
  dir: output
  filename: "catalogo-estructuras-v{contentVersion}.pdf"
