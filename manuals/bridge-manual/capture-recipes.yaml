# How each pending figure of this manual is photographed off the running product.
#
# THIS DOCUMENT ATTACHES; it does not sign in. Bridge360's window is a Tauri
# webview, and a browser opened on the same dev server lands on `/setup` and
# cannot leave: `workstationConfigExists()` returns false outside Tauri
# (`shared/infrastructure/tauri-bridge.ts:38`) and `WorkstationSetupGate`, which
# wraps every route, redirects there. The station config lives in the OS keyring
# through Rust, so no browser can ever satisfy it.
#
# So a person starts the app with remote debugging on, signs in — second factor
# included — and this run joins that window:
#
#     WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS="--remote-debugging-port=9222" pnpm tauri dev
#
# Two consequences, both deliberate:
#
#   * There are NO credentials here and no `.env` entry for this manual. Nothing
#     to leak, and no race against a time-based code expiring mid-handshake.
#   * There is NO navigation. Every shot is reached by clicking the rail. This
#     product declares five routes and one of them is the whole application, so
#     `goto` would take the app away from the signed-in dashboard with nothing to
#     come back to.

version: 1

target:
  attach:
    browserURL: http://localhost:9222

    # The rail's views, in the order the product declares them — `navItems`,
    # `components/layout/icon-sidebar.tsx:51-83`. The entry marked
    # `isCall: true` (Llamada) renders outside this group, which is why it is
    # absent here and why its figures are not in this file yet.
    #
    # A position rather than a selector because every rail button is the same
    # `button[data-slot="tooltip-trigger"]` with no id, no aria-label and no
    # text. Its tooltip does carry the label, but it stays mounted across reads
    # and returned the PREVIOUS button's label every other time — worse than a
    # position, because it looks authoritative. The run refuses to click if the
    # rail's length stops matching this list.
    views:
      - home
      - sitemap
      - dashboard
      - bridge-of-things
      - forces-in-field
      - create-incident

    # Proof the attached window is the product AND signed in.
    #
    # Top-bar CHROME, not a panel: `<span className="text-yellow-500">Agencia:
    # </span>` at `components/layout/top-bar.tsx:123`, mounted in every view and
    # absent before the login gate. The first attempt used Home's agencies panel
    # and failed the moment the window happened to be left on another view —
    # which is the normal state, since a person was just using it.
    verify:
      selector: span::-p-text(Agencia:)

# Each `screenIs` below was read off the running app, not guessed: clicking each
# rail position and recording what the view puts on screen. That pass also
# confirmed the manual's own claims — Dashboard opens on Historial de Eventos,
# Bridge of Things opens on its DASHBOARD panel, Fuerzas en Campo opens with only
# its own list because the other three are `initiallyInactive`.
recipes:
  # --- the seven module overview figures --------------------------------------
  #
  # Started here on purpose: these are the images a reader looks for first, and
  # each is one click plus a shot. The long tail — a control per procedure step,
  # a field per field-list — is the same mechanism repeated.

  - slot: home.fig
    view: home
    screenIs: h3::-p-text(Mi Turno)
    # Not the heading: the panel renders its shell before the query lands, and a
    # review list with no case is a screenshot that teaches the operator the
    # screen is empty.
    dataReady: h3::-p-text(Revisión de llamadas)
    settleMs: 2500

  - slot: seatmap.fig
    view: sitemap
    # Seatmap puts nothing in an h2/h3 at all — it was the one view that reported
    # no headings when the rail was walked. So the tell is one of its own stat
    # card titles, which this manual already quotes and `labels` already checks
    # against `components/sitemap/sitemap-stats-panel.tsx:276`. A guessed
    # `::-p-text(Zona)` was tried first and matched nothing.
    screenIs: ::-p-text(Tiempo de espera más larga)
    # A row of the operator monitor. The stat titles above are chrome and render
    # with zeroes; a row only exists once the stream has delivered seats.
    dataReady: table tbody tr
    settleMs: 3000

  - slot: dashboard.fig
    view: dashboard
    screenIs: h3::-p-text(Historial de Eventos)
    # A row, not the heading: the table paints its head and an empty body while
    # the query is still out.
    dataReady: table tbody tr
    settleMs: 2500

  - slot: bot.fig
    view: bridge-of-things
    screenIs: h3::-p-text(DASHBOARD)
    dataReady: h3::-p-text(DASHBOARD)
    settleMs: 2000

  - slot: fuerzas-campo.fig
    view: forces-in-field
    screenIs: h3::-p-text(Fuerzas en Campo)
    # The agent list, not its heading. An empty roster would photograph as "no
    # agents deployed", which is a claim about the operation and not a figure.
    dataReady: ::-p-text(Disponible)
    settleMs: 3000

  - slot: crear-incidente.fig
    view: create-incident
    screenIs: h3::-p-text(Crear Incidente)
    # The form's own first field: it renders after the incident-type query, so it
    # is the cheapest proof the panel is live rather than mounting.
    dataReady: ::-p-text(Tipo de incidente)
    settleMs: 2000

  # --- panels, clipped to the panel the caption promises ----------------------
  #
  # `clip` finds the panel's heading and `clipUp` climbs to the `div.panel` around
  # it. Bridge360 gives its panels no id, no test id and nothing to tell them
  # apart — the heading inside is the only handle, which is why that pair exists.

  - slot: home.revision.fig
    view: home
    screenIs: h3::-p-text(Revisión de llamadas)
    dataReady: ::-p-text(caso)
    clip: h3::-p-text(Revisión de llamadas)
    clipUp: div.panel
    settleMs: 2500

  - slot: home.agencias.fig
    view: home
    screenIs: h3::-p-text(Agencias)
    # A row, not the heading: the panel paints its shell before the query lands.
    dataReady: ::-p-text(Despacho)
    clip: h3::-p-text(Agencias)
    clipUp: div.panel
    settleMs: 2500

  - slot: home.turno.fig
    view: home
    screenIs: h3::-p-text(Mi Turno)
    # The shift history, which only exists once the panel has its data.
    dataReady: ::-p-text(Inicio de turno)
    clip: h3::-p-text(Mi Turno)
    clipUp: div.panel
    settleMs: 2500

  # --- Seatmap's three regions ------------------------------------------------
  #
  # Seatmap renders no heading at all, so these clip on their own content.

  # Seatmap's regions are NOT `div.panel` — that class belongs to the docked
  # panels of the other views. Both containers below were read off the running
  # app after `div.panel` came back with no such ancestor.

  - slot: seatmap.indicadores.fig
    view: sitemap
    screenIs: ::-p-text(Tiempo de espera más larga)
    dataReady: table tbody tr
    clip: ::-p-text(Tiempo de espera más larga)
    # The right-hand column, 497 wide by the full height of the view.
    clipUp: div.row-span-2
    settleMs: 3000

  - slot: seatmap.monitor.fig
    view: sitemap
    screenIs: ::-p-text(Estados de Operadores)
    dataReady: table tbody tr
    clip: ::-p-text(Estados de Operadores)
    # The BAND, not the card. Its caption promises "las fichas de estados de
    # operadores Y DE AGENCIAS" — two cards — and a first pass clipped
    # `div[class*="group/card "]`, which is one of them. The picture was faultless
    # and did not answer its own caption, which no count can catch.
    #
    # `closest` from the operators title climbs: header 636x44, card 636x236,
    # grid 1283x236, then this at 1307x260 — the band with both.
    clipUp: div[class*="rounded-[25px]"]
    settleMs: 3000

  # --- Dashboard's three tabs -------------------------------------------------
  #
  # One route, three tabs; each is a click. `screenIs` is the tab's own content
  # and not its button, which stays on screen whichever tab is open.

  - slot: dashboard.historial.fig
    view: dashboard
    # Title case. The screen shows HISTORIAL DE EVENTOS, but that is CSS
    # `uppercase` — `::-p-text` reads textContent, which is what the component
    # wrote. Guessing the rendered case cost this shot one round.
    screenIs: h3::-p-text(Historial de Eventos)
    dataReady: table tbody tr
    clip: h3::-p-text(Historial de Eventos)
    clipUp: div.panel
    settleMs: 3000

  - slot: dashboard.analitica.fig
    view: dashboard
    steps:
      - click: button::-p-text(Analítica)
    screenIs: ::-p-text(Análisis de Llamadas)
    dataReady: ::-p-text(Análisis de Llamadas)
    settleMs: 3500

  - slot: dashboard.emergency.fig
    view: dashboard
    steps:
      - click: button::-p-text(Emergency Dashboard)
    screenIs: ::-p-text(Llamadas atendidas)
    dataReady: ::-p-text(Llamadas atendidas)
    settleMs: 3500

  # --- Crear Incidente's four accordion steps ---------------------------------
  #
  # The accordion opens one step at a time, so each figure is a click on its own
  # header. `dataReady` is a field inside that step: the header stays on screen
  # whether the step is open or shut, so it cannot prove the step opened.

  - slot: crear-incidente.general.fig
    view: create-incident
    screenIs: h3::-p-text(Crear Incidente)
    dataReady: ::-p-text(Tipo de incidente)
    clip: h3::-p-text(Crear Incidente)
    clipUp: div.panel
    settleMs: 2000

  # NOT captured: `crear-incidente.reportante.fig`, `.detalles.fig` and
  # `.resumen.fig`.
  #
  # Each needs its accordion step OPEN, and clicking the step's header does not
  # open it. Verified against the running app: `button::-p-text(Datos del
  # reportante)` matches (275x16), the click lands, and `Nombre del reportante`
  # is still absent afterwards. So the header is not the toggle, or the step is
  # gated on something the form has not been given.
  #
  # Left pending rather than guessed at. A wrong interaction that happens to
  # satisfy `screenIs` would deliver the general step's picture into three slots
  # whose captions promise three different ones, and every count would agree.

  # --- controls, one per slot, clipped to the control itself -------------------
  #
  # The selector for each comes from this manual's own `labels` citation: the slot
  # id IS the item id IS the citation's `at`, so every control below is addressed
  # by the string the manual quotes and `labels` checks against the source. Which
  # ATTRIBUTE carries it differs per control — `title`, `placeholder`, or the text
  # of a `<Label>` — and that is why each one names it rather than guessing.
  #
  # `module-completeness`: "A control the operator must press — always." So the
  # clip is the control, not the panel around it.

  # Home's review controls. `title` for the buttons, `placeholder` for the field.
  - slot: home.revision.control.buscar
    view: home
    screenIs: h3::-p-text(Revisión de llamadas)
    dataReady: input[placeholder="Buscar por ID, dir..."]
    clip: input[placeholder="Buscar por ID, dir..."]
    settleMs: 1500

  - slot: home.revision.control.filtros
    view: home
    screenIs: h3::-p-text(Revisión de llamadas)
    dataReady: button[title="Filtros"]
    clip: button[title="Filtros"]
    settleMs: 1500

  # Both of these alternate their `title`; the citation names the state the manual
  # documents, which is the one the control shows at rest.
  - slot: home.revision.control.orden
    view: home
    screenIs: h3::-p-text(Revisión de llamadas)
    dataReady: button[title="Más recientes primero"]
    clip: button[title="Más recientes primero"]
    settleMs: 1500

  - slot: home.revision.control.teclado
    view: home
    screenIs: h3::-p-text(Revisión de llamadas)
    dataReady: button[title="Mostrar teclado"]
    clip: button[title="Mostrar teclado"]
    settleMs: 1500

  # Seatmap's layout-edit control. Present for this account, which is itself a
  # fact worth noting: it is gated on `canManageSitemapLayout`.
  - slot: seatmap.distribucion.editar
    view: sitemap
    screenIs: ::-p-text(Tiempo de espera más larga)
    dataReady: button[title="Editar distribución"]
    clip: button[title="Editar distribución"]
    settleMs: 2500

  # Dashboard.
  - slot: dashboard.historial.buscar.campo
    view: dashboard
    screenIs: h3::-p-text(Historial de Eventos)
    dataReady: input[placeholder="Buscar por tipo, queue o teléfono..."]
    clip: input[placeholder="Buscar por tipo, queue o teléfono..."]
    settleMs: 2500

  # NOT captured: `dashboard.analitica.accion.limpiar`. The control lives in the
  # analytics FILTERS panel (`analytics-filters-panel.tsx:1038`), which is a
  # separate docked panel — opening the Analítica tab does not open it. Probed on
  # the running app: with the tab open, nothing on screen contains "Limpiar" at
  # all. Needs the step that opens that panel, which is not known yet.

  # Fuerzas en Campo's list controls.
  - slot: fuerzas-campo.agentes.control.buscar
    view: forces-in-field
    screenIs: h3::-p-text(Fuerzas en Campo)
    dataReady: input[placeholder="Buscar agente..."]
    clip: input[placeholder="Buscar agente..."]
    settleMs: 2500

  - slot: fuerzas-campo.agentes.control.filtros
    view: forces-in-field
    screenIs: h3::-p-text(Fuerzas en Campo)
    dataReady: button[title="Filtros"]
    clip: button[title="Filtros"]
    settleMs: 2500

  # Crear Incidente's first step is open on arrival, so its four fields need no
  # click. `<Label>` text, not an attribute.
  - slot: crear-incidente.general.campo.tipo
    view: create-incident
    screenIs: h3::-p-text(Crear Incidente)
    dataReady: ::-p-text(Tipo de incidente)
    clip: ::-p-text(Tipo de incidente)
    # Climb to the pair. `Label` renders a `<span>`
    # (`create-incident-fields.tsx:6-10`) and the field sits beside it inside a
    # `div`, so clipping the match alone photographed the WORD "Tipo de incidente" and
    # nothing else — a caption promising a control, answered by its own title.
    # `closest("div")` cannot return the span, so it lands on the wrapper.
    clipUp: div
    settleMs: 2000

  - slot: crear-incidente.general.campo.prioridad
    view: create-incident
    screenIs: h3::-p-text(Crear Incidente)
    dataReady: ::-p-text(Prioridad)
    clip: ::-p-text(Prioridad)
    # Climb to the pair. `Label` renders a `<span>`
    # (`create-incident-fields.tsx:6-10`) and the field sits beside it inside a
    # `div`, so clipping the match alone photographed the WORD "Prioridad" and
    # nothing else — a caption promising a control, answered by its own title.
    # `closest("div")` cannot return the span, so it lands on the wrapper.
    clipUp: div
    settleMs: 2000

  - slot: crear-incidente.general.campo.inicio
    view: create-incident
    screenIs: h3::-p-text(Crear Incidente)
    dataReady: ::-p-text(Hora inicio)
    clip: ::-p-text(Hora inicio)
    # Climb to the pair. `Label` renders a `<span>`
    # (`create-incident-fields.tsx:6-10`) and the field sits beside it inside a
    # `div`, so clipping the match alone photographed the WORD "Hora inicio" and
    # nothing else — a caption promising a control, answered by its own title.
    # `closest("div")` cannot return the span, so it lands on the wrapper.
    clipUp: div
    settleMs: 2000

  - slot: crear-incidente.general.campo.fin
    view: create-incident
    screenIs: h3::-p-text(Crear Incidente)
    dataReady: ::-p-text(Hora fin)
    clip: ::-p-text(Hora fin)
    # Climb to the pair. `Label` renders a `<span>`
    # (`create-incident-fields.tsx:6-10`) and the field sits beside it inside a
    # `div`, so clipping the match alone photographed the WORD "Hora fin" and
    # nothing else — a caption promising a control, answered by its own title.
    # `closest("div")` cannot return the span, so it lands on the wrapper.
    clipUp: div
    settleMs: 2000

  # --- CCTV, the one integrated Bridge of Things panel ------------------------
  #
  # PMV and PRT are gone from the manual at v0.6.6 and gone from here: PMV's data
  # layer is a fixture, PRT's backend is not live, and both are declared in
  # `sections/05-bridge-of-things.yaml`'s `pending` list. Nothing below opens
  # either one.
  #
  # The panel opens through its card on the landing DASHBOARD panel, which is the
  # path the manual documents. That click was once blamed for blanking the
  # application; it was not. Entering the VIEW a second time is, and the harness
  # now reloads its way out of that — see AGENTS.md.

  - slot: bot.cctv.fig
    view: bridge-of-things
    steps:
      # The card's own span. The click bubbles to the card, which carries
      # `isActivatePanelExternal: true` for CCTV. Safe to match on bare text
      # here: the camera names all begin "CCTV-" but the list does not exist
      # until this click has landed.
      - click: span::-p-text(CCTV)
      # The grid opens with every tile reading "Arrastrar cámara", so without
      # this the caption's "mosaico de cámaras" is answered by three black
      # rectangles. Real pointer events are required: nothing here is
      # `draggable=true`, the drag is pointer-based, and `shootAll` drives the
      # mouse rather than dispatching a synthetic event with no coordinates.
      - drag:
          from: ::-p-text(CCTV-Sena)
          # The GRID, not an empty tile. Dropping on `::-p-text(Arrastrar cámara)`
          # works exactly once: after the first run the mosaic is populated, that
          # text is gone from every tile, and the next three shots failed on it.
          # The grid's centre lands inside the large tile whether it is empty or
          # already showing a camera, and a drop there replaces what is in it —
          # so the recipe no longer depends on how the last run left the app.
          to: div.grid.h-full.w-full
    screenIs: h3::-p-text(CCTV)
    # The camera count, not the panel heading: the list is a query, and an empty
    # aside would photograph as "this deployment has no cameras".
    dataReady: ::-p-text(Cámaras)
    clip: h3::-p-text(CCTV)
    clipUp: div.panel
    # A stream needs far longer than a table. A tile satisfies any selector the
    # instant it is created, long before it has decoded a frame.
    settleMs: 7000

  - slot: bot.cctv.camaras.buscar
    view: bridge-of-things
    steps:
      - click: span::-p-text(CCTV)
    screenIs: h3::-p-text(CCTV)
    dataReady: ::-p-text(Cámaras)
    # The list header row, which holds BOTH the count and the search field —
    # the step reads "Ubique la cámara en la lista", and the field alone would
    # answer only half of it. Clipping the input matched a 242x18 strip.
    clip: input[placeholder="Buscar por Alias, ID o Nombre..."]
    clipUp: div[class*="border-b"]
    settleMs: 3000

  # --- the panel bar, which needs no panel open -------------------------------

  - slot: bot.abrir.barra
    view: bridge-of-things
    # NOT a panel heading. The bar is chrome, and which panel happens to be open
    # is whatever the last run left in the store — this shot failed once on
    # `h3::-p-text(DASHBOARD)` because the previous recipe left CCTV up.
    #
    # The bar's PMV icon instead: that icon exists only where the view's manifest
    # lists a PMV panel, which is this view alone, so it proves WHERE we are.
    screenIs: img[alt="PMV"]
    # And the icon about to be clipped, which proves the thing being photographed
    # has rendered rather than the bar being half-built.
    dataReady: img[alt="CCTV"]
    clip: img[alt="CCTV"]
    # The `ToolKitPanel` dock — a draggable motion.div portalled to document.body
    # at `bottom-24 left-5.5`, four icon-only buttons, one per panel of the view.
    # It carries no text of its own, which is why text probes kept missing it.
    clipUp: div[class*="bottom-24"]
    settleMs: 2000

  # --- CCTV: what only a SELECTED camera reveals ------------------------------
  #
  # The PTZ pad and the presets block do not exist until a camera is in the
  # mosaic: until then the footer reads "Selecciona una cámara para controlarla".
  # So every recipe below repeats the card click AND the drag. That is not
  # duplication to factor out — each shot is its own run and starts from whatever
  # view the window was left on.
  #
  # Every control here carries a real `title`, which is the handle the manual's
  # own quoted labels come from: Arriba izquierda, Tilt arriba, Arriba derecha,
  # Pan izquierda, Preset home, Pan derecha, Abajo izquierda, Tilt abajo, Abajo
  # derecha, Acercar (Zoom +), Alejar (Zoom -).

  - slot: bot.cctv.presets.orientar
    view: bridge-of-things
    steps:
      - click: span::-p-text(CCTV)
      - drag:
          from: ::-p-text(CCTV-Sena)
          to: div.grid.h-full.w-full
    screenIs: h3::-p-text(CCTV)
    # Title case in the DOM; the screen shows PRESETS DE POSICIÓN, and that is
    # CSS `uppercase`. Second time this product has charged for that guess.
    dataReady: ::-p-text(Presets de posición)
    # The 3x3 pad, reached from its centre button. The step is "Oriente la
    # cámara", which is what the whole pad does — not any one arrow, each of
    # which the manual already documents in its own icon row.
    clip: button[title="Preset home"]
    clipUp: div[class*="grid"]
    settleMs: 5000

  - slot: bot.cctv.presets.nombrar
    view: bridge-of-things
    steps:
      - click: span::-p-text(CCTV)
      - drag:
          from: ::-p-text(CCTV-Sena)
          to: div.grid.h-full.w-full
    screenIs: h3::-p-text(CCTV)
    dataReady: ::-p-text(Presets de posición)
    clip: input[placeholder="Nombre del preset..."]
    # The field and the save control sit in one row; the input alone is a 173x16
    # strip that shows a placeholder and no context.
    clipUp: div
    settleMs: 5000

  - slot: bot.cctv.presets.guardar
    view: bridge-of-things
    steps:
      - click: span::-p-text(CCTV)
      - drag:
          from: ::-p-text(CCTV-Sena)
          to: div.grid.h-full.w-full
    screenIs: h3::-p-text(CCTV)
    dataReady: ::-p-text(Presets de posición)
    # 12x16, the smallest control in this manual. Deliberate: the step names this
    # control and nothing else, and a 32x32 control already ships here.
    clip: button[title="Guardar posición actual"]
    settleMs: 5000

  - slot: bot.cctv.presets.volver
    view: bridge-of-things
    steps:
      - click: span::-p-text(CCTV)
      - drag:
          from: ::-p-text(CCTV-Sena)
          to: div.grid.h-full.w-full
      # AFTER the drag, never before: a drag drives the same mouse and would
      # carry the cursor off whatever a hover had uncovered.
      #
      # This shot was taken once without this step and DELETED. It came back
      # showing "Preset 1" and no control at all, because the row's button is
      # `opacity-0 group-hover:opacity-100` (`cctv-presets.tsx:109`). Correct
      # pixels, false promise: the caption is "Vuelva a la posición cuando la
      # necesite" and the reader would hunt for a button not in the frame.
      #
      # Opacity — not display, not visibility — so the button keeps its box and
      # its pointer events. That is why the hover can target the very selector
      # the clip is about to use, instead of guessing at the row around it.
      - hover: button[title="Ir a preset"]
    screenIs: h3::-p-text(CCTV)
    dataReady: ::-p-text(Presets de posición)
    # The first saved preset's row: its name plus the control that returns to it.
    # The button alone (28x24) would not show WHICH position it returns to, and
    # the step is "Vuelva a la posición cuando la necesite".
    clip: button[title="Ir a preset"]
    clipUp: div[class*="group"]
    settleMs: 5000

  # The two zooms were ruled out for EXTRACTION and that verdict stands: the
  # control is a magnifier SVG plus a `<span>` holding the character, so the file
  # alone is three quarters of it. A capture has no such problem — it photographs
  # what the operator sees, character included.

  - slot: bot.cctv.ptz.zoom-mas
    view: bridge-of-things
    steps:
      - click: span::-p-text(CCTV)
      - drag:
          from: ::-p-text(CCTV-Sena)
          to: div.grid.h-full.w-full
    screenIs: h3::-p-text(CCTV)
    dataReady: ::-p-text(Presets de posición)
    clip: button[title="Acercar (Zoom +)"]
    settleMs: 5000

  - slot: bot.cctv.ptz.zoom-menos
    view: bridge-of-things
    steps:
      - click: span::-p-text(CCTV)
      - drag:
          from: ::-p-text(CCTV-Sena)
          to: div.grid.h-full.w-full
    screenIs: h3::-p-text(CCTV)
    dataReady: ::-p-text(Presets de posición)
    clip: button[title="Alejar (Zoom -)"]
    settleMs: 5000

  - slot: bot.cctv.camaras.arrastrar
    view: bridge-of-things
    steps:
      - click: span::-p-text(CCTV)
      # One camera per cell, addressed by position, and three DIFFERENT cameras.
      # Dropping three times on the grid's centre put CCTV-Sena in all three
      # cells — a mosaic showing one camera thrice is an artefact of the capture,
      # not a screen any operator would have, and it would read as a fault.
      - drag:
          from: ::-p-text(CCTV-Sena)
          to: div.grid.h-full.w-full > div:nth-child(1)
      # NOT CCTV-Aeroparque, which was here first. Its stream sat at
      # readyState 1 with the cell's "Cargando..." pill still up 70 seconds in,
      # while the other two reached readyState 4 and cleared theirs. The pill is
      # not a stuck indicator and not a settle that is too short — it is that one
      # camera being slow, so the fix is a different camera, not more waiting.
      - drag:
          from: ::-p-text(CCTV-Astor)
          to: div.grid.h-full.w-full > div:nth-child(2)
      - drag:
          from: ::-p-text(CCTV-AKT)
          to: div.grid.h-full.w-full > div:nth-child(3)
    screenIs: h3::-p-text(CCTV)
    # A stream INSIDE the grid, not anywhere on the page: proof a cell actually
    # took a camera rather than the drags having missed.
    dataReady: div.grid.h-full.w-full video
    # The mosaic full, which is the state the step's text ends on ("la celda queda
    # con esa cámara y su transmisión comienza"). The two states it opens on — the
    # empty cell's "Arrastrar cámara" and the hovered cell's "Soltar aquí" — stay
    # in the prose, because neither survives a still frame. That is the whole
    # reason this slot was unfillable until the content was fixed; see the comment
    # on the step in `sections/05-bridge-of-things.yaml`.
    clip: div.grid.h-full.w-full
    settleMs: 28000

  # --- the no-interaction batch -----------------------------------------------
  #
  # Every recipe below is a rail click and a clip. Nothing here stages a call,
  # opens a panel or changes a control's state, which is what makes them safe to
  # run against somebody's signed-in window without asking first.

  # The map tools column. Its buttons carry no title, no aria-label and no text
  # — see ESTADO's note on why those six names are the manual describing a
  # function rather than quoting a rótulo — so the clip enters through the one
  # class they share and climbs to the column that holds them.
  #
  # `div[class*="rounded-2xl"][class*="shadow-lg"]` was checked to match ONCE on
  # this view. The panel shell also carries `liquid-glass`, which is why the clip
  # is `button[class*=…]` and not the bare class: the bare class would have
  # clipped the review panel and passed every count.
  - slot: home.herramientas.fig
    view: home
    screenIs: h3::-p-text(Revisión de llamadas)
    dataReady: div[class*="rounded-2xl"][class*="shadow-lg"]
    clip: button[class*="liquid-glass"]
    clipUp: div[class*="rounded-2xl"][class*="shadow-lg"]
    settleMs: 2500

  # "Ubique la llamada en la lista" — the LIST, not the panel. The panel is
  # already `home.revision.fig`; what this step promises is the scrolling column
  # of cards with the Prioridad badge on them, which is the container below.
  - slot: home.revision.abrir.ubicar
    view: home
    screenIs: h3::-p-text(Revisión de llamadas)
    # A card, not the panel header's "1 caso": the header paints before the
    # query lands, and a list photographed empty is a claim about the operation.
    dataReady: div[class*="cursor-pointer"][class*="rounded-2xl"]
    clip: div[class*="custom-scrollbar"][class*="overflow-y-auto"]
    settleMs: 2500

  # Seatmap's distribution region: the agency header AND the zone grid in one
  # frame, which is what "Planta de la agencia con los puestos agrupados por
  # zona" promises. The clip enters at the header and climbs — Seatmap's regions
  # are not `div.panel`, which is already recorded for the other two Seatmap
  # figures.
  #
  # `p-4`, NOT the `rounded-[23px]` container one level further up. That one is
  # 82px taller because it also holds `SitemapAgencyTabs`, and those tabs are
  # gated on `canViewAll` (sitemap-view.tsx:137) — the manual conditions them as
  # `seatmap.distribucion.agencias`, `when: permission: [todas-las-agencias]`.
  # This figure is NOT conditioned and delivers to `_common`, so the wider clip
  # put a `todas-las-agencias` control inside the `agencia-propia` PDF: a reader
  # without the permission would see a selector the manual never explains and
  # that their platform never mounts.
  #
  # The general rule this is an instance of: an unconditioned figure must not
  # frame a conditioned control. A capture cannot know that — only the content
  # can, so check the section's `when`s before choosing how wide to clip.
  - slot: seatmap.distribucion.fig
    view: sitemap
    screenIs: ::-p-text(Tiempo de espera más larga)
    # A workstation, not the header: the header renders from the agency name and
    # is on screen before the workstation query lands.
    dataReady: ::-p-text(Recepcion01)
    clip: div[class*="mb-6"][class*="items-center"][class*="px-2"]
    clipUp: div[class*="p-4"][class*="flex-col"][class*="relative"]
    settleMs: 3000

  # Dashboard's pagination, at the foot of Historial de Eventos.
  - slot: dashboard.historial.paginacion.indicador
    view: dashboard
    screenIs: h3::-p-text(Historial de Eventos)
    dataReady: table tbody tr
    # The span itself, 85x16. Small, but it IS the control, and the smallest
    # already accepted here is 12x16 (`bot.cctv.presets.guardar`).
    clip: span::-p-text(Página)
    settleMs: 2500

  # "Anterior y Siguiente" — a row naming TWO controls, which is the shape that
  # turned out to be an authoring defect for CCTV's diagonals. It is NOT one
  # here, and the difference is worth recording: the product wraps both buttons
  # in one `div.flex.items-center.gap-2` (events-history-panel.tsx:334), so a
  # single clip shows both, exactly as the label reads. That is the same verdict
  # `bot.cctv.presets.volver` reached — split only when each control has its own
  # box, never merely because the label names two.
  #
  # NOT the whole pagination strip: that is 1798x28, and letterboxed into the
  # 320/200 figure box it renders as a 5px sliver. The wrapper is 203x28.
  - slot: dashboard.historial.paginacion.mover
    view: dashboard
    screenIs: h3::-p-text(Historial de Eventos)
    dataReady: table tbody tr
    clip: button::-p-text(Anterior)
    clipUp: div[class*="gap-2"][class*="items-center"]
    settleMs: 2500

  # "Ubique el evento en la tabla" — the table with rows in it. The step is
  # about finding a row, so the figure has to show rows rather than the panel
  # chrome that `dashboard.historial.fig` already carries.
  - slot: dashboard.historial.detalle.ubicar
    view: dashboard
    screenIs: h3::-p-text(Historial de Eventos)
    dataReady: table tbody tr
    clip: table
    settleMs: 2500

  # Seatmap's three distribution elements, and the one procedure step that is a
  # clip rather than an interaction.

  # HELD, not missing. This recipe is correct and its shot was rejected on
  # LEGIBILITY, measured against what this manual already accepts rather than
  # against arithmetic — which is the check AGENTS.md demands.
  #
  # `layout: beside` gives a figure 38% of the content width (`.pair__figure`,
  # css-bridge.ts:414): a 244x152 box. The header band is 1275x46, so `contain`
  # scales it by 0.19 and the agency name lands at roughly 2px tall. Every
  # `beside` figure already delivered here scales between 0.60 and 1.13, the most
  # extreme being `fuerzas-campo.agentes.control.buscar` at 0.62.
  #
  # There is no tighter clip that helps: the band's own content is a centred name
  # over a full-width rule, and the name alone is one word. What settles it is a
  # decision about the row — not another selector.
  # - slot: seatmap.distribucion.encabezado
  #   view: sitemap
  #   screenIs: ::-p-text(Tiempo de espera más larga)
  #   dataReady: div[class*="mb-6"][class*="items-center"][class*="px-2"]
  #   clip: div[class*="mb-6"][class*="items-center"][class*="px-2"]
  #   settleMs: 3000

  # The zone grid alone — the plan without the header above it, which is the
  # element this row names. `transition-opacity` is what distinguishes it from
  # the wrappers around it; checked to match once on this view.
  - slot: seatmap.distribucion.zonas
    view: sitemap
    screenIs: ::-p-text(Tiempo de espera más larga)
    dataReady: ::-p-text(Recepcion01)
    clip: div[class*="shrink-0"][class*="transition-opacity"]
    settleMs: 3000

  # The agency tab bar. Conditioned content — `when: permission:
  # [todas-las-agencias]`, gated on `canViewAll` at sitemap-view.tsx:137 — so
  # this delivers under the value's own folder, not `_common`. The account this
  # attaches to holds the permission, which is why the bar is on screen at all.
  #
  # The tab LIST, not the band around it: the band is 1307x82 and mostly empty,
  # while the list is 545x50 and holds all four tabs with the current one
  # highlighted, which is what the row describes.
  - slot: seatmap.distribucion.agencias
    view: sitemap
    screenIs: ::-p-text(Tiempo de espera más larga)
    dataReady: button::-p-text(Bomberos)
    clip: button::-p-text(Bomberos)
    clipUp: div[class*="inline-flex"][class*="rounded-lg"]
    settleMs: 3000

  # "Ubique el selector de agencias" — the same frame as the row above, which is
  # correct: the step's whole content is finding that bar. The two steps after it
  # (`seleccionar`, `verificar`) need a tab CLICKED and are not in this batch.
  - slot: seatmap.distribucion.cambiar-agencia.abrir
    view: sitemap
    screenIs: ::-p-text(Tiempo de espera más larga)
    dataReady: button::-p-text(Bomberos)
    clip: button::-p-text(Bomberos)
    clipUp: div[class*="inline-flex"][class*="rounded-lg"]
    settleMs: 3000

  # Fuerzas en Campo's agent list. The caption promises three things — the list,
  # its search box AND the force-filter row — so the clip is the whole panel
  # rather than the scrolling column: the two controls live in the panel header,
  # above the list.
  - slot: fuerzas-campo.agentes.fig
    view: forces-in-field
    screenIs: h3::-p-text(Fuerzas en Campo)
    # An agent ROW, not the search box: the panel paints its header and controls
    # before the roster query lands, so gating on the input would photograph an
    # empty list — a claim about the operation rather than a figure.
    dataReady: div.panel button[class*="w-full"][class*="rounded-lg"]
    clip: input[placeholder="Buscar agente..."]
    clipUp: div.panel
    settleMs: 3000

  # Crear Incidente's fifth field, same shape as the four already delivered:
  # `<Label>` renders a span, so the clip climbs to the label-and-field pair.
  - slot: crear-incidente.general.campo.ubicacion
    view: create-incident
    screenIs: h3::-p-text(Crear Incidente)
    dataReady: ::-p-text(Ubicación)
    clip: ::-p-text(Ubicación)
    clipUp: div
    settleMs: 2000

  # "Control de apertura al pie del formulario" — the button, NOT the foot band
  # around it. The band is 448x53 and holds `Crear incidente` beside `Limpiar`,
  # and `Limpiar` is documented nowhere in this section: framing it would show
  # the reader a control the manual never explains. Same rule that re-clipped
  # `seatmap.distribucion.fig` — do not frame what the content does not name.
  - slot: crear-incidente.abrir.fig
    view: create-incident
    screenIs: h3::-p-text(Crear Incidente)
    dataReady: button::-p-text(Crear incidente)
    clip: button::-p-text(Crear incidente)
    settleMs: 2000
