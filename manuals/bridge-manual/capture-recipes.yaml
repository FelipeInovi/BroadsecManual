  - slot: seatmap.distribucion.agencias
    view: sitemap
    screenIs: ::-p-text(Tiempo de espera más larga)
    dataReady: button::-p-text(Bomberos)
    clip: button::-p-text(Bomberos)
    clipUp: div[class*="inline-flex"][class*="rounded-lg"]
    settleMs: 3000

  # "Ubique el selector de agencias" — the same frame as the row above, which is
  # correct: the step's whole content is finding that bar. The two steps after it
  # (`seleccionar`, `verificar`) need a tab CLICKED and are not in this batch.
  - slot: seatmap.distribucion.cambiar-agencia.abrir
    view: sitemap
    screenIs: ::-p-text(Tiempo de espera más larga)
    dataReady: button::-p-text(Bomberos)
    clip: button::-p-text(Bomberos)
    clipUp: div[class*="inline-flex"][class*="rounded-lg"]
    settleMs: 3000

  # Fuerzas en Campo's agent list. The caption promises three things — the list,
  # its search box AND the force-filter row — so the clip is the whole panel
  # rather than the scrolling column: the two controls live in the panel header,
  # above the list.
  - slot: fuerzas-campo.agentes.fig
    view: forces-in-field
    screenIs: h3::-p-text(Fuerzas en Campo)
    # An agent ROW, not the search box: the panel paints its header and controls
    # before the roster query lands, so gating on the input would photograph an
    # empty list — a claim about the operation rather than a figure.
    dataReady: div.panel button[class*="w-full"][class*="rounded-lg"]
    clip: input[placeholder="Buscar agente..."]
    clipUp: div.panel
    settleMs: 3000

  # Crear Incidente's fifth field, same shape as the four already delivered:
  # `<Label>` renders a span, so the clip climbs to the label-and-field pair.
  - slot: crear-incidente.general.campo.ubicacion
    view: create-incident
    screenIs: h3::-p-text(Crear Incidente)
    dataReady: ::-p-text(Ubicación)
    clip: ::-p-text(Ubicación)
    clipUp: div
    settleMs: 2000

  # "Control de apertura al pie del formulario" — the button, NOT the foot band
  # around it. The band is 448x53 and holds `Crear incidente` beside `Limpiar`,
  # and `Limpiar` is documented nowhere in this section: framing it would show
  # the reader a control the manual never explains. Same rule that re-clipped
  # `seatmap.distribucion.fig` — do not frame what the content does not name.
  - slot: crear-incidente.abrir.fig
    view: create-incident
    screenIs: h3::-p-text(Crear Incidente)
    dataReady: button::-p-text(Crear incidente)
    clip: button::-p-text(Crear incidente)
    settleMs: 2000

  # "Haga clic en CSV o en Excel" — a step naming two controls, and the product
  # wraps exactly those two: `div.ml-auto.flex.items-center.gap-1`
  # (events-history-toolbar.tsx:121). 144x32 with both buttons in frame. Third
  # instance of the same judgement in this file — clip the wrapper when one
  # exists, split the row only when each control has its own box.
  - slot: dashboard.historial.exportar.formato
    view: dashboard
    screenIs: h3::-p-text(Historial de Eventos)
    dataReady: button::-p-text(CSV)
    clip: button::-p-text(CSV)
    clipUp: div[class*="ml-auto"][class*="gap-1"]
    settleMs: 2500

  # The heat-map toggle. The row says it plainly — "se controla desde la barra de
  # paneles" — so this is the ToolKitPanel, the same portalled bar as
  # `bot.abrir.barra`, at `div[class*="bottom-24"]`. On Dashboard that bar holds
  # ONE button: a lucide `flame`, teal and active, because the row also says the
  # map arrives switched on.
  #
  # No `img[alt]` here, unlike Bridge of Things: BoT's three panel icons are
  # files under `assets/bot_status_icons/`, while this one is drawn by a
  # component. So the bar is addressed by its container and the button by being
  # the only one in it.
  - slot: dashboard.calor.control
    view: dashboard
    screenIs: h3::-p-text(Historial de Eventos)
    dataReady: div[class*="bottom-24"] button
    clip: div[class*="bottom-24"] button
    settleMs: 2500

  # --- Home's phone keypad: one reversible click ------------------------------
  #
  # `Mostrar teclado` swaps the review panel for the keypad, and the keypad's own
  # `Volver a la vista anterior` swaps it back. The round trip was walked before
  # writing this: the list came back intact.
  #
  # ORDER MATTERS in this block. `llamar.abrir` photographs the control that
  # OPENS the keypad, and that control exists ONLY while the keypad is closed —
  # `CallsReviewSearch` is mounted from calls-review-panel.tsx:204 alone, and
  # opening the keypad deactivates that panel. So it is shot first, and only the
  # recipe after it carries the click; the last two run with the keypad already
  # open. Running this block out of order fails loudly rather than quietly, which
  # is what `screenIs` is for.

  - slot: home.teclado.llamar.abrir
    view: home
    screenIs: h3::-p-text(Revisión de llamadas)
    dataReady: button[title="Mostrar teclado"]
    clip: button[title="Mostrar teclado"]
    settleMs: 2000

  - slot: home.teclado.fig
    view: home
    steps:
      - click: button[title="Mostrar teclado"]
    # NOT Home's usual tell. Opening the keypad unmounts the review panel, so
    # `Revisión de llamadas` is gone by the time the gates run; the keypad's own
    # return control is the state this shot is about.
    screenIs: button[title="Volver a la vista anterior"]
    dataReady: input[placeholder*="Número"]
    # Through the return control rather than `div.panel` directly: Home shows
    # three panels and the bare selector would take whichever the DOM happens to
    # order first.
    clip: button[title="Volver a la vista anterior"]
    clipUp: div.panel
    settleMs: 2500

  - slot: home.teclado.llamar.marcar
    view: home
    screenIs: button[title="Volver a la vista anterior"]
    dataReady: input[placeholder*="Número"]
    # The field AND the pad. The step says "componer el número", which is both —
    # the `grid-cols-3` inside is the digits without the field they fill.
    clip: input[placeholder*="Número"]
    clipUp: div[class*="pt-0"][class*="flex-col"]
    settleMs: 2000

  - slot: home.teclado.llamar.volver
    view: home
    screenIs: button[title="Volver a la vista anterior"]
    dataReady: button[title="Volver a la vista anterior"]
    clip: button[title="Volver a la vista anterior"]
    settleMs: 2000

  # --- Fuerzas en Campo: the panels that start inactive ------------------------
  #
  # This view opens with only its own list. `assign-incident`, `shifts` and
  # `create-task` are all `initiallyInactive` (forces-in-field.tsx:68, :82, :93),
  # which is what "Fuerzas en Campo opens with only its own list" in the header
  # of this file already recorded — this block is the way in.
  #
  # The panel bar carries TWO of the three: a lucide `siren` for Asignación de
  # Incidentes and a `calendar-clock` for Turnos. `create-task` ("Orden de
  # Tarea", icon `ClipboardCheck`) is NOT in the bar, so its six slots are not
  # reachable this way and are not in this block.
  #
  # ORDER MATTERS, as in the keypad block, and for a sharper reason: the bar's
  # buttons TOGGLE. Running the first recipe against an already-open panel would
  # CLOSE it, and every gate after would fail. The block assumes the view's
  # initial state, which `capture` gets by clicking in from another view.

  - slot: fuerzas-campo.asignacion.fig
    view: forces-in-field
    steps:
      - click: div[class*="bottom-24"] button:has(svg.lucide-siren)
      # The agent click belongs to this shot, not to convenience. The panel
      # opens EMPTY — "Seleccioná un agente en Fuerzas en Campo para asignarle un
      # incidente" — and the caption promises "un caso por fila", which does not
      # exist until an agent is selected.
      #
      # Named rather than positional, the same way the CCTV mosaic names its
      # three cameras: the roster is alphabetical and this is its first entry.
      - click: button::-p-text(Miguel Agudelo)
    screenIs: h3::-p-text(Asignación de Incidentes)
    # A case row's own control, not the panel heading: the heading is there while
    # the panel still shows its empty-state sentence.
    #
    # `button`, and the tag is load-bearing. TWO different controls carry the
    # accessible name "Asignar incidente": a `<span role="button">` on every
    # AGENT row (agent-row.tsx:101) and this `<button>` on every CASE row
    # (assign-incident-action.tsx:113). The manual cites the second (:115). A
    # bare `[aria-label=...]` matches forty elements across two panels and would
    # have delivered a faultless picture of the wrong control.
    dataReady: button[aria-label="Asignar incidente"]
    clip: h3::-p-text(Asignación de Incidentes)
    clipUp: div.panel
    settleMs: 3000

  # Selecting an agent EXPANDS its row in place rather than opening a card
  # elsewhere: the row goes from 64px to 162px and gains `Intendencia` and
  # `Información General` — the inventory and the general data the caption names.
  - slot: fuerzas-campo.agentes.detalle.fig
    view: forces-in-field
    steps:
      # Both sections arrive COLLAPSED. The caption promises "sus datos
      # generales y su inventario", and two headers with chevrons beside them do
      # not answer that — the first shot was faultless pixels and half a
      # promise. Expanding takes the card from 428x162 to 428x380.
      #
      # The agent itself is NOT clicked here: the recipe above already selected
      # it, and clicking the row again would collapse it.
      - click: button::-p-text(Intendencia)
      - click: button::-p-text(Información General)
    screenIs: h3::-p-text(Fuerzas en Campo)
    dataReady: ::-p-text(Información General)
    clip: button::-p-text(Miguel Agudelo)
    clipUp: div[class*="rounded-lg"]
    settleMs: 2500

  # "Seleccione el agente en la lista" — the roster with one row expanded, which
  # is what the step ends on.
  - slot: fuerzas-campo.asignacion.paso.agente
    view: forces-in-field
    screenIs: h3::-p-text(Fuerzas en Campo)
    dataReady: ::-p-text(Información General)
    clip: input[placeholder="Buscar agente..."]
    clipUp: div.panel
    settleMs: 2500

  # The case row's assign control, in its `idle` phase. Every case row carries
  # one and the clip takes the first; they are the same control.
  #
  # `button`, not `span` — see the note on the gate above. This is the control
  # the section cites (assign-incident-action.tsx:115), and it is the one whose
  # three phases the content describes.
  - slot: fuerzas-campo.asignacion.control.pedir
    view: forces-in-field
    screenIs: h3::-p-text(Asignación de Incidentes)
    dataReady: button[aria-label="Asignar incidente"]
    clip: button[aria-label="Asignar incidente"]
    settleMs: 2500

  - slot: fuerzas-campo.asignacion.paso.pedir
    view: forces-in-field
    screenIs: h3::-p-text(Asignación de Incidentes)
    dataReady: button[aria-label="Asignar incidente"]
    clip: button[aria-label="Asignar incidente"]
    settleMs: 2500

  # Turnos' two header controls. The panel needs NO bar click of its own:
  # selecting an agent opens it, which the recipe above already did. Clicking the
  # `calendar-clock` here would TOGGLE it shut — that was walked and confirmed.
  #
  # `turnos.fig` is NOT in this block. Its caption is "Columna de turnos acotada
  # al agente seleccionado", and every agent tried — Miguel Agudelo, Angélica
  # Álvarez, Mateo Álvarez, Diego Arango — comes back "Sin turnos encontrados".
  # An empty column photographs as a claim about the operation, the same reason
  # `fuerzas-campo.fig` gates on a roster row. It needs an agent that HAS shifts,
  # which is a data condition and not a recipe.
  #
  # The two controls below render regardless of whether any shift comes back,
  # which is why they are takeable and the figure is not.

  - slot: fuerzas-campo.turnos.control.buscar
    view: forces-in-field
    screenIs: h3::-p-text(Turnos)
    dataReady: input[placeholder="Buscar turno..."]
    clip: input[placeholder="Buscar turno..."]
    settleMs: 2500

  # SCOPED, and it has to be. With Turnos open there are TWO `button[title=
  # "Filtros"]` on screen — the agent roster's and this one — and a bare
  # selector takes whichever the DOM orders first. The container is the shifts
  # toolbar, `div.flex.items-center.gap-1.5.px-2.pt-2` (shifts-search.tsx:63).
  #
  # Worth knowing for the already-delivered `fuerzas-campo.agentes.control.filtros`
  # above: it uses the bare selector and was shot while Turnos was CLOSED, so it
  # was unambiguous then and would not be now.
  - slot: fuerzas-campo.turnos.control.filtros
    view: forces-in-field
    screenIs: h3::-p-text(Turnos)
    dataReady: div[class*="pt-2"][class*="gap-1.5"] button[title="Filtros"]
    clip: div[class*="pt-2"][class*="gap-1.5"] button[title="Filtros"]
    settleMs: 2500

  # Dashboard's event detail. One reversible click opens the dialog and its own
  # close control shuts it; the step's text says as much ("la tabla queda como
  # estaba").
  #
  # ORDER MATTERS: `abrir` opens the dialog and `cerrar` reads it. Running
  # `abrir` while the dialog is already up would click a row behind a modal.

  # The THIRD row, chosen for COMPLETENESS. The caption promises "todo lo
  # registrado de ese evento", and the rows differ in what they actually hold —
  # surveyed by opening the first six in turn:
  #
  #   566  transcript yes  attributes no
  #   565  yes  yes
  #   564  yes  yes   <- this one: Accidente de Tránsito, with a street address
  #   563  yes  yes
  #   562  no   yes
  #   561  yes  yes
  #
  # 566 was the first pick and renders "Sin datos del evento" in the attributes
  # panel, so it answered two thirds of its own caption. 564 fills both panels
  # and is the representative case.
  #
  # Same shape as the CCTV mosaic naming three cameras: when the product's data
  # decides whether a shot is usable, the recipe picks the data.
  - slot: dashboard.historial.detalle.abrir
    view: dashboard
    steps:
      - click: table tbody tr:nth-child(3)
    # The dialog's own heading, which is also the manual's claim: "un cuadro
    # titulado **Evento** seguido del identificador" — it reads `EVENTO 566`.
    screenIs: '[role="dialog"] h2'
    dataReady: '[role="dialog"] h2'
    clip: '[role="dialog"]'
    settleMs: 2500

  # This one carries its OWN click, unlike the second recipe in every other
  # block here. The harness reaches each shot by clicking the rail, and that
  # dismisses the modal — the first attempt failed on `[role="dialog"] h2`
  # with the dialog already gone. A modal is not panel state and does not
  # survive navigation.
  - slot: dashboard.historial.detalle.cerrar
    view: dashboard
    steps:
      - click: table tbody tr
    screenIs: '[role="dialog"] h2'
    dataReady: '[data-slot="dialog-close"]'
    clip: '[data-slot="dialog-close"]'
    settleMs: 2000

  # The `confirming` phase. Reachable, and safe — which was checked in the source
  # before anything was pressed, because this is a live dispatch console.
  #
  #   onRequest={() => setConfirmingId(item.analyticsId)}   local state
  #   onCancel ={() => setConfirmingId(null)}               local state
  #   onConfirm={() => void handleConfirm(item)}            THIS one dispatches
  #
  # (assign-incident-panel.tsx:169-171.) Pressing the assign control touches no
  # server; it only swaps that row's control for the check/cross pair. Nothing
  # here ever presses the check.
  #
