  # HOW THE SIX ABOVE WERE ACTUALLY TAKEN, and the mechanism that let them work.
  #
  # The form is local component state and a round trip to another view WIPES it —
  # `nav home` then `nav create-incident` came back with every field empty and
  # the three steps locked again. But a rail click onto the view the window is
  # ALREADY on does not remount the panel, so a run of consecutive
  # `view: create-incident` recipes keeps whatever the form holds.
  #
  # That is why this block runs green from a `--only` of its own six slots after
  # the form is filled by hand, and why in a FULL run it would not: the recipes
  # before it sit on other views, so the harness arrives here with an empty form,
  # the locked headers swallow their clicks, and six figures come back showing
  # step 1.
  #
  # The fill, for whoever repeats it: pick an incident type, collapse that
  # dropdown, pick a priority, click `Editar dirección`, type into
  # `Buscar dirección…`, click a suggestion, click `Aceptar dirección`. Then
  # `Limpiar` afterwards — this is a live console.
  #
  # What would make them self-contained is ONE thing: a `type` step in the
  # recipe vocabulary. Everything else in that sequence is already a `click`.

  # --- the four `llamada.cierre.*` slots: shot, but NOT by this harness --------
  #
  # These four are DELIVERED and there is deliberately no recipe above for them,
  # because `capture` cannot reach the screen they live on. Recorded here so the
  # next person can repeat the shot, and so nobody writes a recipe that would
  # abort.
  #
  # WHY THE HARNESS CANNOT: the wrap-up screen is the CALL view, and `navigate()`
  # always calls `enterView`, which clicks a rail position. The Llamada rail
  # button only renders while `isCallActive` (icon-sidebar.tsx:114) — and in the
  # wrap-up the call has ENDED, so the button is gone and the view is
  # unaddressable. There is no `view:` value that reaches it.
  #
  # WHY IT DID NOT NEED TO: the application is already there. `onCallEnded` with
  # a report keeps `activeView` on `call` (dashboard.tsx:142) and the wrap-up
  # holds it — observed still holding twelve minutes after the call ended. So the
  # shot is a screenshot with NO navigation: attach, clip, done.
  #
  # The other two blockers are OFF in the wrap-up, which is what makes this
  # window usable at all: the rail is back to 6 (so the length guard passes) and
  # `Agencia:` is back in the top bar (so `verify` passes). Both were confirmed
  # by watching four calls. It is ONLY the missing navigation that stops
  # `capture` here.
  #
  # HOW TO REPEAT: answer a call, end it, and while the wrap-up bar still reads
  # `Trabajo post-llamada`, attach read-only and clip these four:
  #
  #   llamada.cierre.fig                 whole viewport, no clip
  #   llamada.cierre.enviar.completar    the foot band, `LLAMADA FINALIZADA` +
  #                                      `Complete el libro del caso antes de
  #                                      enviarlo` — the step's text names that
  #                                      band, so the band IS the figure
  #   llamada.cierre.enviar.guardar      button[title="Guardar"] in the case-book
  #                                      panel, padded
  #   llamada.cierre.enviar.confirmar    button holding `Enviar a la agencia`
  #
  # ONE step away from being a real recipe: a recipe that declares NO navigation
  # — shoot the view the window is already on. That single addition turns this
  # comment into four ordinary entries above.
  #
  # AND A TRAP, because it nearly cost a wrong delivery: the wrap-up DOES show
  # `Editar Ubicación del Incidente` and `Editar Dirección`, in the right-hand
  # Detalles del Caso panel. They are NOT the `llamada.mapa.ubicacion.*` controls
  # of this manual, which come from `incident-location-bar.tsx` — the bar over
  # the map, present only during a call. The capitalisation is the tell: the
  # manual cites `Editar dirección`, the panel renders `Editar Dirección`.

  # --- the call figures: shot from saved frames, not by this harness ----------
  #
  # `llamada.fig`, `llamada.transcripcion.fig` and `llamada.banda.fig` are
  # DELIVERED, and like the `cierre` block above they
  # have no recipe, for the same reason plus two more: during a call `verify`
  # has no `Agencia:` to find (top-bar.tsx:254 renders OperatorBadge only when
  # `!hasActiveCall`) and the rail grows to seven, which trips the length guard
  # (capture-run.ts:352). Confirmed by watching four calls.
  #
  # HOW THEY WERE TAKEN: a read-only watcher sampled the window twice a second
  # through a live call and saved, on every change of screen SHAPE, the whole
  # viewport PLUS every control box measured at that same instant. Crops were
  # computed offline against the frame their boxes came from. No click, no
  # keystroke, no navigation — and, importantly, no coordination: the operator
  # ran the call at their own pace.
  #
  # SIX WERE HELD BACK, and each reason is a fact worth keeping:
  #
  # `llamada.video.fig`        Framed its caption exactly — the feed with the
  #                            caller's progress stamped at its foot. Held back
  #                            by the OWNER, not by a defect: it showed an
  #                            identifiable face and this manual is
  #                            client-facing. Retake with the caller video
  #                            pointed away from anyone.
  # `llamada.camaras.fig`      The CCTV panel was OPEN but EMPTY — skeleton bars,
  #                            no cameras. The caption promises "las cámaras
  #                            próximas al incidente". Correct pixels, false
