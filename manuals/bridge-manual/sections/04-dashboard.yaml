# Dashboard — written against the Bridge360 source (`bridge`, branch `develop`,
# 465f5eb9), cited by file and line.
#
# There is no module map for this product yet (no extractor exists for its
# shape), so every claim here carries its own provenance comment instead of
# tracing to `knowledge/`. Every quoted UI label is a QUOTATION, cited in the
# `labels` list below and checked by `broadsec-manual labels bridge-manual`.
# A quotation is cited from the Spanish catalogue (`src/i18n/locales/es/*.json`)
# when the product keys it, and from the component line when the component
# passes a literal. The catalogue keeps its own spelling ("No-emergencia",
# "Llamadas atendidas" in the emergency cards and "Llamadas Atendidas" in the
# operator card): a quotation is copied as the catalogue writes it, while the
# manual's own prose is written correctly.
#
# This module was rewritten in full on 2026-10-01, with the owner's
# authorisation, from the previous version that was written against `58e2cc4d`
# (and, as the audit found, against a checkout older than that). The drift audit
# is in engram, `bridge-manual/dashboard-drift-audit-2026-10-01`.
#
# ORGANISATION. Two fichas, as the product declares them
# (`views/dashboard-view.tsx:37-48`): `Historial de Eventos` and `Analítica`.
# `Analítica` holds five visible subfichas (`analytics-panel.tsx:31-42`;
# `Análisis de Colas` is `enabled: false` and filtered out at :51-53, so it is
# not on screen and the manual does not name it). The old third ficha,
# "Emergency Dashboard", never existed at the baseline: it is the subficha
# `Dashboard de Emergencias` of Analítica, and `Reportes de Emergencias` is a
# fifth one that is new since `58e2cc4d`.
#
# CONDITIONING. None. `views/dashboard-view.tsx` and the panels read no
# `agencyType`, `permissions`, `role` or `agencyId`, so the view is uniform for
# every target and the manual's axis (`view.sitemap.all`) does not reach it. The
# only permission is the sidebar gate `view.dashboard`
# (`components/layout/icon-sidebar.tsx:84`, filter at :146-151), which decides
# whether the option appears at all; it is stated in the access prose and
# nothing is tagged.
#
# WHAT THE CODE DOES NOT PROVE, and the text therefore does not claim:
#   - that the Dashboard de Emergencias numbers are personal or belong to the
#     shift: `useMyDashboard` asks for a fixed window, the last 30 days up to
#     now (`hooks/use-my-dashboard.ts:6-14`, :36-39), and nothing on the client
#     says whose calls they are. The text says only the window;
#   - the performance level thresholds of the operator table
#     (`classifyOperatorPerformance`): the text says the level is Alto, Medio or
#     Bajo and nothing about what makes it;
#   - what the Estado de operador options match: `agent-performance-radial-card.tsx:
#     80-87` compares them with the status code and category, and whether the
#     four option values (available, restroom, break, disconnected) meet the
#     statuses the backend returns is a live check;
#   - the export: `events-history-panel.tsx:173-190` sends the selected report
#     ids when there are any, the last 30 days and the search; what the backend
#     does with them is its side.
#
# NOT DOCUMENTED, and not a gap:
#   - `components/panels/emergency-dashboard/`: dead code since #163, replaced by
#     `emergency-dashboard-tab.tsx`. The previous version cited it.
#   - `previewColumns` (`events-history-columns.tsx:151`), `queue-analysis-tab`,
#     `response-times-tab`, `agent-stats-tab`, `abandoned-calls-tab`,
#     `call-volume-tab`, `queue-ring-time-tab`: exported and mounted nowhere
#     visible.
#   - the "Abandonadas" column of the operator table: gone since #277
#     (`operator-performance-table-card.tsx:199-253` lists eight columns).
#
# QUOTATIONS LEFT OUT ON PURPOSE. `dateRange.selectDateRange`
# (analytics.json:35, "Selecciona un rango de fechas") is in the familiar
# register the client PDF cannot carry; the section never needs it.
#
# FIGURES RE-DECLARED. Eight figures kept their node id but were given a new slot
# with `image:`, because the delivered file no longer matches the screen: the
# view's tab strip lost its third tab (dashboard.vista), the Historial panel
# gained its footer (dashboard.historial.vista), Analítica gained two subfichas
# (dashboard.analitica.vista), the emergency figure was taken from a button that
# no longer exists (dashboard.emergency.vista), the page controls were
# rearranged (mover-pie), and the detail dialog shows a card the manual does not
# describe (abrir-cuadro); the table captures of two procedure steps predate #345
# (ubicar-tabla, marcar-tabla). The old files stay on disk as orphans until the owner
# decides.
#
# Paths in comments are relative to `src/modules/dashboard/presentation/ui/` in
# the `bridge` source repository, except where another module is named in full.

id: dashboard
title: Dashboard
