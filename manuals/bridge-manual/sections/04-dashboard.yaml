  - at: dashboard.analitica.subficha.llamadas
    from: components/panels/dashboard/analytics-panel.tsx:24
  - at: dashboard.analitica.subficha.operadores
    from: components/panels/dashboard/analytics-panel.tsx:27

  # Filter fields, each from its `label=`.
  - at: dashboard.analitica.campo.agencia
    from: components/panels/dashboard/analytics-filters-panel.tsx:852
  - at: dashboard.analitica.campo.turno
    from: components/panels/dashboard/analytics-filters-panel.tsx:860
  - at: dashboard.analitica.campo.tipo-llamada
    from: components/panels/dashboard/analytics-filters-panel.tsx:908
  - at: dashboard.analitica.campo.estado-llamada
    from: components/panels/dashboard/analytics-filters-panel.tsx:916
  - at: dashboard.analitica.campo.prioridad
    from: components/panels/dashboard/analytics-filters-panel.tsx:924
  - at: dashboard.analitica.campo.operador
    from: components/panels/dashboard/analytics-filters-panel.tsx:932
  - at: dashboard.analitica.campo.estado-operador
    from: components/panels/dashboard/analytics-filters-panel.tsx:942
  - at: dashboard.analitica.campo.clasificacion
    from: components/panels/dashboard/analytics-filters-panel.tsx:951
  - at: dashboard.analitica.campo.granularidad
