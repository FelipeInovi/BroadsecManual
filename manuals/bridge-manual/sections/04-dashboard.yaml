  - at: dashboard.calor.control
    from: views/dashboard-view.tsx:25
  - at: dashboard.ficha.historial
    from: views/dashboard-view.tsx:37
  - at: dashboard.ficha.analitica
    from: views/dashboard-view.tsx:42
  - at: dashboard.ficha.emergency
    from: views/dashboard-view.tsx:47

  - at: dashboard.historial.buscar.campo
