  - at: dashboard.analitica.medida.total
    from: components/panels/dashboard/analytics-filters-panel.tsx:976
  - at: dashboard.analitica.medida.abandonadas
    from: components/panels/dashboard/analytics-filters-panel.tsx:985
  - at: dashboard.analitica.medida.promedio
