  - at: dashboard.historial.paginacion.indicador
    from: components/panels/dashboard/events-history/events-history-panel.tsx:331

  # `TABS`. `Análisis de Colas` sits at :26 with `enabled: false` and is filtered
  # out by `VISIBLE_TABS`, so it is not on screen and the manual does not name it.
  - at: dashboard.analitica.subficha.general
