# Dashboard — written against the Bridge360 source, cited by file and line.
#
# There is no module map for this product yet (no extractor exists for its
# shape), so every claim here carries its own provenance comment instead of
# tracing to `knowledge/`. There is no i18n catalogue either: every label below
# is a QUOTATION of a literal in the component, with the line it sits on. If the
# product rewords one, nothing here notices — that is recorded in ESTADO.md.
#
# Checked before writing, per ESTADO's standing note: `dashboard-view.tsx` reads
# NO divergence signal — no `agencyType`, `permissions`, `role` or `agencyId`.
# The view is uniform for every agency type, and nothing here is conditioned on
# the `permission` axis. No `when` in this file.
#
# INCOMPLETE ON PURPOSE — declared in the `pending` list below, which is where
# the evidence and the exit condition live. Not restated here.
#
# Paths in comments are relative to `src/modules/dashboard/presentation/ui/` in
# the `bridge` source repository, except where another module is named in full.

id: dashboard
title: Dashboard
subtitle: Historial, analítica e indicadores de la operación

sourceBase: src/modules/dashboard/presentation/ui/

# Where every quoted UI label in this section was copied from. Checked by
# `broadsec-manual labels bridge-manual`.
#
# NOT cited, because the product never said them: the column headings `Ficha`,
# `Qué muestra`, `Subficha`, `Qué analiza`, `Campo`, `Qué acota`, `Medida`,
# `Sobre qué aplica el rango`, `Recuento` and `Qué cuenta`. Nor is
# `dashboard.historial.paginacion.mover`, whose label reads "Anterior y
# Siguiente" — the manual joining two controls into one item, so no single line
# says it.
