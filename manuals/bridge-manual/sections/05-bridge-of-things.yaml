            # (limpiar).
            - id: bot.prt.control.buscar
              label: Buscar por nombre, cédula, placa o vehículo...
              text: >-
                Acota la programación a lo que coincida con lo que escriba.
              layout: beside

            - id: bot.prt.control.vehiculo
              label: Tipo de vehículo
              text: >-
                Deja solo la programación de ese tipo de vehículo.
                **Todos los vehículos** devuelve la lista completa.
              layout: beside

            - id: bot.prt.control.fechas
              label: Rango de fechas
              text: >-
