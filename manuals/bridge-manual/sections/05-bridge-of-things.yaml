# Bridge of Things — written against the Bridge360 source, cited by file and line.
#
# There is no module map for this product yet (no extractor exists for its
# shape), so every claim here carries its own provenance comment instead of
# tracing to `knowledge/`. There is no i18n catalogue either: every label below
# is a QUOTATION of a literal in the component, with the line it sits on. If the
# product rewords one, nothing here notices — that is recorded in ESTADO.md.
#
# Checked before writing, per ESTADO's standing note: `bridge-of-things-view.tsx`
# reads NO divergence signal — no `agencyType`, `permissions`, `role` or
# `agencyId`. Uniform for every agency type, nothing conditioned on the
# `permission` axis. No `when` in this file.
#
# Data checked too, and this is the reason for the omissions below. Of the four
# panels this view offers, only CCTV is documented, because it is the only one
# reading live data (`useCCTVCameras`). The other three are each left undescribed
# for a DIFFERENT reason, which is why each carries its own entry rather than one
# shared note.
#
# An earlier revision of this file claimed PMV, CCTV and PRT were all "fed by
# real queries". That read the hooks and stopped there: it missed the fixture
# gate underneath PMV's adapter, and it could not see PRT's server side at all.
# The owner corrected it. Reading the hook is not reading the data path.
#
# INCOMPLETE ON PURPOSE — declared in the `pending` list below, which is where
# the evidence and the exit condition live. Not restated here.
#
# Paths in comments are relative to `src/modules/dashboard/presentation/ui/` in
# the `bridge` source repository, except where another module is named in full.

id: bot
title: Bridge of Things
subtitle: Los sistemas integrados a la plataforma

# One level higher than the other sections, because this one cites
# `domain/types/` as well as `presentation/ui/`.
sourceBase: src/modules/dashboard/

# Where every quoted UI label in this section was copied from. Checked by
# `broadsec-manual labels bridge-manual`.
#
# NOT cited: the column headings (`Panel`, `Qué opera`, `Disposición`, `Celdas`,
# `Control`, `Qué hace`); `Barra de paneles`, which is the manual's name for the
# rail's panel list; and `bot.cctv.ptz.diagonales`, whose label lists four
# controls at once, so no single line says it.
labels:
  # BOT_MANIFEST.
  - at: bot.panel.dashboard
    from: presentation/ui/views/bridge-of-things-view.tsx:18
  - at: bot.panel.pmv
    from: presentation/ui/views/bridge-of-things-view.tsx:28
  - at: bot.panel.cctv
    from: presentation/ui/views/bridge-of-things-view.tsx:38
  - at: bot.panel.prt
    from: presentation/ui/views/bridge-of-things-view.tsx:48

  # `MOSAIC_LAYOUTS`. The product writes the multiplication sign, not the letter
  # x — worth keeping exact, since the two are indistinguishable on the page.
  - at: bot.cctv.disposicion.1x1
    from: domain/types/cctv.types.ts:45
  - at: bot.cctv.disposicion.2x2
    from: domain/types/cctv.types.ts:46
  - at: bot.cctv.disposicion.3x3
    from: domain/types/cctv.types.ts:47
  - at: bot.cctv.disposicion.4x4
    from: domain/types/cctv.types.ts:48
  - at: bot.cctv.disposicion.2x3
    from: domain/types/cctv.types.ts:49
  - at: bot.cctv.disposicion.3x2
    from: domain/types/cctv.types.ts:50
  - at: bot.cctv.disposicion.1x3
    from: domain/types/cctv.types.ts:51
  - at: bot.cctv.disposicion.3x1
    from: domain/types/cctv.types.ts:52

  # The PTZ bar's buttons.
  - at: bot.cctv.ptz.tilt-arriba
    from: presentation/ui/components/panels/dashboard/bridge-of-things/cctv-ptz-control-bar.tsx:60
  - at: bot.cctv.ptz.pan-izquierda
    from: presentation/ui/components/panels/dashboard/bridge-of-things/cctv-ptz-control-bar.tsx:81
  - at: bot.cctv.ptz.home
    from: presentation/ui/components/panels/dashboard/bridge-of-things/cctv-ptz-control-bar.tsx:91
  - at: bot.cctv.ptz.pan-derecha
    from: presentation/ui/components/panels/dashboard/bridge-of-things/cctv-ptz-control-bar.tsx:105
  - at: bot.cctv.ptz.tilt-abajo
    from: presentation/ui/components/panels/dashboard/bridge-of-things/cctv-ptz-control-bar.tsx:126
  - at: bot.cctv.ptz.zoom-mas
    from: presentation/ui/components/panels/dashboard/bridge-of-things/cctv-ptz-control-bar.tsx:152
  - at: bot.cctv.ptz.zoom-menos
    from: presentation/ui/components/panels/dashboard/bridge-of-things/cctv-ptz-control-bar.tsx:162

  # Both states are the two arms of one ternary, so both cite the same line.
  - at: bot.cctv.estado.sin-senal
    from: presentation/ui/components/panels/dashboard/bridge-of-things/cctv-camera-stream-pane.tsx:169
  - at: bot.cctv.estado.fuera
    from: presentation/ui/components/panels/dashboard/bridge-of-things/cctv-camera-stream-pane.tsx:169

# Parts of the product this section deliberately leaves undescribed. Internal —
# `awaiting` exports it; the manual names none of it. See `PendingDeclaration`.
pending:
  - id: bot.panel-dashboard-fixture
    covers: [bot.paneles]
    missing: >-
      Everything the panel labelled DASHBOARD displays — the one this view opens
      with. Its seven integration cards, each card's connection status dot, and
      the "Ult. Conexión" time under it. The section names the panel in the
      inventory and documents the panel bar as the way to reach the other three,
      and describes none of what this one shows.
    because: >-
      The cards are a hardcoded literal array with no query, no prop and no data
      source of any kind (`home-panel.tsx:20` — `dasboardPanelItems`, running to
      :84). `status` drives the green/red dot through `statusColors` (:86);
      `lastConnection` is a literal string rendered at :123-124; `description` is
      English placeholder copy in a Spanish product ("This is the CCTV panel.")
      rendered as body text at :121. Four of the seven carry
      `isActivatePanelExternal: false` (:53, :62, :71, :80), so clicking them
      does nothing. Sharper than a fixture elsewhere would be, because this is
      the landing panel: the first thing a reader of this view sees is
      fabricated integration health.
    settles: >-
      The product wiring the panel to real data, or the owner deciding how a
      manual describes a landing panel whose contents are invented.

  - id: bot.pmv-fixture-data-layer
    covers: [bot.paneles]
    missing: >-
      How the panel labelled PMV is operated. Composing a variable-message sign:
      the message fields, the pages and each page's dwell time, the pictogram
      catalogue and its three categories, the schedule, the preview, and the
      procedure that saves a programme. The section names the panel in the
      inventory and describes none of it.
    because: >-
      The panel's ENTIRE data layer has a dev-fixture path.
      `pmv-api.adapter.ts:27` reads `VITE_PMV_USE_MOCK` into `USE_MOCK`, and every
      read the panel makes branches on it: panels (:247), families (:32),
      subfamilies (:57, :62), groups (:94) and templates (:197). The fixtures are
      in `pmv.mock.ts`, declared dev-only at :9, six exports running to :180. The
      owner reports the integration is not live. Teaching an operator to schedule
      a sign against panels that may be fixtures is worse than saying nothing.
    settles: >-
      The product removing the fixture path, or confirming the panel reads live
      PMV data in the deployments this manual covers. The content was written once
      against the real components; recover it from this file's git history rather
      than re-deriving it.

  - id: bot.prt-backend-not-live
    covers: [bot.paneles]
    missing: >-
      How the panel labelled PRT is operated. Its two tabs, the ten columns of the
      programming table and its filters, the nine columns of the resources table
      and its search, the procedure that dispatches a resource to a case, and the
      two dispatch states. The section names the panel in the inventory and
      describes none of it.
    because: >-
      NOT the same situation as PMV, and recorded separately for that reason. The
      code here is fully wired with no fixture path anywhere: it calls four real
      endpoints — `prt-api.adapter.ts:46` (`/api/prt/programacion`) and
      `resources-api.adapter.ts:15`, :29 and :50 (`/prt/resource-managment`,
      `/prt/resource-pj-flag`, `/prt/resource-dispatch`). So what is missing is
      not in this repository at all: the owner reports the integration is not
      live, which makes it a server-side fact this manual cannot see by reading
      the product. A dispatch procedure that returns nothing costs the reader
      their trust in the procedures that do work.
    settles: >-
      Confirming those four endpoints answer in the deployments this manual
      covers. The content was written once against the real components; recover it
      from this file's git history rather than re-deriving it.

children:
  - id: bot.proposito
    type: prose
    props:
      text: >-
        La vista **Bridge of Things** reúne los sistemas de campo integrados a la
        plataforma y permite operarlos sin salir de ella: los paneles de mensaje
        variable, las cámaras y la programación de recursos en vía.

  - id: bot.acceso
    type: prose
    props:
      # components/layout/icon-sidebar.tsx:68 — nav item id `bridge-of-things`,
      # label "Bridge of Things"; pages/dashboard.tsx:738 monta la vista.
      text: >-
        Diríjase a **Bridge of Things** en la barra lateral de iconos. La vista
        se organiza en paneles independientes sobre el mapa, que se abren y se
        cierran de a uno.

  - id: bot.fig
    type: figure
    props:
      caption: "Vista Bridge of Things con el tablero de sistemas integrados abierto."
      widthPercent: 90

  - id: bot.paneles
    type: data-table
    props:
      # Rótulos citados de BOT_MANIFEST, bridge-of-things-view.tsx:18, :28, :38
      # y :48. El primero es el único sin `initiallyInactive`, de modo que es el
      # que abre con la vista.
      labelHeader: Panel
      descriptionHeader: Qué opera
      rows:
        - id: bot.panel.dashboard
          label: DASHBOARD
          description: >-
            El tablero de los sistemas integrados. Es el panel con el que abre
            la vista.
        - id: bot.panel.pmv
          label: PMV
          description: >-
            Los paneles de mensaje variable: qué muestran, en qué páginas y en
            qué horarios.
        - id: bot.panel.cctv
          label: CCTV
          description: >-
            Las cámaras: el mosaico de vistas en vivo y el control de las
            cámaras móviles.
        - id: bot.panel.prt
          label: PRT
          description: >-
            La programación de recursos en vía y el estado de cada recurso.

  - id: bot.abrir
    type: field-list
    props:
      items:
        # La barra de paneles vive al pie del riel de iconos
        # (components/layout/icon-sidebar.tsx:158) y lista los paneles del
        # manifiesto de la vista activa, cada uno con su rótulo y si está activo
        # o no (components/panels/tool-kit-panel.tsx:186). Los cuatro paneles de
        # esta vista son acoplables, así que los cuatro figuran ahí.
        - id: bot.abrir.barra
          label: Barra de paneles
          text: >-
            Al pie de la barra lateral de iconos, lista los paneles de la vista
            e indica cuáles están abiertos. Haga clic en uno para abrirlo o
            cerrarlo. Es la forma de recuperar un panel que cerró.
          layout: beside

  - id: bot.disposicion
    type: prose
    props:
      # Un único panel abierto (fuera del tablero) toma la altura completa
      # (bridge-of-things-view.tsx:99-113); con dos o más, cada uno conserva su
      # geometría. La vista habilita la expansión (`expandable: true`, :82).
      # CCTV recibe un tamaño distinto según esté expandido, solo o acompañado
      # (:144-150). PMV hace lo mismo (:157-163) y NO se nombra acá: describir
      # cómo se comporta su panel es describir el panel. Ver `pending`.
      text: >-
        Cuando queda un solo panel abierto, ocupa la altura completa de la
        pantalla; al abrir un segundo, ambos vuelven a su tamaño habitual. Los
        paneles también pueden expandirse desde su propio encabezado, y la vista
        de CCTV aprovecha el espacio adicional mostrando más detalle en lugar de
        agrandar lo mismo.

  - id: bot.herramientas
    type: prose
    props:
      # Mismo `MapToolsPanel` que Home y Llamada, montado horizontal y centrado
      # arriba (bridge-of-things-view.tsx:184-186), con `hasLocation={false}`
      # (:185) — el comentario del producto en :182-183 dice por qué: acá no hay
      # incidente al que centrar.
      text: >-
        Las herramientas de mapa son las mismas que se describen en la sección
        **Home**, dispuestas aquí en una fila centrada en la parte superior. Como
        en Home, el control de centrado está deshabilitado: en esta vista no hay
        un incidente al que llevar el mapa.

  # --- CCTV ------------------------------------------------------------------
  - id: bot.cctv
    title: CCTV
    children:
      - id: bot.cctv.proposito
        type: prose
        props:
          text: >-
            Presenta las cámaras en un mosaico de vistas en vivo y permite
            mover las cámaras móviles, guardar posiciones y volver a ellas.

      - id: bot.cctv.ubicacion
        type: prose
        props:
          # BOT_MANIFEST, entrada `cctv` (bridge-of-things-view.tsx:36-45):
          # `initiallyInactive`. Encabezado citado de cctv-panel.tsx:36. Las
          # cámaras vienen del backend (`useCCTVCameras`, cctv-context.tsx:72).
          text: >-
            No está a la vista al entrar. Ábralo desde la barra de paneles: el
            panel lleva el título **CCTV** y presenta el mosaico de cámaras con
            la lista de cámaras disponibles a un costado.

      - id: bot.cctv.fig
        type: figure
        props:
          caption: "Panel CCTV con el mosaico de cámaras y la lista de cámaras disponibles."
          widthPercent: 90

      - id: bot.cctv.mosaico.titulo
        type: detail-header
        props:
          text: Disposición del mosaico

      - id: bot.cctv.mosaico.texto
        type: prose
        props:
          # Selector citado de cctv-layout-selector.tsx:72, que rotula el control
          # con la disposición vigente. El catálogo de disposiciones está en
          # domain/types/cctv.types.ts:44-53 y la que abre por omisión es la
          # segunda, 2×2 (cctv-context.tsx:64-66).
          text: >-
            El mosaico se reparte en celdas, y el selector de disposición indica
            cuál está vigente. Al abrir, el panel usa la disposición de dos por
            dos.

      - id: bot.cctv.mosaico.disposiciones
        type: data-table
        props:
          # Rótulos citados de domain/types/cctv.types.ts:45-52.
          labelHeader: Disposición
          descriptionHeader: Celdas
          rows:
            - id: bot.cctv.disposicion.1x1
              label: 1×1
              description: >-
                Una sola cámara, a pantalla del panel.
            - id: bot.cctv.disposicion.2x2
              label: 2×2
              description: >-
                Cuatro cámaras. Es la disposición con la que abre el panel.
            - id: bot.cctv.disposicion.3x3
              label: 3×3
              description: >-
                Nueve cámaras.
            - id: bot.cctv.disposicion.4x4
              label: 4×4
              description: >-
                Dieciséis cámaras.
            - id: bot.cctv.disposicion.2x3
              label: 2×3
              description: >-
                Seis cámaras, en dos columnas.
            - id: bot.cctv.disposicion.3x2
              label: 3×2
              description: >-
                Seis cámaras, en tres columnas.
            - id: bot.cctv.disposicion.1x3
              label: 1×3
              description: >-
                Tres cámaras, apiladas en una columna.
            - id: bot.cctv.disposicion.3x1
              label: 3×1
              description: >-
                Tres cámaras, en una fila.

      - id: bot.cctv.camaras
        type: procedure
        props:
          # Buscador citado de cctv-camera-drag-list.tsx:188. La celda indica
          # "Arrastrar cámara" y pasa a "Soltar aquí" con el arrastre encima
          # (mosaic-cell.tsx:50).
          lead: >-
            Para poner una cámara en el mosaico:
          steps:
            - id: bot.cctv.camaras.buscar
              title: Ubique la cámara en la lista
              text: >-
                Use el buscador de la lista, que admite el alias, el
                identificador o el nombre de la cámara.
              layout: beside

            - id: bot.cctv.camaras.arrastrar
              title: Arrástrela hasta la celda
              text: >-
                Las celdas vacías indican **Arrastrar cámara**, y la celda bajo
                el cursor pasa a indicar **Soltar aquí**.
              layout: beside

            - id: bot.cctv.camaras.soltar
              title: Suéltela
              text: >-
                La celda queda con esa cámara y su transmisión comienza. Repita
                para las demás celdas de la disposición.
              layout: beside

      - id: bot.cctv.ptz.titulo
        type: detail-header
        props:
          text: Control de cámaras móviles

      - id: bot.cctv.ptz.texto
        type: prose
        props:
          # El pad de control usa el modo `hold` por omisión
          # (cctv-ptz-control-bar.tsx:36; el mosaico no lo sobreescribe,
          # cctv-mosaic.tsx:295-302), y en ese modo el comando arranca al
          # presionar y se detiene al soltar o al salir del control
          # (cctv-ptz-core.tsx:80-84).
          text: >-
            Las cámaras móviles se orientan desde el propio mosaico. El control
            actúa mientras se mantiene presionado y se detiene al soltarlo, de
            modo que el movimiento se dosifica con el pulso.

      - id: bot.cctv.ptz.controles
        type: icon-table
        props:
          # Rótulos citados de cctv-ptz-control-bar.tsx:50, :60, :70, :81, :91,
          # :105, :116, :126, :136, :152 y :162.
          labelHeader: Control
          descriptionHeader: Qué hace
          rows:
            - id: bot.cctv.ptz.tilt-arriba
              label: Tilt arriba
              description: >-
                Levanta la cámara.
            - id: bot.cctv.ptz.tilt-abajo
              label: Tilt abajo
              description: >-
                Baja la cámara.
            - id: bot.cctv.ptz.pan-izquierda
              label: Pan izquierda
              description: >-
                Gira la cámara hacia la izquierda.
            - id: bot.cctv.ptz.pan-derecha
              label: Pan derecha
              description: >-
                Gira la cámara hacia la derecha.
            - id: bot.cctv.ptz.diagonales
              label: Arriba izquierda, arriba derecha, abajo izquierda y abajo derecha
              description: >-
                Combinan el giro y la inclinación en un solo movimiento
                diagonal.
            - id: bot.cctv.ptz.zoom-mas
              label: Acercar (Zoom +)
              description: >-
                Acerca la imagen.
            - id: bot.cctv.ptz.zoom-menos
              label: Alejar (Zoom -)
              description: >-
                Aleja la imagen.
            # `onHome` va al PRIMER preset guardado de esa cámara, y llega
            # `undefined` cuando no hay ninguno (cctv-mosaic.tsx:298-301): con la
            # lista vacía el control no tiene a dónde ir.
            - id: bot.cctv.ptz.home
              label: Preset home
              description: >-
                Lleva la cámara a la primera posición que tenga guardada. Sin
                posiciones guardadas, el control no está disponible.

      - id: bot.cctv.presets
        type: procedure
        props:
          # Controles citados de cctv-presets.tsx:46 (nombre), :53 (guardar),
          # :109 (ir) y :125 (eliminar).
          lead: >-
            Para guardar una posición de cámara y volver a ella:
          steps:
            - id: bot.cctv.presets.orientar
              title: Oriente la cámara
              text: >-
                Use los controles de giro, inclinación y acercamiento hasta
                encuadrar lo que necesita vigilar.
              layout: beside

            - id: bot.cctv.presets.nombrar
              title: Escriba el nombre
              text: >-
                Complete **Nombre del preset...** con un nombre que le permita
                reconocer el encuadre después.
              layout: beside

            - id: bot.cctv.presets.guardar
              title: Haga clic en Guardar posición actual
              text: >-
                La posición queda listada entre las guardadas de esa cámara.
              layout: beside

            - id: bot.cctv.presets.volver
              title: Vuelva a la posición cuando la necesite
              text: >-
                Use **Ir a preset** en la posición guardada: la cámara se orienta
                sola. **Eliminar preset** la quita de la lista.
              layout: beside

      - id: bot.cctv.estados
        type: term-list
        props:
          entries:
            # Rótulos citados de cctv-camera-stream-pane.tsx:169; el control de
            # reintento, de :109.
            - id: bot.cctv.estado.sin-senal
              term: SIN SEÑAL
              definition: >-
                La cámara está comunicada pero no está entregando imagen. Use
                **Reintentar conexión** para volver a pedirla.

            - id: bot.cctv.estado.fuera
              term: FUERA DE COMUNICACIONES
              definition: >-
                La cámara no responde. No es un problema del encuadre ni del
                mosaico: informe al administrador.
