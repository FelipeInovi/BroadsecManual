            - id: bot.prt.columna.observaciones
              label: OBSERVACIONES
              description: >-
                Anotaciones sobre la programación.

      - id: bot.prt.programacion.controles
        type: field-list
        props:
          items:
            # Rótulos citados de prt-list-content.tsx:159 (buscador), :198 y
