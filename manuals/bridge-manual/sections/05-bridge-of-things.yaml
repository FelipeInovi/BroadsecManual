              layout: beside

            - id: bot.prt.control.limpiar
              label: Limpiar
              text: >-
                Descarta la búsqueda y los filtros aplicados y devuelve la
                programación completa.
              layout: beside

      - id: bot.prt.recursos.titulo
        type: detail-header
        props:
          text: Los recursos

      - id: bot.prt.recursos.columnas
        type: data-table
        props:
          # Encabezados citados de resources/resources-columns.tsx:41, :85,
          # :109, :125, :137, :157, :176, :194 y :213. El buscador de la ficha
          # se cita de resources/resources-table.tsx:140.
          labelHeader: Columna
          descriptionHeader: Contenido
          rows:
            - id: bot.prt.recurso.recurso
              label: Recurso
              description: >-
                Identificación del recurso.
            - id: bot.prt.recurso.agente
              label: Agente
              description: >-
                Agente a cargo.
            - id: bot.prt.recurso.seccion
              label: Sección
              description: >-
                Sección a la que pertenece.
            - id: bot.prt.recurso.punto
              label: Pto. Ctrl
              description: >-
                Punto de control en el que está ubicado.
            - id: bot.prt.recurso.turno
              label: Turno
              description: >-
                Turno en el que está trabajando.
            - id: bot.prt.recurso.zona
              label: Zona
              description: >-
                Zona asignada.
            - id: bot.prt.recurso.observaciones
              label: Observ.
              description: >-
                Anotaciones sobre el recurso.
            - id: bot.prt.recurso.pj
              label: PJ
              description: >-
                Indica si el recurso corresponde a Policía Judicial.
            - id: bot.prt.recurso.despacho
              label: Despacho
              description: >-
                Estado de despacho del recurso, y el control para asignarlo o
                para abrir el caso que ya tiene.

      - id: bot.prt.recursos.buscar
        type: field-list
        props:
          items:
            # Rótulo citado de resources/resources-table.tsx:140. La paginación
            # de la ficha se cita de resources/resources-pagination.tsx:36, :60
            # y :73.
            - id: bot.prt.recursos.buscar.campo
              label: Buscar recurso, agente, zona...
              text: >-
                Acota la lista de recursos. Al pie, **Filas** elige cuántos
                recursos se muestran por página, y los controles de **Página
                anterior** y **Página siguiente** recorren el resto.
              layout: beside

      - id: bot.prt.recursos.asignar
        type: procedure
        props:
          # Control citado de resources/resources-columns.tsx:246 en la columna
          # de despacho; el cuadro, de resources/assign-resource-modal.tsx:99,
          # con su buscador en :123 y su confirmación en :187.
          lead: >-
            Para despachar un recurso a un caso:
          steps:
            - id: bot.prt.recursos.asignar.ubicar
              title: Ubique el recurso disponible
              text: >-
                Use el buscador de la ficha y confirme en la columna de despacho
                que el recurso no está asignado.
              layout: beside

            - id: bot.prt.recursos.asignar.abrir
              title: Haga clic en ASIGNAR
              text: >-
                Se abre el cuadro **Asignar recurso**.
              layout: beside

            - id: bot.prt.recursos.asignar.caso
              title: Elija el caso
              text: >-
                Use **Buscar caso por teléfono, dirección...** y seleccione el
                caso al que va a despachar el recurso.
              layout: beside

            - id: bot.prt.recursos.asignar.confirmar
              title: Haga clic en Confirmar asignación
              text: >-
                El recurso queda despachado a ese caso y su columna de despacho
                lo refleja. Mientras se registra, el control indica
                **Asignando…**.
              layout: beside

      - id: bot.prt.recursos.estados
        type: term-list
        props:
          entries:
            # Estados citados de resources/resources-columns.tsx:47-49 y :218.
            # Las acciones del cuadro **Caso asignado**
            # (resources/assigned-case-modal.tsx:75) se citan de :115
            # ("Desasignar"), :122 ("En sitio") y :136 ("Finalizar atención"), y
            # dependen del estado en que esté el recurso (:111 y :130).
            - id: bot.prt.recursos.estado.despachado
              term: Despachado
              definition: >-
                El recurso fue asignado a un caso y va en camino. Al abrir el
                caso desde su fila, el cuadro **Caso asignado** ofrece
                **Desasignar**, que lo libera, y **En sitio**, para registrar que
                llegó.

            - id: bot.prt.recursos.estado.en-sitio
              term: En sitio
              definition: >-
                El recurso llegó al lugar del caso. El cuadro **Caso asignado**
                ofrece entonces **Finalizar atención**, que lo devuelve a
                disponible.
