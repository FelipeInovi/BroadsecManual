# Llamada — written against the Bridge360 source (`bridge`, branch `develop`,
# 465f5eb9), cited by file and line.
#
# There is no module map for this product yet (no extractor exists for its
# shape), so every claim here carries its own provenance comment instead of
# tracing to `knowledge/`. Every quoted UI label is a QUOTATION, cited in the
# `labels` list below and checked by `broadsec-manual labels bridge-manual`.
# Since the product gained an i18n catalogue, a quotation is cited from the
# Spanish catalogue (`src/i18n/locales/es/*.json`) when the product keys it,
# and from the component when the product hardcodes the literal. The catalogue
# spells some strings without accents ("Transcripcion", "Camaras", "Teclado
# numerico", "Reenviar enlace a otro numero"): a quotation is copied as the
# catalogue writes it, while the manual's own prose is written correctly.
#
# This module was rewritten in full on 2026-09-29, with the owner's
# authorisation, from the previous version that was written against `58e2cc4d`.
# The unmerged `feat/dashboard/role-based-views` branch is NOT what this section
# documents.
#
# ORGANISATION. The view is one rail view made of dock panels around the map, and
# the module follows how an operator meets it: the view and its panels; the call
# controls and the guided flow that sit on the map window; then each panel in
# turn (transcription and translation, video, chat), what sits on the map itself
# (tools, location bar), the response forces with the route cards, the cameras,
# the case book, Flow AI and the case log.
#
# WRAP-UP IS NOT HERE. Ending a call always goes to Home: every branch of
# `onCallEnded` ends in `setActiveView("home")` (pages/dashboard.tsx:198-227),
# and Post-Llamada is documented in `01-home.yaml`. The call view still carries a
# wrap-up branch (the bar at views/call-view.tsx:1066-1088 with "Enviar a la
# agencia", the `incident-info` panel, `WrapUpPanelScrim`), but nothing reaches
# it: the wrap-up store is opened at one place only, `onCallEnded`
# (pages/dashboard.tsx:222-223), which then calls `setActiveView("home")`
# (:226). It is not documented, and the `incident-info` toggle is
# `dockable: false` (views/call-view.tsx:204-210), so it is never in the panel
# bar either. The section points at Post-Llamada by the TITLE of the section,
# "la sección **Home**": `{{ref:…}}` is not supported by the pipeline (ESTADO.md).
#
# PERMISSIONS AND AGENCY TYPE. Nothing in this view is conditioned on the manual's
# OWN axis (`permission`, from `canViewAllAgencies`): that predicate is consumed
# only in sitemap-view.tsx:36-37, so there is no `when` in this file. That is
# true ONLY of the manual's axis. The view DOES read `agencyType`, which is not an
# axis of this manual: `layoutRules = HOME_LAYOUT_RULES[agencyType ?? "OTHER"]`
# (views/call-view.tsx:591) drops the `cameras` and `right-2` (Fuerzas de
# Respuesta) entries from the panel manifest (:599-602) and keeps them closed
# (:780-783). The rules are views/home-right-slot.ts:67-116: RECEPTION shows both
# (:72-73), DISPATCH shows the forces only (:84-85), SUPERVISOR and OTHER neither
# (:98-99, :108-109). `agencyType` comes from the agent context
# (pages/dashboard.tsx:322, passed at :1002). The manual is scoped to RECEPTION
# (ESTADO.md, Decided), so for its reader both panels exist and this file carries
# no `when`; Home states that scope in its `home.alcance`. The code comment at
# views/call-view.tsx:588-590 ("Recepción only verifies a case, it never
# dispatches forces or watches CCTV") is stale against those flags and must not
# be believed over `home-right-slot.ts:72-73`.
#
# What ALSO varies the view is the state of the call — whether the link was
# sent, whether the incident has a location, whether a unit was dispatched.
# Those are runtime states, not build axes: they are documented as states, in
# prose.
#
# NOT DOCUMENTED, and not a gap: the Información del Incidente panel and the
# wrap-up bar (above); `SupportAgenciesPanel`
# (components/panels/flow/support-agencies-panel.tsx), which no view mounts; the
# `VITE_FLOW_USE_MOCK` fixture path; the location-bar "minimal" variant that only
# appears in the call banner when a bottom panel is expanded upward
# (pages/dashboard.tsx:689-693, :724-745) — this view passes no `onExpandUpward`
# to the case book or Flow AI (views/call-view-panels/case-book-panel-content.tsx:9-25,
# flow-ai-panel-content.tsx:5-19), so nothing here fills `expandedUpwardIds`; the
# marker-grouping switch, which the map window draws only while no call is
# active (views/call-view-panels/map-panel-content.tsx:119-123); and the
# "Despachado" text of a dispatched row, which a live call replaces with the
# status dot (components/panels/available-agent-row.tsx:100, :433-436).
#
# QUOTATIONS LEFT OUT ON PURPOSE. Some catalogue strings are in the familiar
# register the client PDF cannot carry, so the section describes the control
# without quoting them: `translation.writeInYourLanguage` (calls.json:522,
# voseo), `agentLink.invalidNumber` (agents.json:136, voseo),
# `callAi.refreshCooldown` (calls.json:338) and `chat.placeholder`
# (calls.json:379), both "tú".
#
# Paths in comments are relative to `src/modules/dashboard/presentation/ui/` in
# the `bridge` source repository, except where another module is named in full.

id: llamada
title: Llamada
subtitle: Atención de la llamada en curso, sobre el mapa del incidente

sourceBase: src/modules/dashboard/presentation/ui/

# The screens of Llamada that the PRODUCT has not finished. Each is documented
# around and never named in the content, and each is exported by
# `broadsec-manual awaiting bridge-manual` to `awaiting-product.json`.
pending:
  - id: llamada.libro-despacho-tarjetas-demo
    covers: [llamada.libro.pasos]
    missing: >-
      The read-only cards at the top of the "Despacho del incidente" step of the
      case book (the block above the manual-assignment repeater). The repeater
      ("Agregar asignación de recursos") and the dispatch notes are documented;
      the cards are not mentioned.
    because: >-
      `Step2Body` renders `getAssignmentResourcesDemo()` as six cards
      (`components/panels/incident-book/steps/step2-body.tsx:37-48`, import at
      `:8`), whose values are literals — "Policía Metropolitana", "PAT-045",
      "Patrulla", "14/03/2026  08:32", "14/03/2026  08:41" and "14/03/2026
      09:15" (`components/panels/incident-book/general.demo.ts:7-15`, "datos demo
      / semilla … no se persisten", `:1-4`). The mapper says they are not sent:
      `general.mapper.ts:16` ("`resources` (tarjetas demo read-only) NO se
      envían").
    settles: >-
      The product reading the case's real dispatched resources into those cards
      (or removing them), or the owner deciding how a manual describes a block
      that is on screen and fabricated.

  - id: llamada.libro-recursos-demo
    covers: [llamada.libro.pasos]
    missing: >-
      The "Medios y Recursos" block of the "Información extendida" step of the
      case book, with its "Grabación / Audio" and "Cámaras CCTV" groups and the
      remove button of each item. The involved parties, the injured and deceased
      counters and the securing notes of that step are documented; the block is
      not mentioned.
    because: >-
      The form is seeded with `resources: getResourcesDemo()`
      (`components/panels/incident-book/general.types.ts:97`), eight literal
      entries — "Grabación llamada", "Audio radio", "Grabación backup", "Cámara
      corporal", "Dashcam unidad", "CCTV Escena G14", "CCTV Entrada norte" and
      "CCTV Vía principal" (`general.demo.ts:17-35`). `Step3Body` draws them
      (`steps/step3-body.tsx:59-67`, `:182-226`) and the mapper does not send
      them (`general.mapper.ts:16`).
    settles: >-
      The product attaching the case's real recording and camera resources (or
      removing the block), or the owner deciding how a manual describes a block
      that is on screen and fabricated.

  - id: llamada.flow-identidad-sin-guardar
    covers: [llamada.flow.datos]
    missing: >-
      That the caller-identity block of Flow AI can be edited: the yes / no
      choice, the editable rows and the "Agregar dato" control. The block is
      documented as the identification data the analysis detected; nothing is
      said about correcting it.
    because: >-
      `handleIdentityChange` only writes a local draft: its own comment reads
      "PENDIENTE BACKEND: `POST /callAI/:id/flow` solo acepta typeEmergency,
      dynamicProtocol e is_manual_order … la corrección del operador no se
      persiste" (`components/panels/call-ai-content.tsx:957-962`). The editing
      controls are `CallerIdentificationSection`
      (`components/panels/call-ai-content.tsx:416-548`).
    settles: >-
      The backend accepting the structured identity in the flow endpoint and the
      panel saving it, or the owner deciding how a manual describes an edit that
      is not kept.

  - id: llamada.bitacora-comentarios-sin-guardar
    covers: [llamada.bitacora.controles]
    missing: >-
      The comment composer at the foot of the case log ("Agregar comentario…",
      "Enviar comentario", Enter to send). The timeline, its events and the Log
      tab are documented; writing a comment is not mentioned.
    because: >-
      `addComment` only appends to a client-side zustand store
      (`components/panels/incident-events/incident-events.store.ts:65-85`,
      emptied by `resetEvents` at `:87`). The log drawer's composer calls it
      directly (`components/panels/logs-content.tsx:42`, `:128-130`). Nothing
      sends the comment to the backend, so it is gone once the store resets.
    settles: >-
      The product persisting case comments to the backend, or the owner deciding
      how a manual describes a comment that is not kept.

