children:
  - id: home.proposito
    type: prose
    props:
      text: >-
        La vista **Home** es el puesto de trabajo del operador de recepción.
        Sobre el mapa de la operación se acomodan paneles que cambian según el
        estado del trabajo: mientras no hay un caso abierto muestran los
        reportes pendientes de revisar, el teclado y el resumen del turno; al
        abrir un caso se reacomodan para atenderlo, con la información de la
        llamada, el libro del caso, las cámaras cercanas y las fuerzas en
        campo, todo en la misma pantalla.

  - id: home.alcance
    type: prose
    props:
      # HOME_LAYOUT_RULES (views/home-right-slot.ts:67-116) define un juego de
      # paneles por tipo de agencia; se documenta RECEPTION (:68-79). La
      # aclaración es necesaria: sin ella, el lector de una agencia de otro tipo
      # buscaría paneles que su plataforma no monta. Lo que una persona ve de la
      # cola depende además del permiso de ver todos los casos
      # (pages/dashboard.tsx:914-917 y calls-review-panel.tsx:178-182).
      text: >-
        La distribución de paneles descrita en esta sección corresponde a una
        agencia de **Recepción**. La plataforma acomoda Home según el tipo de
        agencia asignada a su usuario, de modo que una agencia de otro tipo
        presenta un juego de paneles distinto. Lo que ve dentro de esos paneles
        depende además de los permisos de su perfil: un operador de recepción ve
        los casos que le corresponden, y un supervisor, con permiso para ver
        todos los casos, ve también los de los demás operadores, tanto en la
        lista como en el mapa.

  - id: home.acceso
    type: prose
    props:
      # components/layout/icon-sidebar.tsx:61-65 — nav item id `home`, label
      # `navigation.home` = "Home" (common.json:65); pages/dashboard.tsx:91 lo
      # deja como vista inicial y :198-233 (`onCallEnded`) devuelve al operador
      # a Home al terminar una llamada.
      text: >-
        Diríjase a **Home** en la barra lateral de iconos. Es la vista con la
        que abre la plataforma, y a ella lo devuelve la plataforma cuando
        termina una llamada. Ocupa la pantalla completa: el mapa de fondo y,
        encima, los paneles.

  - id: home.general.fig
    type: figure
    props:
      caption: "Vista Home sin caso abierto: el mapa de fondo, con el teclado y los reportes pendientes a la izquierda y el resumen del turno a la derecha."
      widthPercent: 90

  - id: home.estados
    type: data-table
    props:
      # The two states are the manual's own organising idea, not a product
      # label. What decides the state is `selectedCase`
      # (views/home-view.tsx:374): the panels that follow it are the effects at
      # :1272-1304 (Fuerzas en Campo), :1319-1334 (CCTV), :1336-1344 (libro del
      # caso) and :1384-1393 (teclado).
      labelHeader: Estado de trabajo
      descriptionHeader: Qué muestra Home
      rows:
        - id: home.estado.sin-caso
          label: Sin un caso abierto
          description: >-
            Es el estado con el que abre Home y al que vuelve al salir de un
            caso. Muestra los reportes pendientes, el teclado y el resumen del
            turno.
        - id: home.estado.con-caso
          label: Con un caso abierto
          description: >-
            Se entra al abrir un reporte de la lista o, por sí solo, cuando
            termina una llamada. Muestra el reporte con la información de la
            llamada, el libro del caso, las cámaras cercanas y las fuerzas en
            campo.

  # --- Sin un caso abierto ---------------------------------------------------
  - id: home.sin-caso
    title: Sin un caso abierto
    children:
      - id: home.sin-caso.proposito
        type: prose
        props:
          # rightSlot = "my-shift" while no case is open
          # (views/home-right-slot.ts:69 and :127-138); the keypad is opened
          # whenever there is no case (views/home-view.tsx:1384-1393).
          text: >-
            Es el estado de espera y de revisión. La columna izquierda lleva el
            teclado y, debajo, la lista de reportes pendientes; la derecha lleva
            el resumen de su turno. Desde aquí se abre el caso que se va a
            atender.

      # --- Reportes pendientes ---------------------------------------------
      - id: home.revision
        title: Reportes pendientes
        children:
          - id: home.revision.proposito
            type: prose
            props:
              # Recepción's panel: CallsReviewReceptionCasePanel
              # (components/panels/dashboard/calls-review/calls-review-panel.tsx:105-498).
              # The default narrowing to "pendiente" is at :333-340.
              text: >-
                Lista los casos que le corresponden, uno por tarjeta, para que
                los revise y los valide. Muestra por defecto solo los
                **pendientes**: los casos cuya llamada ya terminó y que todavía
                no se validaron. Es el punto de partida del trabajo: de esta
                lista se abre el caso que se va a atender.

          - id: home.revision.ubicacion
            type: prose
            props:
              # HOME_DOCK_MANIFEST_KEYS `calls-review` (views/home-view.tsx:247-252,
              # without `initiallyInactive`, so it opens with the view) and its
              # seed (:97-116: below the keypad, left column). The title without
              # a case is `homeView.incidentReviewDetail` (calls.json:417, chosen
              # at home-view.tsx:1076-1083); the Toolkit lists the same panel as
              # `homeView.incidentReview` (calls.json:414, manifest label at
              # home-view.tsx:249). Both are visible to the operator, so both are
              # named — the shape a rename in progress leaves behind.
              text: >-
                Ocupa la columna izquierda, debajo del teclado, y está abierta
                desde que carga la vista. Su encabezado dice **Reportes
                pendientes**; en la barra de paneles el mismo panel figura como
                **Revisión de Incidentes**. No requiere ninguna acción previa.

          - id: home.revision.lista.fig
            type: figure
            props:
              caption: "Panel de reportes pendientes con la barra de búsqueda y las tarjetas de los casos."
              widthPercent: 90

          - id: home.revision.tarjeta.titulo
            type: detail-header
            props:
              text: Qué muestra cada tarjeta

          - id: home.revision.tarjeta
            type: data-table
            props:
              # components/panels/dashboard/calls-review/calls-review-card.tsx:
              # type badge :427-434 (with "+N" for extra types,
              # emergency-type-badge.tsx:425-429), relative time :453-459,
              # case id with copy :468-485, address :487-545 ("Sin ubicacion" at
              # :301 from `review.noLocation`, calls.json:124), phone :546-549,
              # duration :550-553.
              labelHeader: Dato
              descriptionHeader: Qué indica
              rows:
                - id: home.revision.tarjeta.tipo
                  label: Tipo de incidente
                  description: >-
                    Clasificación del incidente, con su icono, en la parte
                    superior de la tarjeta. Si el caso tiene varios tipos, se
                    muestra el primero seguido de la cantidad de los demás
                    (por ejemplo, +2).
                - id: home.revision.tarjeta.caso
                  label: Número del caso
                  description: >-
                    El identificador del reporte, con un botón para copiarlo.
                - id: home.revision.tarjeta.antiguedad
                  label: Antigüedad
                  description: >-
                    Cuánto tiempo pasó desde que ingresó la llamada. Se muestra
                    mientras la tarjeta está en la lista; al abrir el caso se
                    reemplaza por la fecha y la hora exactas.
                - id: home.revision.tarjeta.direccion
                  label: Dirección
                  description: >-
                    Ubicación del incidente, con un botón para copiarla. Cuando
                    el caso no tiene ubicación, la tarjeta indica **Sin
                    ubicacion**.
                - id: home.revision.tarjeta.telefono
                  label: Teléfono
                  description: >-
                    Número desde el que se originó la llamada.
                - id: home.revision.tarjeta.duracion
                  label: Duración
                  description: >-
                    Cuánto duró la llamada.

          - id: home.revision.estados.titulo
            type: detail-header
            props:
              text: Estados de un caso

          - id: home.revision.estados
            type: term-list
            props:
              entries:
                # Recepción's ladder is derived from the real case
                # (calls-review.types.ts:268-282, `resolveReceptionStatusKey`):
                # DRAFT is pendiente; ROUTED is abierto con despacho when the
                # case has at least one agency assignment and sin despacho when
                # it has none; CLOSED and CANCELLED are both cerrado. Labels:
                # `receptionStatus` (calls.json:178-180) and
                # `reviewStatus.closed` (calls.json:173). The list is the Estado
                # filter's (calls-review.types.ts:265-266) and is seen there,
                # not as a badge on the card.
                - id: home.revision.estado.pendiente
                  term: Pendiente
                  definition: >-
                    La llamada terminó y el caso todavía no se validó. Es el
                    único estado que la lista muestra mientras no cambie el
                    filtro.
                - id: home.revision.estado.abierto-con-despacho
                  term: Abierto con despacho
                  definition: >-
                    El caso se validó y tiene una o más agencias asignadas.
                - id: home.revision.estado.abierto-sin-despacho
                  term: Abierto sin despacho
                  definition: >-
                    El caso se validó y no tiene ninguna agencia asignada.
                - id: home.revision.estado.cerrado
                  term: Cerrado
                  definition: >-
                    El caso terminó o se canceló.

          - id: home.revision.controles
            type: field-list
            props:
              items:
                # components/panels/dashboard/calls-review/calls-review-search.tsx:
                # search :250-257 (filters mientras escribe; the panel also sends
                # the term to the server, debounced 400 ms, calls-review-panel.tsx:120
                # and :183-188; the local match covers id, type, phone, address
                # and city, :312-321); filters :259-343; history :365-385.
                - id: home.revision.control.busqueda
                  label: Buscar por tipo, direccion...
                  text: >-
                    Reduce la lista a los casos cuyo identificador, tipo,
                    teléfono, dirección o ciudad contienen lo que escriba. Filtra
                    mientras escribe, sin necesidad de confirmar.
                  layout: beside

                # Filters :259-343: two lists (Estado :307-323, Tipo de incidente
                # :325-341) with a count per option; the first pick isolates that
                # option (`isolateOrToggleFilter`, :34-45); "Ver todos" resets one
                # list (:121-129) — in Estado that shows every status
                # (calls-review-panel.tsx:333-340) — and "Limpiar" (:297-303)
                # resets both and returns to the pending-only default
                # (calls-review-panel.tsx:135-140). The badge counts the lists
                # that are narrowing (:276-280).
                - id: home.revision.control.filtros
                  label: Filtros
                  text: >-
                    Abre las dos listas por las que puede acotar la lista,
                    **Estado** y **Tipo de incidente**. Cada opción indica
                    cuántos casos quedarían si la eligiera. La primera opción
                    que elija deja solo esa; las siguientes se suman o se
                    quitan. **Ver todos** deja una lista sin acotar (en
                    **Estado**, muestra los casos de todos los estados) y
                    **Limpiar** descarta ambas y vuelve a la lista de
                    pendientes. Un distintivo sobre el botón indica cuántas de
                    las dos listas están acotando.
                  layout: beside

                # History :365-385 toggles `isHistoryView`
                # (calls-review-panel.tsx:141-152): it clears the Estado filter
                # (every status visible) and the same button then reads "Volver"
                # (`review.back`, calls.json:160).
                - id: home.revision.control.historial
                  label: Historial de incidentes
                  text: >-
                    Muestra los casos de todos los estados, incluidos los que ya
                    validó, sin tener que vaciar antes los pendientes. Mientras
                    está activo, el mismo botón pasa a llamarse **Volver** y
                    devuelve la lista a los pendientes.
                  layout: beside

          - id: home.revision.contadores
            type: prose
            props:
              # "N casos" is `review.caseCount` (calls.json:118-119) fed with the
              # SERVER total (`total` from `useCases` with `includeHistory`,
              # calls-review-panel.tsx:183, :439), not with the cards on screen;
              # drawn only while the list has cards and no case is open (:437-441); the selector is `review.maxRecords`
              # "Mostrar" (calls.json:127) with 25/50/100/200 (:456) and 50 as
              # the initial value (:121).
              text: >-
                Bajo la barra de herramientas, la lista indica el total de casos
                que devuelve la consulta con la búsqueda actual, historial
                incluido (por ejemplo, **3 casos**); no es la cantidad de
                tarjetas que ve, que depende además de los filtros. El selector **Mostrar** permite
                elegir cuántos registros se cargan: 25, 50, 100 o 200. El valor
                inicial es 50.

          - id: home.revision.avisos
            type: term-list
            props:
              entries:
                # components/panels/dashboard/calls-review/calls-review-list.tsx:
                # error :66-72, empty list outside history :104-128 (it shows for ANY
                # empty filtered list, also after a search or filter with no
                # match), empty history :75-101. The words under each title are the catalogue's
                # calls.json:163, :123, :165 and :166.
                - id: home.revision.aviso.error
                  term: No se pudieron cargar los casos
                  definition: >-
                    No fue posible recuperar la lista. Reintente más tarde y, si
                    el aviso persiste, informe al administrador.
                - id: home.revision.aviso.al-dia
                  term: Vas muy bien, estás al día
                  definition: >-
                    La lista no tiene ninguna tarjeta que mostrar fuera del
                    historial. Puede significar que no quedan casos pendientes o
                    que la búsqueda o los filtros activos no dejan ninguno. El
                    aviso lo acompaña con **No tienes incidentes pendientes por
                    revisar.** y con el botón **Ver historial de incidentes**,
                    que muestra los casos de todos los estados.
                - id: home.revision.aviso.sin-historial
                  term: No hay historial de incidentes para revisar
                  definition: >-
                    El historial está vacío. El aviso indica que **Todavía no
                    hay incidentes registrados en este turno.** y ofrece
                    **Volver a incidentes pendientes**.

          - id: home.revision.aviso-nueva
            type: callout
            props:
              # `useCallsReviewNewCase` (hooks/use-calls-review-new-case.ts:11-32)
              # fires the sound and `toast.info(t("homeView.newCallPending"))`
              # (views/home-view.tsx:748-753); the text is calls.json:420.
              variant: info
              text: >-
                Cuando ingresa una llamada nueva, la plataforma emite un sonido
                de notificación y muestra el aviso **Nuevo registro de llamada
                pendiente por revisar** durante unos segundos.

          - id: home.revision.abrir
            type: procedure
            props:
              # The card is the control: `role="button"` with its handler
              # (calls-review-card.tsx:389-399). Selecting it runs
              # `handleSelectCase` (calls-review-panel.tsx:291-304): it turns on
              # the Mobile layer when the agency shows field forces
              # (:301, `showFieldForcesOnCase`), and `useFocusSelectedCase`
              # (hooks/use-focus-selected-case.ts:32-) centres the map on the
              # incident. While a case is open only its card is on screen
              # (calls-review-list.tsx:143-154).
              lead: >-
                Para abrir el caso de un reporte:
              steps:
                - id: home.revision.abrir.lista
                  title: Ubique el reporte en la lista
                  text: >-
                    Recorra las tarjetas o acote la lista con la búsqueda y los
                    filtros. Por defecto se muestran los casos pendientes; use
                    el historial para llegar a uno que ya validó.
                  layout: beside

                - id: home.revision.abrir.tarjeta
                  title: Haga clic en la tarjeta
                  text: >-
                    Home pasa al estado con un caso abierto: la lista deja a la
                    vista únicamente esa tarjeta, el mapa se centra en el
                    incidente cuando el caso trae ubicación y la capa
                    **Mobile** del mapa se activa para que se vean los agentes
                    de campo.
                  layout: beside

                - id: home.revision.abrir.comprobar
                  title: Verifique que abrió el caso correcto
                  text: >-
                    Confirme el tipo de incidente, la dirección y el teléfono en
                    la tarjeta que quedó a la vista antes de trabajar sobre el
                    caso.
                  layout: beside

      # --- Teclado ---------------------------------------------------------
      - id: home.teclado
        title: Teclado
        children:
          - id: home.teclado.proposito
            type: prose
            props:
              text: >-
                Permite marcar un número y llamar desde la plataforma sin salir
                de Home, y consultar las llamadas recientes, el directorio de
                agencias y los agentes en turno.

          - id: home.teclado.ubicacion
            type: prose
            props:
              # HOME_DOCK_MANIFEST_KEYS `keypad` (views/home-view.tsx:269-274,
              # open by default) and its seed (:117-135: above `calls-review`).
              # The effect at :1384-1393 opens it only while there is no case and
              # no post-call lock; RECEPTION shows it (home-right-slot.ts:76).
              # Title `dockPanels.keypad` (calls.json:754).
              text: >-
                Es un panel propio, titulado **Teclado**. Está abierto al cargar
                Home, en la parte superior de la columna izquierda, sobre
                **Reportes pendientes**. Se cierra por sí solo mientras hay un
                caso abierto —para llamar desde un caso use **Llamar**— y
                reaparece al volver a la lista. Si lo cierra, recupérelo desde
                la barra de paneles.

          - id: home.teclado.vista.fig
            type: figure
            props:
              caption: "Panel del teclado con sus fichas y el teclado numérico."
              widthPercent: 90

          - id: home.teclado.fichas
            type: data-table
            props:
              # components/panels/keypad-panel.tsx: TABS :53-71 (labels
              # `keypad.tabs`, calls.json:88-92). The Favoritos tab is NOT listed
              # and its control is not mentioned: it is declared in `pending`
              # (home.teclado-favoritos-simulados). Directorio and Agentes en
              # turno are listed for what they show; their inert buttons and rows
              # are declared in `pending` too.
              labelHeader: Ficha
              descriptionHeader: Qué contiene
              rows:
                - id: home.teclado.ficha.teclado
                  label: Teclado
                  description: >-
                    El campo del número, con el selector de país, y el teclado
                    de doce teclas. El botón **Llamar** inicia la llamada y solo
                    está disponible cuando su estado es **Disponible**.
                - id: home.teclado.ficha.recientes
                  label: Recientes
                  description: >-
                    Las llamadas recientes, filtradas por **Entrantes**,
                    **Salientes**, **En espera** y **Abandonadas**. Cada fila
                    ofrece un botón para llamar al número.
                - id: home.teclado.ficha.directorio
                  label: Directorio
                  description: >-
                    Las agencias registradas, con su tipo.
                - id: home.teclado.ficha.agentes
                  label: Agentes en turno
                  description: >-
                    Los agentes conectados de su agencia, con su estado y el
                    puesto que ocupan. Se actualiza en vivo.

          - id: home.teclado.recientes
            type: term-list
            props:
              entries:
                # RecientesView (keypad-panel.tsx:465-721): filters :88-118; each
                # row shows the caller's name or number, the queue and the
                # relative time (:689-714); "En espera" adds queued calls
                # ("Sonando"/"Sin atender", calls.json:106-107), calls held by an
                # agent (resume only for the operator's own, :607-637) and parked
                # calls (:642-676). Dialling needs the "Disponible" status
                # (:682).
                - id: home.teclado.reciente.entrantes
                  term: Entrantes
                  definition: >-
                    Las llamadas que recibió, con el nombre o el número de quien
                    llamó, la cola por la que entraron y cuánto tiempo pasó.
                - id: home.teclado.reciente.salientes
                  term: Salientes
                  definition: >-
                    Las llamadas que realizó.
                - id: home.teclado.reciente.espera
                  term: En espera
                  definition: >-
                    Las llamadas que aguardan respuesta: las que esperan en la
                    cola (**Sonando** o **Sin atender**), las que un agente puso
                    en espera y las aparcadas, con el tiempo que llevan así. Una
                    llamada suya en espera se puede retomar y una aparcada se
                    puede tomar.
                - id: home.teclado.reciente.abandonadas
                  term: Abandonadas
                  definition: >-
                    Las llamadas que se abandonaron antes de ser atendidas.

          - id: home.teclado.llamar
            type: procedure
            props:
              # TecladoView (keypad-panel.tsx:368-442): the call button is
              # disabled without a number or without the "Disponible" status
              # (:383) and its tooltip then reads `keypad.mustBeAvailableToCall`
              # (calls.json:96, shown at :407-420); the button's own title is
              # `keypad.callTooltip` (calls.json:95). An answered call sends the
              # operator to the Llamada view (pages/dashboard.tsx:189-192).
              lead: >-
                Para llamar a un número:
              steps:
                - id: home.teclado.llamar.numero
                  title: Escriba el número
                  text: >-
                    En la ficha **Teclado**, elija el país en el selector y
                    escriba el número en el campo, o márquelo con las teclas en
                    pantalla.
                  layout: beside

                - id: home.teclado.llamar.iniciar
                  title: Haga clic en Llamar
                  text: >-
                    Solo está disponible cuando su estado es **Disponible**; en
                    otro estado, el botón indica **Debes estar disponible para
                    llamar**. Cuando el destinatario contesta, la plataforma lo
                    lleva a la vista **Llamada**.
                  layout: beside

      # --- Mi turno --------------------------------------------------------
      - id: home.turno
        title: Mi turno
        children:
          - id: home.turno.proposito
            type: prose
            props:
              text: >-
                Resume su jornada: qué tan eficiente es su gestión, cuántas
                llamadas atendió y rechazó, cuántos casos validó y envió a las
                agencias, cuánto tiempo pasó en cada estado, y deja el
                historial de lo que hizo durante el turno.

          - id: home.turno.ubicacion
            type: prose
            props:
              # `noCaseRightSlot: "my-shift"` for RECEPTION
              # (views/home-right-slot.ts:69), rendered in the right column
              # (views/home-view.tsx:1554-1557). With a case open the column
              # belongs to CCTV and Fuerzas en Campo (:782-789, `rightSlot` is
              # null). Title `homeView.myShift` (calls.json:424); the toggle in
              # the panel bar is offered only without a case (:1017-1023).
              text: >-
                Ocupa la columna derecha mientras no hay un caso abierto. Su
                encabezado dice **Mi turno**. Al abrir un caso, la columna pasa
                a mostrar las cámaras y las fuerzas en campo, y Mi turno
                vuelve al regresar a la lista. También puede abrirlo y cerrarlo
                desde la barra de paneles.

          - id: home.turno.vista.fig
            type: figure
            props:
              caption: "Panel del turno con el indicador de eficiencia, los recuentos de la jornada, los gráficos y el historial."
              widthPercent: 90

          - id: home.turno.rendimiento
            type: prose
            props:
              # components/panels/my-performance-panel.tsx: the gauge is
              # validated / (answered + rejected), capped at 100 (:101-105),
              # parked at 0 with no calls (:107-109); its tooltip is
              # `performance.efficiencyTooltip` (calls.json:691, drawn at
              # :294-296). The messages rotate every 5 s (:21, :223-230) and are
              # only built from metrics that have a value (:119-207); the empty
              # state is `performance.emptyState` (calls.json:700).
              text: >-
                En la parte superior, un indicador semicircular muestra la
                **Eficiencia de gestión**: el porcentaje de casos que validó
                sobre las llamadas que atendió y rechazó. Permanece en 0 % hasta
                que haya llamadas. Debajo, un mensaje cambia cada cinco segundos
                con un dato de su turno, como su tiempo de gestión promedio, el
                tiempo promedio para contestar o cuántas gestiones incompletas
                tiene. Mientras no haya nada que medir, el panel lo indica.

          - id: home.turno.metricas
            type: data-table
            props:
              # components/panels/my-shift-panel.tsx: `shiftMetricStyles` :28-39
              # (labels `myShift.*`, calls.json:272-278) and values :97-102.
              # Atendidos and Rechazados come from the shift feed
              # (`useMyShift`); Validadas counts the cases this operator
              # validated today (:65-70); Enviadas a agencias counts, among those,
              # the ones typed as a real emergency — "No Emergencia" does not
              # count (:72-91).
              labelHeader: Recuento
              descriptionHeader: Qué cuenta
              rows:
                - id: home.turno.metrica.atendidos
                  label: Atendidos
                  description: >-
                    Llamadas que usted atendió en la jornada.
                - id: home.turno.metrica.rechazados
                  label: Rechazados
                  description: >-
                    Llamadas que usted rechazó.
                - id: home.turno.metrica.validadas
                  label: Validadas
                  description: >-
                    Casos que usted validó en la jornada.
                - id: home.turno.metrica.enviadas
                  label: Enviadas a agencias
                  description: >-
                    Casos validados en la jornada que se enviaron a una agencia.
                    No cuentan los tipificados como **No Emergencia**.

          - id: home.turno.graficos
            type: prose
            props:
              # my-shift-panel.tsx:147-157: MyShiftDonutChart (the four counts,
              # "Total" at the centre, common.json:485) and
              # MyShiftStatusDonutChart (time per status,
              # components/panels/my-shift-status-donut-chart.tsx:56-100) with its
              # legend; the empty message is `shifts.noActivityToday`
              # (common.json:458, drawn at :119).
              text: >-
                Bajo los recuentos, dos gráficos de anillo: el primero reparte
                los cuatro recuentos, con el total al centro; el segundo reparte
                el tiempo de la jornada entre los estados por los que pasó, con
                su leyenda debajo. Si todavía no hay actividad, indica **Sin
                actividad registrada hoy**.

          - id: home.turno.historial.titulo
            type: detail-header
            props:
              # `myShift.history` (calls.json:275), my-shift-panel.tsx:161-164.
              text: Historial de turno

          - id: home.turno.historial.texto
            type: prose
            props:
              # components/panels/use-shift-history-groups.ts:44-: groups by
              # category (Sesión, Llamadas, Cambio de estado), most recent first;
              # the last 10 calls and 8 status changes stay individual, older
              # ones settle into 2-hour ranges (:50-51, :73-90). The calls group
              # opens expanded (my-shift-panel.tsx:186). Empty state
              # `myShift.noActivity` (calls.json:276, drawn at :173-175).
              text: >-
                Debajo de los gráficos, lista lo que ocurrió durante su jornada
                en bloques que se abren y se cierran: la sesión, las llamadas y
                los cambios de estado, siempre de lo más reciente a lo más
                antiguo. Las diez llamadas y los ocho cambios de estado más
                recientes se muestran uno por uno; lo anterior se agrupa por
                franjas de dos horas. Cuando todavía no hay nada registrado,
                muestra **Sin actividad registrada hoy**.

  # --- Con un caso abierto ---------------------------------------------------
  - id: home.caso
    title: Con un caso abierto
    children:
      - id: home.caso.proposito
        type: prose
        props:
          text: >-
            Al abrir un caso, Home se reacomoda para atenderlo: reúne en una
            sola pantalla el reporte con la información de la llamada, el libro
            del caso, las cámaras cercanas al incidente, las fuerzas en campo y
            las acciones para validar el caso o dejarlo para más tarde.

      - id: home.caso.ubicacion
        type: prose
        props:
          # RECEPTION: `threeColumnCaseView`, `showFieldForcesOnCase` and
          # `showCctvOnCase` are all true (views/home-right-slot.ts:72-74), so
          # `fieldOpsReplacesCaseBook` holds (views/home-view.tsx:776-779) and the
          # right column stops being a slot with an occupant
          # (`rightSlot = null`, :782-789): it carries CCTV above Fuerzas en Campo
          # (seeds :163-183 and :1111-1132) and the case book goes under the map
          # (:1133-1146, `pinnedWidth: CASE_BOOK_WIDTH`, :234). Keypad and Mi
          # turno step aside (:1384-1393, and `myShift` requires no case,
          # :1017-1023). The map shows only that case
          # (pages/dashboard.tsx:904-909, `onlySelectedCase`). The Log drawer
          # mounts at :1739-1747. CCTV opens only with a camera in range
          # (:1319-1334, radius 2000 m at calls-review-cctv.tsx:8).
          text: >-
            Se abre un caso de dos maneras: haciendo clic en su tarjeta en
            **Reportes pendientes**, o por sí solo cuando termina una llamada
            (vea **Post-Llamada** más abajo). Los paneles pasan entonces a esta
            disposición: a la izquierda, **Revisión de reporte**, con la
            información de la llamada debajo de la tarjeta; a la derecha,
            **CCTV** sobre **Fuerzas en Campo**; bajo el mapa, **Libro del
            Caso**; y en el borde derecho de la pantalla, la pestaña **Log**. El
            mapa muestra únicamente ese caso. El teclado y Mi turno se retiran
            hasta que vuelva a la lista. **CCTV** se abre solo cuando hay al
            menos una cámara a menos de 2 km del incidente.

      - id: home.caso.vista.fig
        type: figure
        props:
          caption: "Vista Home con un caso abierto: el reporte y la información de la llamada a la izquierda, las cámaras y las fuerzas en campo a la derecha, y el libro del caso bajo el mapa."
          widthPercent: 90

      # --- El reporte del caso ---------------------------------------------
      - id: home.caso.reporte
        title: Reporte del caso
        children:
          - id: home.caso.reporte.proposito
            type: prose
            props:
              text: >-
                Reúne, en una sola tarjeta, lo que la plataforma sabe del
                reporte y lo que usted debe confirmar antes de validarlo: el
                tipo de incidente y la ubicación.

          - id: home.caso.reporte.ubicacion
            type: prose
            props:
              # Same panel as the list, with `selectedCase` set: its dock title is
              # `homeView.incidentReviewSingle` (calls.json:423, views/home-view.tsx:1076-1079)
              # and the toolbar is replaced (calls-review-panel.tsx:412-435 draw
              # it only with no case). The back arrow lives in the dock tab
              # (:871-896). The call information goes under the card inside the
              # same scroll area (calls-review-panel.tsx:464-487) and the action
              # bar is a footer that never scrolls (:488-494).
              text: >-
                Es el panel **Revisión de reporte**, en la columna izquierda: la
                lista deja a la vista únicamente el caso abierto. La
                información de la llamada queda debajo de la tarjeta, en el
                mismo panel, y la barra de acciones queda fija al pie.

          - id: home.caso.reporte.fig
            type: figure
            props:
              caption: "Panel Revisión de reporte con la tarjeta del caso abierto, sus controles de edición y la barra de acciones."
              widthPercent: 90

          - id: home.caso.reporte.datos
            type: prose
            props:
              # calls-review-card.tsx:554-561: the exact timestamp row is drawn
              # only for the selected card; the relative time is hidden then
              # (:453). Edit controls: :436-445 (type) and :516-535 (address).
              text: >-
                Además de lo que muestra en la lista, la tarjeta abierta indica
                la fecha y la hora exactas de la llamada, en lugar del tiempo
                transcurrido, y ofrece los controles para corregir el tipo y la
                ubicación.

          - id: home.caso.reporte.revision
            type: callout
            props:
              # `pulseReview = isSelected && isReception && !isArchived`
              # (calls-review-card.tsx:339-341): the type and the address pulse
              # until each one is marked as reviewed (:188-189, :446-451,
              # :536-541). Saving by hand marks them (`onVerified`, :443; `onDone`,
              # :495-497) and so does Validar (`onConfirmed`, :570-575).
              variant: info
              text: >-
                Mientras el caso no está validado, el tipo y la dirección
                parpadean con suavidad: son lo que debe confirmar. Junto a cada
                uno aparece un check para marcarlo como revisado; corregirlo o
                validar el caso también lo da por revisado.

          - id: home.caso.reporte.controles
            type: icon-table
            props:
              # Type: components/panels/dashboard/calls-review/calls-review-type-edit-controls.tsx
              # :97-137 (pencil `review.editEmergencyType`, calls.json:144;
              # while editing the check is `callsReview.finishTypeEdit`,
              # calls.json:482, tooltip `review.done`, and the X is
              # `callsReview.cancelTypeEdit`, calls.json:481). The type can be
              # edited only when `canEditType = item.matchId != null &&
              # !isArchived` (calls-review-card.tsx:210). Location: pencil
              # `review.editLocation` (calls-review-card.tsx:525, calls.json:147),
              # and in the editor `callsReview.saveLocation` / `cancelLocationEdit`
              # (calls-review-address-editor.tsx:257, :273; calls.json:480, :479),
              # available while `!isArchived` (:209). The two checks are
              # `review.markTypeAsReviewed` (calls.json:168) and
              # `callsReview.markLocationReviewed` (calls.json:483).
              labelHeader: Control
              descriptionHeader: Qué hace
              rows:
                - id: home.caso.reporte.control.editar-tipo
                  label: Editar tipo de emergencia
                  description: >-
                    Convierte el tipo del reporte en un selector. Está
                    disponible cuando el caso tiene una llamada asociada y
                    todavía no se validó.
                - id: home.caso.reporte.control.terminar-tipo
                  label: Terminar edición del tipo de emergencia
                  description: >-
                    Confirma la corrección del tipo y cierra el selector.
                - id: home.caso.reporte.control.cancelar-tipo
                  label: Cancelar edición y volver al tipo original
                  description: >-
                    Descarta la corrección y deja el tipo como estaba.
                - id: home.caso.reporte.control.editar-ubicacion
                  label: Editar ubicacion
                  description: >-
                    Convierte la dirección en un campo de búsqueda. Está
                    disponible mientras el caso no se validó.
                - id: home.caso.reporte.control.guardar-ubicacion
                  label: Guardar ubicación
                  description: >-
                    Confirma la dirección elegida y actualiza el caso.
                - id: home.caso.reporte.control.cancelar-ubicacion
                  label: Cancelar edición de la ubicación
                  description: >-
                    Descarta el cambio y deja la dirección como estaba.
                - id: home.caso.reporte.control.revisado-tipo
                  label: Marcar tipo de emergencia como revisado
                  description: >-
                    Da por revisado el tipo sin modificarlo.
                - id: home.caso.reporte.control.revisado-ubicacion
                  label: Marcar ubicación como revisada
                  description: >-
                    Da por revisada la ubicación sin modificarla.

          - id: home.caso.corregir-ubicacion
            type: procedure
            props:
              # components/panels/dashboard/calls-review/calls-review-address-editor.tsx:
              # a Google Places search field, "nada de texto libre"
              # (:55-58); placeholder `callsReview.searchAddress` (calls.json:478).
              # Saving persists to the case and re-selects it with the corrected
              # coordinates, which re-centres the map
              # (hooks/use-focus-selected-case.ts:17-27).
              lead: >-
                Para corregir la ubicación del caso:
              steps:
                - id: home.caso.corregir-ubicacion.editar
                  title: Haga clic en Editar ubicacion
                  text: >-
                    La dirección de la tarjeta se convierte en un campo de
                    búsqueda.
                  layout: beside

                - id: home.caso.corregir-ubicacion.buscar
                  title: Busque y elija la dirección
                  text: >-
                    Escriba en **Buscar dirección…** y elija una de las
                    direcciones que propone la lista. Escribir no alcanza: la
                    ubicación cambia solo cuando elige una sugerencia.
                  layout: beside

                - id: home.caso.corregir-ubicacion.guardar
                  title: Haga clic en Guardar ubicación
                  text: >-
                    El caso queda con la nueva dirección, el pin del mapa se
                    mueve y el mapa se centra en él. **Cancelar edición de la
                    ubicación** descarta el cambio.
                  layout: beside

          - id: home.caso.corregir-tipo
            type: procedure
            props:
              # The badge becomes a picker while `isEditingType`
              # (calls-review-card.tsx:427-434, emergency-type-badge.tsx:442-461):
              # its pill reads `emergencyBadge.selectType` (calls.json:515), the
              # list has a search field `fields.searchType` (incidents.json:38)
              # and the selection is saved when the list closes
              # (`commitOnClose`, incident-type-picker.tsx:29-32). More than one
              # type can be picked (the badge shows "+N").
              lead: >-
                Para corregir el tipo de incidente:
              steps:
                - id: home.caso.corregir-tipo.editar
                  title: Haga clic en Editar tipo de emergencia
                  text: >-
                    El tipo de la tarjeta se convierte en un botón.
                  layout: beside

                - id: home.caso.corregir-tipo.elegir
                  title: Elija el tipo
                  text: >-
                    Haga clic en el tipo para abrir la lista **Seleccionar tipo
                    de incidente**. Busque con **Buscar tipo…** y marque uno o
                    más tipos.
                  layout: beside

                - id: home.caso.corregir-tipo.terminar
                  title: Termine la edición
                  text: >-
                    Haga clic en **Terminar edición del tipo de emergencia**.
                    **Cancelar edición y volver al tipo original** restituye el
                    tipo anterior.
                  layout: beside

          - id: home.caso.reporte.aviso
            type: callout
            props:
              # `setPendingEdit(isEditing)` (calls-review-card.tsx:267-270) gates
              # every exit — back arrow (views/home-view.tsx:815-818), another view
              # (pages/dashboard.tsx:115-121) — with the toast
              # `pendingCaseEdit.message` (calls.json:475), shown by
              # calls-review/pending-case-edit-toast.tsx:13-40 for 4 s.
              variant: important
              text: >-
                Mientras edita el tipo o la ubicación no puede salir del caso:
                si lo intenta, la plataforma muestra **Estás editando este
                caso. Guardá o cancelá los cambios antes de continuar.** Termine
                o cancele la edición primero.

      # --- Información de la llamada ---------------------------------------
      - id: home.caso.informacion
        title: Información de la llamada
        children:
          - id: home.caso.informacion.texto
            type: prose
            props:
              # `caseInfoContent = <IncidentSummaryContent event={selectedCase} />`
              # when `threeColumnCaseView && selectedCase` (views/home-view.tsx:1509-1513),
              # placed under the card behind a divider
              # (calls-review-panel.tsx:481-486).
              text: >-
                Debajo de la tarjeta, en el mismo panel y tras una línea
                divisoria, reúne lo que la plataforma registró de la llamada: la
                grabación con su transcripción, el resumen de Call AI, las
                transferencias, el recorrido de ubicaciones y las capturas.
                Aparece en cuanto se abre el caso y se desplaza junto con la
                tarjeta.

          - id: home.caso.informacion.fig
            type: figure
            props:
              caption: "Información de la llamada bajo la tarjeta: reproductor, resumen de Call AI e historial de ubicaciones."
              widthPercent: 90

          - id: home.caso.informacion.bloques
            type: data-table
            props:
              # components/panels/dashboard/incident-summary/incident-summary-content.tsx:
              # media :103, Call AI :107, transfers :109-114 (only with a
              # `contactId`), location history :116-231 (heading
              # `location.locationHistory`, incidents.json:142), captures
              # :233-269 (`summary.captures`, incidents.json:71). The extracted
              # data of Call AI (incident-summary-call-ai.tsx:64-73) uses the
              # `calls` labels callAi.vehiclesInvolved / weapons / wounded /
              # suspects (calls.json:367, :333, :330, :332) and is expanded
              # with the "+" (:85-100); rows without a value are dropped
              # (`hasValue`, :73). Transfer history heading
              # `caseDetail.transferHistory` (incidents.json:261,
              # transfer-history-timeline.tsx:91).
              labelHeader: Bloque
              descriptionHeader: Qué contiene
              rows:
                - id: home.caso.informacion.bloque.grabacion
                  label: Grabación
                  description: >-
                    El reproductor de la llamada, con la miniatura del video
                    cuando el llamante compartió video, y su transcripción.
                - id: home.caso.informacion.bloque.call-ai
                  label: Call AI
                  description: >-
                    El resumen que genera el análisis automático de la llamada.
                    El botón **+** junto al título despliega los datos que
                    extrajo —**Vehículos Involucrados**, **Armas**, **Heridos**
                    y **Sospechosos**—; solo figuran los que tienen valor.
                - id: home.caso.informacion.bloque.transferencias
                  label: Historial de transferencias
                  description: >-
                    Solo si la llamada pasó por más de un agente: la cadena de
                    transferencias, con el agente que atendió, la extensión y la
                    duración de cada tramo.
                - id: home.caso.informacion.bloque.ubicaciones
                  label: Historial de ubicaciones
                  description: >-
                    Las ubicaciones registradas del incidente, de la más
                    reciente a la más antigua, cada una con su origen, su
                    dirección y su hora. La más reciente es la vigente y se
                    marca con el icono del tipo de incidente. Al hacer clic en
                    una entrada con coordenadas, el mapa se centra en ella.
                - id: home.caso.informacion.bloque.capturas
                  label: Capturas
                  description: >-
                    Las imágenes capturadas durante la llamada, si las hay. El
                    botón **Capturas**, con el icono de una imagen, las muestra
                    o las oculta.

          - id: home.caso.informacion.escuchar
            type: procedure
            props:
              # components/panels/dashboard/incident-summary/incident-summary-media.tsx:
              # play/pause :639-682 (`media.play`, incidents.json:109), progress
              # range :727-737 (`media.callProgress`, incidents.json:112),
              # transcript toggle :743-770 (`media.showTranscript`,
              # incidents.json:111), a line seeks to its moment (:604-624 and
              # `handleLineSeek`). Speakers `media.caller` / `media.operator`
              # (incidents.json:100-101).
              lead: >-
                Para escuchar la llamada:
              steps:
                - id: home.caso.informacion.escuchar.reproducir
                  title: Haga clic en Reproducir
                  text: >-
                    El control está a la izquierda del reproductor, al pie del
                    panel. Mientras la grabación se procesa, el reproductor lo
                    indica; si no hay audio, el control queda deshabilitado.
                  layout: beside

                - id: home.caso.informacion.escuchar.posicion
                  title: Elija el punto de la llamada
                  text: >-
                    Mueva el control **Progreso de la llamada** para saltar a
                    otro instante. Bajo la barra, el reproductor muestra el
                    tiempo transcurrido y la duración total.
                  layout: beside

                - id: home.caso.informacion.escuchar.transcripcion
                  title: Muestre la transcripción
                  text: >-
                    Haga clic en **Mostrar transcripción** para desplegar todas
                    las líneas, cada una con su interlocutor (**Llamante** u
                    **Operador**) y su hora. Al hacer clic en una línea, la
                    llamada salta a ese momento.
                  layout: beside

          - id: home.caso.informacion.video
            type: prose
            props:
              # The thumbnail is a `role="button"` that enlarges the video
              # (incident-summary-media.tsx:540-575); the enlarged modal is
              # :468-534 (title `media.videoModalTitle`, incidents.json:114,
              # close `media.closeVideo`, :113, and Escape at :290-297), with the
              # transcript and the captures beside it.
              text: >-
                Cuando el llamante compartió video, se muestra una miniatura
                sobre la transcripción. Al hacer clic en ella se agranda en una
                ventana titulada **Video y transcripción**, con la transcripción
                y las capturas al lado. Se cierra con **Cerrar video** o con la
                tecla Escape.

          - id: home.caso.informacion.avisos
            type: term-list
            props:
              entries:
                # incidents.json:106, :105, :99; drawn at
                # incident-summary-media.tsx:271-276, :645-657 and :595-596.
                - id: home.caso.informacion.aviso.procesando
                  term: Procesando audio de la llamada…
                  definition: >-
                    La grabación todavía se está preparando. Vuelva a mirar en
                    unos segundos.
                - id: home.caso.informacion.aviso.sin-audio
                  term: Sin audio disponible
                  definition: >-
                    La llamada no tiene una grabación que reproducir.
                - id: home.caso.informacion.aviso.sin-transcripcion
                  term: Sin transcripción
                  definition: >-
                    La llamada no tiene transcripción registrada.

      # --- Libro del caso --------------------------------------------------
      - id: home.libro
        title: Libro del caso
        children:
          - id: home.libro.proposito
            type: prose
            props:
              text: >-
                Es el registro escrito del caso: los datos del llamante y del
                incidente y las notas que toma el operador. Queda guardado con
                el caso.

          - id: home.libro.ubicacion
            type: prose
            props:
              # HOME_DOCK_MANIFEST_KEYS `incident-book` (views/home-view.tsx:286-293,
              # `initiallyInactive`, `requiresCase`); for RECEPTION it opens with
              # the case (:1336-1344) under the map (seed override :1133-1146).
              # Title in the dock `dockPanels.caseBook` "Libro del Caso"
              # (calls.json:748); the panel's own header is `caseBook.title`
              # "Libro del caso" (calls.json:245, components/panels/case-book-panel.tsx:81).
              text: >-
                Se abre por sí solo al abrir un caso, bajo el mapa, y se cierra
                al volver a la lista. En la barra de paneles figura como **Libro
                del Caso**. Si lo cierra, recupérelo desde la barra.

          - id: home.libro.vista.fig
            type: figure
            props:
              caption: "Libro del caso abierto bajo el mapa, con los datos del llamante y del incidente y las notas."
              widthPercent: 90

          - id: home.libro.pasos
            type: data-table
            props:
              # components/panels/case-book-panel.tsx:97-112 renders GeneralForm
              # with `onlyCallReceptionStep` (default true, :52), which keeps
              # only step 1 and drops the stepper
              # (components/panels/incident-book/general-form.tsx:228-236 and
              # components/forms/form-kit/stepped-form.tsx:84-91). Step name
              # `book.stepCallReception` (incidents.json:187). The dispatch and
              # extended-information steps only exist for other agencies
              # (general-form.tsx:237-243).
              labelHeader: Paso
              descriptionHeader: Qué registra
              rows:
                - id: home.libro.paso.recepcion
                  label: Recepción de llamada
                  description: >-
                    El único paso del libro. Registra quién llamó y su relación
                    con el hecho, los teléfonos de contacto, la ubicación del
                    incidente con sus referencias, la prioridad y las notas.

          - id: home.libro.campos
            type: data-table
            props:
              # components/panels/incident-book/steps/step1-body.tsx: caller
              # block :61-154 (`step1.callerIdentification`, incidents.json:269),
              # location block :156-273 (`step1.incidentLocation`,
              # incidents.json:283). "Tipo de Incidente" is hidden here
              # (`hideIncidentType`, case-book-panel.tsx:102; step1-body.tsx:216):
              # the type is corrected on the card. Relationship options
              # form.options.ts:43-60 (incidents.json:317-321); priority
              # form.options.ts:92-108 (incidents.json:330-332).
              labelHeader: Campo
              descriptionHeader: Qué se registra
              rows:
                - id: home.libro.campo.nombre
                  label: Nombre del Llamante
                  description: >-
                    El nombre completo de quien llamó.
                - id: home.libro.campo.relacion
                  label: Relación con la Emergencia
                  description: >-
                    Cómo se vincula el llamante con el hecho: víctima, testigo,
                    familiar, autoridad u otro. Al elegir **Otro**, un campo
                    adicional pide que lo especifique.
                - id: home.libro.campo.telefono
                  label: Teléfono / ANI
                  description: >-
                    El número desde el que se llamó. **Agregar teléfono** suma
                    otros números de contacto.
                - id: home.libro.campo.involucrado
                  label: Llamante Involucrado
                  description: >-
                    Si el llamante está involucrado en el hecho: **Sí** o
                    **No**.
                - id: home.libro.campo.direccion
                  label: Dirección / Número Cívico
                  description: >-
                    La dirección del incidente.
                - id: home.libro.campo.ciudad
                  label: Ciudad / Municipio
                  description: >-
                    La ciudad o el municipio del incidente.
                - id: home.libro.campo.piso
                  label: Piso / Apartamento / Unidad
                  description: >-
                    El detalle dentro del inmueble, si corresponde.
                - id: home.libro.campo.referencia
                  label: Punto de Referencia
                  description: >-
                    Una referencia del lugar que ayude a encontrarlo.
                - id: home.libro.campo.prioridad
                  label: Prioridad
                  description: >-
                    La prioridad del caso, que se elige con uno de tres botones:
                    **Alta**, **Media** o **Baja**.
                - id: home.libro.campo.notas-adicionales
                  label: Notas Adicionales
                  description: >-
                    Una descripción libre del incidente reportado. El campo se
                    despliega con **Agregar notas adicionales**.

          - id: home.libro.notas.texto
            type: prose
            props:
              # components/panels/incident-book/incident-notes.tsx:22-43 (a free
              # textarea, `incidentNotes.placeholder`, incidents.json:353, that
              # writes the report's summary field) rendered under the step by
              # `showNotesInline` (general-form.tsx:209-218), with the heading
              # `incidentNotes.sectionTitle` (incidents.json:351).
              text: >-
                Bajo los campos, la sección **Notas** ofrece un campo de texto
                libre para el relato del llamante, las referencias del lugar y
                cualquier dato que no entre en otro campo. Las notas forman
                parte del mismo libro y se guardan con él.

          - id: home.libro.autocompletado
            type: callout
            props:
              # `autoImportCallIa` (case-book-panel.tsx:70 and :103): Call AI's
              # data fills the form as soon as it exists, only the empty fields,
              # never overwriting (general-form.tsx:105-120; hint
              # `callAi.importFromCallAiHint`, calls.json:370). The manual button
              # is hidden (`hideCallIaImport`, case-book-panel.tsx:102).
              variant: info
              text: >-
                Los campos vacíos se completan solos con los datos que Call AI
                detecta en la llamada. Nunca reemplaza lo que usted ya escribió.

          - id: home.libro.registrar
            type: procedure
            props:
              # The footer button is `book.save` / `book.update`
              # (incidents.json:181-182; stepped-form.tsx:224-270: a single step
              # has no stepper, so it is always Guardar or Actualizar), and the
              # toasts are `book.successCreate` / `successUpdate` / `errorCreate`
              # / `errorUpdate` (incidents.json:183-186; stepped-form.tsx:99-111).
              lead: >-
                Para dejar el caso registrado:
              steps:
                - id: home.libro.registrar.revisar
                  title: Revise los campos completados
                  text: >-
                    Compruebe lo que Call AI cargó y corrija lo que no
                    corresponda.
                  layout: beside

                - id: home.libro.registrar.completar
                  title: Complete lo que falte y tome las notas
                  text: >-
                    Escriba los datos que el llamante aporte y, en **Notas**, lo
                    que no entre en ningún campo. No necesita ordenar la
                    información.
                  layout: beside

                - id: home.libro.registrar.guardado
                  title: Guarde el libro
                  text: >-
                    Use **Guardar** la primera vez y **Actualizar** para
                    conservar los cambios posteriores. La plataforma confirma
                    con **Formulario guardado** o **Formulario actualizado**; si
                    no puede guardar, avisa con **Error al guardar** o **Error
                    al actualizar**.
                  layout: beside

          - id: home.libro.aviso
            type: callout
            props:
              # The book is keyed by case (views/home-view.tsx:1658-1666), so it
              # remounts empty for the next one. `Validar` submits it first
              # (calls-review-case-actions.tsx:128-134, a failed save does not
              # stop the routing). `Ver más tarde` also submits it first, but there
              # a failed save DOES stop it: `saveCaseForLater` returns false and
              # leaves the case as it was (stores/save-case-for-later.ts:16-17).
              variant: important
              text: >-
                **Validar** y **Ver más tarde** intentan guardar el libro antes
                de continuar. Al abrir otro caso, el libro se vacía: lo que haya
                escrito y no se haya guardado por alguna de esas dos vías o con
                **Guardar** no se conserva.

      # --- CCTV ------------------------------------------------------------
      - id: home.caso.cctv
        title: CCTV
        children:
          - id: home.caso.cctv.proposito
            type: prose
            props:
              text: >-
                Lista las cámaras próximas al incidente, para confirmar lo que
                el llamante describe desde una fuente propia.

          - id: home.caso.cctv.texto
            type: prose
            props:
              # HOME_DOCK_MANIFEST_KEYS `cameras` (views/home-view.tsx:261-268,
              # `requiresCase`), seed :163-183 (right column, above Fuerzas en
              # Campo). Rendered by `CallsReviewCctv`
              # (components/panels/dashboard/calls-review/calls-review-cctv.tsx:19-59)
              # with `onlyNearbyCameras` (:54) and radius `NEARBY_RADIUS_M = 2000`
              # (:8). It opens only when `nearbyCctvCameras.length > 0`
              # (views/home-view.tsx:1319-1327); title `homeView.cctv`
              # (calls.json:425).
              text: >-
                Ocupa la parte superior de la columna derecha, bajo el título
                **CCTV**, y lista únicamente las cámaras a menos de 2 km del
                incidente. Se abre por sí solo al abrir un caso, siempre que haya
                al menos una cámara en ese radio; si no la hay, ábralo desde la
                barra de paneles y el panel indicará **Sin cámaras cercanas**. No
                ofrece el listado completo de cámaras ni su búsqueda.

          - id: home.caso.cctv.fig
            type: figure
            props:
              caption: "Panel de CCTV con las cámaras cercanas al incidente."
              widthPercent: 90

          - id: home.caso.cctv.filas
            type: prose
            props:
              # components/panels/cameras-panel.tsx:243-300 (row: name, distance
              # via `formatDistance`, lane) and the list cap `max-h-[184px]` =
              # four rows (:225); hovering a row pulses its pin on the map
              # (:110-118, :244).
              text: >-
                Cada fila muestra el nombre de la cámara, su distancia al
                incidente y el carril o la vía. Se ven cuatro filas a la vez; las
                siguientes se alcanzan desplazando la lista. Al pasar el puntero
                por una fila, el pin de esa cámara late en el mapa.

          - id: home.caso.cctv.ver
            type: procedure
            props:
              # `openCameraDisplay` (components/panels/cameras-panel.tsx:157-185):
              # a second click on the selected row closes it and re-centres the
              # map on the incident (:160-168); otherwise it turns on the Cámaras
              # layer (:172, `showCameraLayer` :142-148), selects the marker so its info window opens and
              # frames the camera together with the incident (:174-180). The info
              # window is the live stream with PTZ
              # (components/panels/info-windows/camera-info-window.tsx:14-60).
              # Row tooltip "Abrir en el mapa" (cameras-panel.tsx:318).
              lead: >-
                Para ver una cámara:
              steps:
                - id: home.caso.cctv.ver.elegir
                  title: Haga clic en la fila de la cámara
                  text: >-
                    La fila se resalta, la ventana con la imagen en vivo de la
                    cámara se abre sobre el mapa y el mapa se encuadra para
                    mostrar la cámara junto al incidente. La capa **Cámaras** se
                    activa si estaba apagada.
                  layout: beside

                - id: home.caso.cctv.ver.cerrar
                  title: Vuelva a hacer clic en la fila para cerrarla
                  text: >-
                    La ventana se cierra y el mapa vuelve al incidente.
                  layout: beside

          - id: home.caso.cctv.avisos
            type: term-list
            props:
              entries:
                # common.json:203, :202, :211; drawn at cameras-panel.tsx:201-216
                # and calls-review-cctv.tsx:40-46.
                - id: home.caso.cctv.aviso.sin-camaras
                  term: Sin cámaras cercanas
                  definition: >-
                    No hay cámaras a menos de 2 km del incidente.
                - id: home.caso.cctv.aviso.error
                  term: No se pudieron cargar las cámaras cercanas
                  definition: >-
                    No fue posible recuperar la lista. Reintente más tarde.
                - id: home.caso.cctv.aviso.sin-ubicacion
                  term: Este incidente no tiene ubicación
                  definition: >-
                    Sin ubicación no se pueden buscar cámaras cercanas. Corrija
                    la ubicación del reporte.

      # --- Fuerzas en Campo ------------------------------------------------
      - id: home.caso.fuerzas
        title: Fuerzas en Campo
        children:
          - id: home.caso.fuerzas.proposito
            type: prose
            props:
              text: >-
                Lista las unidades de campo cercanas al incidente, permite
                despachar una y muestra las que ya se despacharon para el caso.

          - id: home.caso.fuerzas.ubicacion
            type: prose
            props:
              # HOME_DOCK_MANIFEST_KEYS `field-forces` (views/home-view.tsx:253-260,
              # `requiresCase`), seed override for RECEPTION :1111-1132 (below
              # CCTV); opened by the effect at :1291-1297. Rendered by
              # `CallsReviewFieldForces`
              # (components/panels/dashboard/calls-review/calls-review-field-forces.tsx:57-241),
              # which mounts the same `AvailableAgentsPanel`
              # (components/panels/available-agents-panel.tsx) that the call view
              # draws, with the header `fieldForces.title` (calls.json:201,
              # calls-review-field-forces.tsx:234). The location is the CASE's
              # (:64-67), not a caller's GPS. Filters and dispatch are the ones
              # 02-llamada documents under "Fuerzas de Respuesta".
              text: >-
                Ocupa la parte inferior de la columna derecha, bajo **CCTV**,
                con el título **Fuerzas en Campo**, y se abre por sí solo al
                abrir un caso. Es el mismo panel que la sección **Llamada**
                describe como **Fuerzas de Respuesta**, con el mismo filtro por
                fuerza y el mismo procedimiento de despacho; aquí trabaja sobre
                la ubicación del caso abierto, no sobre la de una llamada en
                curso.

          - id: home.caso.fuerzas.fig
            type: figure
            props:
              caption: "Panel de Fuerzas en Campo con el filtro por fuerza y las unidades cercanas al incidente."
              widthPercent: 90

          - id: home.caso.fuerzas.estados
            type: term-list
            props:
              entries:
                # calls-review-field-forces.tsx: dispatched block :194-214
                # (`fieldForces.dispatched`, calls.json:202); settled case
                # :216-226 (`fieldForces.caseSettled`, calls.json:205); empty
                # answer `availableAgents.noNearbyForces` (agents.json:120,
                # available-agents-list.tsx:249-252) with the button
                # `availableAgents.otherAgents` (agents.json:121, :262-267) and
                # the directory (`directory.openTitle`, agents.json:124); no
                # location :165-190 (line :185 holds the first half of the
                # sentence).
                - id: home.caso.fuerzas.estado.despacho
                  term: En Despacho
                  definition: >-
                    Bloque que aparece sobre la lista cuando ya se despachó al
                    menos una unidad para el caso y muestra su avance hacia el
                    incidente.
                - id: home.caso.fuerzas.estado.sin-fuerzas
                  term: No hay fuerzas cercanas para este incidente
                  definition: >-
                    No se encontraron unidades cerca. El botón **Otros
                    agentes** abre el **Directorio de agentes**, para buscar una
                    unidad a mano.
                - id: home.caso.fuerzas.estado.finalizado
                  term: Este caso ya finalizó — no se despachan más fuerzas.
                  definition: >-
                    El caso está terminado y el panel deja de buscar unidades.
                - id: home.caso.fuerzas.estado.sin-ubicacion
                  term: Este incidente no tiene ubicación
                  definition: >-
                    Sin ubicación no se pueden buscar fuerzas cercanas. Corrija
                    la ubicación del reporte.

      # --- Log -------------------------------------------------------------
      - id: home.caso.bitacora
        title: Log
        children:
          - id: home.caso.bitacora.proposito
            type: prose
            props:
              # `IncidentLogsDrawer` -> `IncidentSummaryLogs` -> `useEventLogs`
              # (components/panels/dashboard/incident-summary/incident-logs-drawer.tsx:16-25;
              # incident-summary-logs.tsx:11-28): the call events plus the
              # dispatch detail and list of the case, as a timeline. Read-only:
              # unlike the live call's log it has no comment box.
              text: >-
                Muestra, en orden, los eventos del caso —los de la llamada y los
                del despacho— como una línea de tiempo. Es de solo lectura.

          - id: home.caso.bitacora.ubicacion
            type: prose
            props:
              # Mounted only with a case
              # (views/home-view.tsx:1739-1747, `threeColumnCaseView &&
              # selectedCase`). Chrome: components/panels/logs-side-drawer.tsx:60-123
              # (tab :40-58, `title` = `logsDrawer.open` / `close`,
              # calls.json:221-222; drawer width 360 at :46). Not a dock panel, so
              # it is not in the panel bar.
              text: >-
                Es una pestaña vertical, titulada **Log**, en el borde derecho de
                la pantalla. Está disponible solo con un caso abierto y empieza
                cerrada. No forma parte de la barra de paneles.

          - id: home.caso.bitacora.fig
            type: figure
            props:
              caption: "Pestaña Log abierta en el borde derecho, con la línea de tiempo del caso."
              widthPercent: 90

          - id: home.caso.bitacora.controles
            type: field-list
            props:
              items:
                # The tab is the control (logs-side-drawer.tsx:40-58): it opens the
                # drawer and closes it again; its tooltip is "Abrir bitácora" /
                # "Cerrar bitácora".
                - id: home.caso.bitacora.pestana
                  label: Log
                  text: >-
                    Abre el panel del log, de 360 píxeles de ancho, que se
                    desliza sobre la pantalla; un segundo clic lo cierra. Su
                    ayuda emergente dice **Abrir bitácora** o **Cerrar
                    bitácora**, según el estado.
                  layout: beside

          - id: home.caso.bitacora.avisos
            type: term-list
            props:
              entries:
                # incidents.json:120, drawn at incident-summary-logs.tsx:24-26.
                - id: home.caso.bitacora.aviso.sin-registros
                  term: Sin logs de la llamada
                  definition: >-
                    El caso todavía no tiene eventos registrados.

      # --- Acciones sobre el caso ------------------------------------------
      - id: home.caso.acciones
        title: Acciones sobre el caso
        children:
          - id: home.caso.acciones.texto
            type: prose
            props:
              text: >-
                La barra de acciones reúne lo que usted hace para hacer avanzar
                el caso: llamar de vuelta al reportante, validarlo y enviarlo a
                las agencias, o dejarlo para más tarde.

          - id: home.caso.acciones.ubicacion
            type: prose
            props:
              # `CallsReviewCaseActions` is portaled into a footer that never
              # scrolls (calls-review-panel.tsx:154-166, :488-494;
              # calls-review-card.tsx:563-587); it is drawn for the selected card
              # of Recepción (`showCaseActions`, :357). Layout
              # calls-review-case-actions.tsx:181-247.
              text: >-
                Está fija al pie del panel **Revisión de reporte**, siempre a la
                vista aunque desplace la información de la llamada. Aparece solo
                con un caso abierto.

          - id: home.caso.acciones.fig
            type: figure
            props:
              caption: "Barra de acciones al pie del panel Revisión de reporte."
              widthPercent: 90

          - id: home.caso.acciones.controles
            type: icon-table
            props:
              # components/panels/dashboard/calls-review/calls-review-case-actions.tsx:
              # Ver más tarde :183-202 (only `showValidate && isPostCallReview`,
              # i.e. while THIS case holds the Post-Llamada lock, :87-88);
              # Llamar :203-225 (disabled without `onOutboundCall`, title
              # `review.callUnavailable`, calls.json:154); Validar :226-246 (only
              # `showValidate`, i.e. the case is not validated yet,
              # calls-review-card.tsx:569). Labels `caseActions.viewLater`
              # (calls.json:590), `.call` (:584), `.validate` (:585). The Llamar
              # icon is lucide `phone-outgoing` (:216).
              labelHeader: Acción
              descriptionHeader: Qué hace
              rows:
                - id: home.caso.accion.llamar
                  label: Llamar
                  description: >-
                    Inicia una llamada al teléfono desde el que se reportó el
                    caso. Al colgar, la plataforma lo devuelve a este mismo caso
                    en Post-Llamada, con el bloqueo y la cuenta regresiva.
                - id: home.caso.accion.validar
                  label: Validar
                  description: >-
                    Guarda el libro del caso y envía el caso a las agencias que
                    corresponden a su tipo de incidente. Solo aparece mientras el
                    caso no se validó.
                - id: home.caso.accion.mas-tarde
                  label: Ver más tarde
                  description: >-
                    Guarda el libro del caso y lo deja pendiente en la lista,
                    para retomarlo después. Solo aparece durante la
                    Post-Llamada.

          - id: home.caso.validar
            type: procedure
            props:
              # handleFinalize (calls-review-case-actions.tsx:90-168): it needs
              # an address and a type (:113-120), submits the book (:128-134),
              # sends the case with `validateAndSend` (:139), and on success
              # plays a sound (:156), marks type and location as reviewed (:157),
              # releases the Post-Llamada lock (:160), resets the countdown
              # (:163), archives the case and returns to the list (:164-167).
              lead: >-
                Para validar un caso:
              steps:
                - id: home.caso.validar.revisar
                  title: Revise el tipo y la ubicación
                  text: >-
                    Confirme los dos, o corríjalos con los controles de la
                    tarjeta. Sin dirección o sin tipo, el caso no se puede
                    validar.
                  layout: beside

                - id: home.caso.validar.libro
                  title: Complete el libro del caso
                  text: >-
                    Registre los datos del llamante y del incidente. **Validar**
                    guarda el libro, pero conviene que esté completo antes.
                  layout: beside

                - id: home.caso.validar.enviar
                  title: Haga clic en Validar
                  text: >-
                    La plataforma envía el caso a las agencias, suena un aviso
                    de confirmación y la lista vuelve a mostrarse. El caso
                    deja de estar **Pendiente** y pasa a **Abierto con
                    despacho** o **Abierto sin despacho**, según tenga o no
                    agencias asignadas.
                  layout: beside

          - id: home.caso.validar.avisos
            type: term-list
            props:
              entries:
                # calls-review-case-actions.tsx:103, :113-120, :147-152;
                # calls.json:592-595. The case stays as it was: nothing after the
                # failed step runs.
                - id: home.caso.validar.aviso.ubicacion
                  term: Primero debes validar la ubicación del caso antes de enviarlo a la agencia
                  definition: >-
                    El caso no tiene dirección. Corrija la ubicación y vuelva a
                    validar.
                - id: home.caso.validar.aviso.tipo
                  term: Primero debes validar la tipificación del caso antes de enviarlo a la agencia
                  definition: >-
                    El caso no tiene tipo de incidente. Corríjalo y vuelva a
                    validar.
                - id: home.caso.validar.aviso.sin-ruta
                  term: "Este caso no puede ser atendido: su tipo de incidente no tiene ninguna agencia configurada para recibirlo. Contacta a un administrador para configurar el enrutamiento."
                  definition: >-
                    Ninguna agencia recibe casos de ese tipo. Informe al
                    administrador para que configure el enrutamiento; mientras
                    tanto, el caso sigue sin validar.
                - id: home.caso.validar.aviso.sincronizando
                  term: El caso todavía se está sincronizando, espera unos segundos e intenta validar de nuevo
                  definition: >-
                    El caso recién terminó de procesarse. Espere unos segundos y
                    vuelva a hacer clic en **Validar**.

          - id: home.caso.volver
            type: procedure
            props:
              # The back arrow lives in the dock tab's header actions
              # (views/home-view.tsx:871-896, `review.backToList`,
              # calls.json:117), not in the toolbar, which is not drawn while a
              # case is open (calls-review-panel.tsx:412). `handleBackFromCase`
              # (:814-834) is blocked while editing (`notifyBlocked`) and while a
              # Post-Llamada is unconfirmed (`requestPostCallExit`); otherwise it
              # clears the case and the map view.
              lead: >-
                Para cerrar el caso y volver a la lista:
              steps:
                - id: home.caso.volver.flecha
                  title: Ubique la flecha en el encabezado del panel
                  text: >-
                    Está junto al botón de cerrar del panel **Revisión de
                    reporte**. Mientras hay un caso abierto, la barra de
                    búsqueda y los filtros no se muestran.
                  layout: beside

                - id: home.caso.volver.lista
                  title: Haga clic en Volver a la lista de incidentes
                  text: >-
                    La vista abandona el caso: la lista vuelve a mostrar las
                    tarjetas, reaparecen el teclado y Mi turno, y los paneles
                    recuperan su disposición predeterminada. Si está editando,
                    la plataforma se lo impide y lo indica; si el caso está en
                    Post-Llamada, le pregunta si desea guardarlo para verlo más
                    tarde.
                  layout: beside

      # --- Post-Llamada ----------------------------------------------------
      - id: home.caso.post-llamada
        title: Post-Llamada
        children:
          - id: home.caso.post-llamada.proposito
            type: prose
            props:
              # pages/dashboard.tsx:198-233 (`onCallEnded`): a transferred call
              # sends the operator to Home with no case (:200-204); a callback
              # placed from a case re-selects THAT case, locks it and starts the
              # countdown (:205-217); otherwise it opens the wrap-up for the
              # ended report and starts the countdown (:222-225). The case is
              # selected and locked by `useOpenEndedCallCase`
              # (hooks/use-open-ended-call-case.ts:22-82, lock at :80), once the
              # report lands (polled, :58-62).
              text: >-
                Cuando una llamada termina, Home abre por sí solo el caso de esa
                llamada para que usted lo revise y lo valide antes de tomar la
                siguiente. Hasta que lo haga, el caso queda bloqueado y corre
                una cuenta regresiva de tres minutos. Si la llamada se
                transfirió, Home se abre sin ningún caso.

          - id: home.caso.post-llamada.ubicacion
            type: prose
            props:
              # The report is written asynchronously when the call closes
              # (use-open-ended-call-case.ts:15-21) and the case may take a few
              # seconds to sync (`caseActions.caseNotReadyYet`, calls.json:592).
              text: >-
                No hay nada que abrir a mano: al colgar, la plataforma lo lleva
                a Home y selecciona el caso en cuanto el reporte de la llamada
                está disponible, lo que puede tardar unos segundos. Es el mismo
                estado de **Con un caso abierto** descrito arriba, con el
                bloqueo y la cuenta regresiva además.

          - id: home.caso.post-llamada.fig
            type: figure
            props:
              caption: "Home en Post-Llamada: el caso abierto y la cuenta regresiva bajo la barra superior."
              widthPercent: 90

          - id: home.caso.post-llamada.efectos
            type: data-table
            props:
              # The rows are the manual's own names for what Post-Llamada changes.
              # Countdown: components/layout/handle-time-countdown.tsx (banner
              # under the top bar :104-149; label :133; colour by remaining
              # ratio :94-100: >50 % teal, >20 % amber, then orange and blinking,
              # past zero red and blinking) and hooks/use-handle-time-countdown.ts
              # (180 s at :7, beep in the last 15 s at :10 and :62-67, 3 s
              # of grace before resuming at :14 and :33-41). Lock:
              # stores/use-post-call-lock-store.ts:39-40, guards at
              # pages/dashboard.tsx:122-131 (another view), :356-364 (going
              # "Disponible") and views/home-view.tsx:814-834 (back arrow). Dialog
              # components/layout/post-call-exit-prompt-dialog.tsx:26-43, texts
              # common.json:703-706. Released by Validar
              # (calls-review-case-actions.tsx:160) or Ver más tarde
              # (stores/save-case-for-later.ts:16-27); on release the operator is
              # put back in READY (pages/dashboard.tsx:385-397).
              labelHeader: Qué cambia
              descriptionHeader: Cómo se comporta
              rows:
                - id: home.caso.post-llamada.efecto.contador
                  label: Cuenta regresiva
                  description: >-
                    Un aviso bajo la barra superior cuenta desde 3:00. Cambia de
                    color a medida que se acaba el tiempo, del verde azulado al
                    ámbar y al naranja, con un parpadeo suave; en los últimos
                    15 segundos suena un pitido por segundo. Al llegar a cero
                    pasa a rojo, parpadea con más fuerza y cuenta el tiempo de
                    exceso. Se detiene mientras usted no está en Post-Llamada,
                    por ejemplo durante una llamada de retorno, y se reanuda tres
                    segundos después de volver.
                - id: home.caso.post-llamada.efecto.bloqueo
                  label: Bloqueo
                  description: >-
                    Mientras el caso no se valide ni se deje para más tarde, no
                    puede salir de Home a otra vista, volver a la lista ni
                    cambiar su estado a **Disponible**. Cada intento muestra la
                    pregunta **¿Deseas guardar y ver el caso más tarde?**, con
                    los botones **Cancelar** y **Guardar y salir**.
                - id: home.caso.post-llamada.efecto.teclado
                  label: Teclado
                  description: >-
                    El teclado permanece cerrado hasta que el caso se valide o
                    se deje para más tarde; para llamar use **Llamar** en la
                    barra de acciones.
                - id: home.caso.post-llamada.efecto.salida
                  label: Al terminar
                  description: >-
                    Al validar o dejar el caso para más tarde, se libera el
                    bloqueo, la cuenta regresiva desaparece y su estado vuelve a
                    **Disponible**.

          - id: home.caso.post-llamada.contadores
            type: term-list
            props:
              entries:
                # handle-time-countdown.tsx:133 — both literals sit on the same
                # line.
                - id: home.caso.post-llamada.contador.normal
                  term: Tiempo post-llamada
                  definition: >-
                    Lo que queda de los tres minutos, en minutos y segundos.
                - id: home.caso.post-llamada.contador.superado
                  term: Tiempo superado
                  definition: >-
                    Los tres minutos se agotaron. El aviso cuenta, con un signo
                    más, el tiempo de exceso.

          - id: home.caso.post-llamada.cerrar
            type: procedure
            props:
              # A case is released by Validar or Ver más tarde
              # (see home.caso.validar for the first).
              lead: >-
                Para cerrar la Post-Llamada:
              steps:
                - id: home.caso.post-llamada.cerrar.revisar
                  title: Revise el caso
                  text: >-
                    Confirme el tipo y la ubicación, corríjalos si hace falta y
                    complete el libro del caso.
                  layout: beside

                - id: home.caso.post-llamada.cerrar.terminar
                  title: Haga clic en Validar o en Ver más tarde
                  text: >-
                    **Validar** envía el caso a las agencias. **Ver más tarde**
                    guarda lo registrado y deja el caso pendiente en la lista
                    para retomarlo después. En los dos casos se libera el
                    bloqueo y usted vuelve a estar **Disponible**.
                  layout: beside

          - id: home.caso.post-llamada.retorno
            type: callout
            props:
              # A callback placed with Llamar carries the case as
              # `originatingCase` (calls-review-case-actions.tsx:208;
              # pages/dashboard.tsx:298-302); on hang-up the same case is
              # selected, locked and the countdown started (:205-217).
              variant: info
              text: >-
                Si necesita llamar de vuelta al reportante, use **Llamar**. Al
                colgar, la plataforma lo devuelve a este mismo caso en lugar de
                abrir uno nuevo, y el caso queda en Post-Llamada: bloqueado y
                con la cuenta regresiva de tres minutos hasta que lo valide o lo
                deje para más tarde.

  # --- Barra de paneles y disposición ----------------------------------------
  - id: home.paneles
    title: Barra de paneles y disposición
    children:
      - id: home.paneles.proposito
        type: prose
        props:
          text: >-
            Home es un tablero de paneles acoplados: cada panel puede abrirse,
            cerrarse, moverse y cambiar de tamaño. La barra de paneles reúne esas
            acciones.

      - id: home.paneles.ubicacion
        type: prose
        props:
          # components/panels/tool-kit-panel.tsx:123-235: a pill portalled to the
          # body (:234), draggable by its grip (:172-179), fixed at
          # `bottom-24 left-5.5` (:171); mounted by the icon rail
          # (components/layout/icon-sidebar.tsx:201). It is the manual's "barra
          # de paneles" (the product calls it ToolKit); the other sections use
          # the same name.
          text: >-
            Es una barra flotante en la esquina inferior izquierda, sobre la
            barra lateral de iconos. Puede moverla: arrástrela desde el asa de
            su parte superior. Los iconos de los paneles que se describen en
            esta sección abren y cierran cada uno su panel, y se iluminan
            cuando el panel está abierto; al pasar el puntero muestra
            el nombre del panel y si está activo o inactivo.

      - id: home.paneles.fig
        type: figure
        props:
          caption: "Barra de paneles con los paneles de Home y los controles de disposición."
          widthPercent: 60

      - id: home.paneles.lista
        type: data-table
        props:
          # tool-kit-panel.tsx:152-160 filters by `requiresCase` /
          # `requiresNoCase`; the manifest for RECEPTION is
          # views/home-view.tsx:244-303 minus `resolveExcludedHomePanels`
          # (views/home-right-slot.ts:224-257): calls-review (label
          # `homeView.incidentReview`, calls.json:414), keypad (`dockPanels.keypad`,
          # :754), my-shift (`homeView.myShift`, :424, requires no case,
          # views/home-view.tsx:1017-1023), field-forces (`fieldForces.title`,
          # :201, requires a case), cameras (`homeView.cctv`, :425, requires a
          # case), incident-book (`dockPanels.caseBook`, :748, requires a case).
          # `assign-incident` and `create-task` (`forcesInField.incidentAssignment`
          # / `taskOrder`, calls.json:208, :210) are dropped unless the operator
          # holds `dispatch.forces` (views/home-right-slot.ts:233-235); the
          # permission is called "Despachar fuerzas" in the profile
          # (settings.json:300). The bar also lists a toggle labelled
          # "Información del incidente" (`incident-info`,
          # views/home-view.tsx:275-285). It is NOT documented: it is declared in
          # `pending` (home.paneles-toggle-informacion-incidente).
          labelHeader: Panel
          descriptionHeader: Cuándo figura
          rows:
            - id: home.paneles.panel.revision
              label: Revisión de Incidentes
              description: >-
                Siempre. Es el panel **Reportes pendientes** o **Revisión de
                reporte**, según haya o no un caso abierto.
            - id: home.paneles.panel.teclado
              label: Teclado
              description: >-
                Siempre. Se cierra por sí solo al abrir un caso.
            - id: home.paneles.panel.turno
              label: Mi turno
              description: >-
                Solo sin un caso abierto.
            - id: home.paneles.panel.fuerzas
              label: Fuerzas en Campo
              description: >-
                Solo con un caso abierto.
            - id: home.paneles.panel.cctv
              label: CCTV
              description: >-
                Solo con un caso abierto.
            - id: home.paneles.panel.libro
              label: Libro del Caso
              description: >-
                Solo con un caso abierto.
            - id: home.paneles.panel.asignacion
              label: Asignación de Incidentes
              description: >-
                Solo si su perfil incluye el permiso **Despachar fuerzas**. Se
                describe en la sección **Fuerzas en Campo**, y también se abre
                desde los controles de las ventanas de los agentes en el mapa.
            - id: home.paneles.panel.tarea
              label: Orden de Tarea
              description: >-
                Solo si su perfil incluye el permiso **Despachar fuerzas**. Se
                describe en la sección **Fuerzas en Campo**.

      - id: home.paneles.controles
        type: icon-table
        props:
          # Lock / reset: components/panels/tool-kit-layout-actions.tsx:44-71
          # (hardcoded literals; the lock is persisted, stores/use-panel-dock-store.ts:69-83;
          # "Restablecer disposición" drops the arrangement and the zooms,
          # components/layout/panel-dock/panel-dock.tsx:481-485). Header actions:
          # components/layout/panel-dock/panel-dock-actions.tsx:102-167
          # (`panel.decreaseSize` / `increaseSize` / `closePanel`,
          # common.json:159-161); the size buttons scale the panel's CONTENT
          # between 70 % and 150 % in steps of 10 %
          # (store/use-panel-zoom-store.ts:5-8) and are persisted.
          labelHeader: Control
          descriptionHeader: Qué hace
          rows:
            - id: home.paneles.control.bloqueo
              label: Edición bloqueada
              description: >-
                Alterna entre bloquear y habilitar la edición de la disposición.
                Con la edición bloqueada no se pueden arrastrar ni
                redimensionar los paneles. Cuando la edición está habilitada, el
                control dice **Edición habilitada**. La elección se conserva en
                este equipo.
            - id: home.paneles.control.restablecer
              label: Restablecer disposición
              description: >-
                Descarta los cambios de posición, de tamaño y de zoom de los
                paneles y los devuelve a su disposición predeterminada. No se
                puede deshacer.
            - id: home.paneles.control.disminuir
              label: Disminuir tamaño del panel
              description: >-
                Reduce el contenido del panel, en pasos del 10 %, hasta el 70 %.
                Está en el encabezado de cada panel.
            - id: home.paneles.control.aumentar
              label: Aumentar tamaño del panel
              description: >-
                Agranda el contenido del panel, en pasos del 10 %, hasta el
                150 %.
            - id: home.paneles.control.cerrar
              label: Cerrar panel
              description: >-
                Cierra el panel. Para volver a abrirlo, use la barra de paneles.

      - id: home.paneles.abrir
        type: procedure
        props:
          # tool-kit-panel.tsx:199-224: the button toggles
          # `togglePanelActive`; the icon is teal when active (:207-209).
          lead: >-
            Para abrir o cerrar un panel:
          steps:
            - id: home.paneles.abrir.barra
              title: Ubique el panel en la barra de paneles
              text: >-
                Pase el puntero por los iconos: cada uno muestra el nombre del
                panel y si está **Activo** o **Inactivo**.
              layout: beside

            - id: home.paneles.abrir.alternar
              title: Haga clic en el icono del panel
              text: >-
                El panel se abre o se cierra y el icono se ilumina mientras está
                abierto. También puede cerrarlo con **Cerrar panel**, en su
                encabezado.
              layout: beside

      - id: home.paneles.reorganizar
        type: procedure
        props:
          # components/layout/panel-dock/panel-dock.tsx:296-: dropping a panel on
          # another exchanges their positions (panel-dock-swap.ts:28, :51, "every
          # column width and row height stays exactly where it was");
          # `locked` is passed to dockview (:567) and blocks drag and resize
          # (stores/use-panel-dock-store.ts:8-9).
          lead: >-
            Para reorganizar los paneles:
          steps:
            - id: home.paneles.reorganizar.mover
              title: Arrastre el encabezado de un panel sobre otro
              text: >-
                Los dos paneles intercambian sus lugares y las columnas
                conservan su ancho.
              layout: beside

            - id: home.paneles.reorganizar.redimensionar
              title: Arrastre el divisor entre dos paneles
              text: >-
                El panel de un lado gana el espacio que pierde el del otro.
              layout: beside

            - id: home.paneles.reorganizar.bloquear
              title: Bloquee la edición
              text: >-
                Si no quiere mover o cambiar de tamaño un panel por error, use
                **Edición habilitada** para bloquear la edición; el control pasa
                a decir **Edición bloqueada**. El bloqueo solo impide arrastrar
                y redimensionar: no conserva la disposición cuando se abre o se
                cierra un caso.
              layout: beside

      - id: home.paneles.aviso
        type: callout
        props:
          # The arrangement is never stored: every mount rebuilds it from the
          # seeds (stores/use-panel-dock-store.ts:29-45), and an effect resets
          # it whenever the selected case changes, whether or not the edit lock
          # is on: the effect calls `resetLayout` unconditionally
          # (views/home-view.tsx:1365-1375) and the reset handler never reads
          # `locked` (components/layout/panel-dock/panel-dock.tsx:475-486).
          variant: important
          text: >-
            Los cambios de disposición duran mientras Home está abierto, y los
            paneles vuelven a su disposición predeterminada cada vez que abre un
            caso o regresa a la lista, aunque tenga la edición bloqueada. El
            bloqueo solo evita mover o redimensionar los paneles por error.

  # --- Herramientas de mapa --------------------------------------------------
  - id: home.herramientas
    title: Herramientas de mapa
    children:
      - id: home.herramientas.proposito
        type: prose
        props:
          text: >-
            Controla lo que el mapa de fondo muestra y cómo se lo mira: el nivel
            de acercamiento, la base cartográfica, las capas de información
            sobre ella, la vista de calle y la agrupación de los marcadores.

      - id: home.herramientas.ubicacion
        type: prose
        props:
          # The map is a transparent panel whose rect is the area no panel
          # covers (views/home-view.tsx:1448-1480): `MapToolsPanel` floats at
          # `top-1/2 right-4` (:1465-1471) and `MarkerGroupingSwitch` at
          # `top-4 left-4` (:1476-1478).
          text: >-
            Es una columna de controles apoyada sobre el borde derecho del mapa,
            a media altura, dentro del área que dejan libre los paneles; por eso
            se mueve cuando los paneles se reacomodan. En la esquina superior
            izquierda de esa misma área está el interruptor de agrupación de
            marcadores.

      - id: home.herramientas.fig
        type: figure
        props:
          caption: "Columna de herramientas apoyada sobre el mapa."
          widthPercent: 60

      - id: home.herramientas.controles
        type: icon-table
        props:
          # components/panels/map-tools-panel.tsx:306-374 (labels `mapTools.*`,
          # common.json:819-827). The centre control calls the focused case's
          # `handleCenter` (components/panels/dashboard/incident-summary/use-incident-case-actions.ts:47-74,
          # passed at views/home-view.tsx:1468), which does nothing without a
          # case. Layers menu :313-325 (integrations) and map-type menu :335-347;
          # the street-view toggle :349-374 has no rótulo and its glyph is the
          # INACTIVE state — AGENTS.md of this manual. The grouping switch is
          # components/panels/marker-grouping-switch.tsx:63-97; its label names
          # what a click would do next (:68-71), `mapTools.groupMarkers` /
          # `ungroupMarkers` (common.json:825-826), and grouping is on by default
          # (store/use-map-layers-store.ts:277).
          labelHeader: Control
          descriptionHeader: Qué hace
          rows:
            - id: home.herramientas.control.centrar
              label: Centrar en el incidente
              description: >-
                Con un caso abierto, lleva el mapa al incidente. Sin un caso
                abierto no tiene efecto.
            - id: home.herramientas.control.integraciones
              label: Capas del mapa
              description: >-
                Abre un menú con las capas **AVL**, **Mobile** y **Cámaras**, que
                se encienden y se apagan una a una.
            - id: home.herramientas.control.acercar
              label: Acercar
              description: >-
                Aumenta el nivel de acercamiento del mapa.
            - id: home.herramientas.control.alejar
              label: Alejar
              description: >-
                Reduce el nivel de acercamiento del mapa.
            - id: home.herramientas.control.base
              label: Tipo de mapa
              description: >-
                Abre un menú con las capas **Tráfico** y **Satelital**, que se
                encienden y se apagan una a una.
            - id: home.herramientas.control.street-view
              label: Vista de calle
              description: >-
                Habilita la elección de un punto del mapa para verlo a nivel de
                calle. Con la vista de calle abierta, el mismo control la
                cierra.
            - id: home.herramientas.control.agrupar
              label: Agrupar marcadores
              description: >-
                Es el interruptor de la esquina superior izquierda del mapa.
                Encendido, junta los marcadores que se superponen en un grupo con
                su cantidad; apagado (**Desagrupar marcadores**), los muestra
                por separado. Empieza encendido y su estado se conserva.

      - id: home.herramientas.capas
        type: icon-table
        props:
          # map-tools-panel.tsx:72-86 (the layers), :30-31 and :26-28 (their
          # artwork), rendered by `LayerItemButton` :118-157 (`aria-pressed`
          # shows whether one is on). What each draws: components/panels/google-map.tsx:1637
          # (traffic), :1583 (`mapTypeId` = "hybrid" for satellite), :1674-1682
          # (mobile), :1684-1692 (AVL), :1694-1702 (cameras); data at
          # components/panels/use-map-data.ts:65-115. The Mobile layer is turned on
          # by opening a case from the list (calls-review-panel.tsx:301) and
          # Mobile and Cámaras are turned off when a call ends
          # (store/use-map-layers-store.ts:282, called at pages/dashboard.tsx:199).
          # "Tráfico", "Satelital" and "Cámaras" are `mapLayers.*`
          # (common.json:185-187); "AVL" and "Mobile" are literals (:78-79).
          labelHeader: Capa
          descriptionHeader: Qué muestra
          rows:
            - id: home.herramientas.capa.trafico
              label: Tráfico
              description: >-
                Superpone sobre las vías el estado del tráfico. Se enciende
                desde **Tipo de mapa**.
            - id: home.herramientas.capa.satelital
              label: Satelital
              description: >-
                Cambia el mapa base a la imagen satelital, con los nombres de las
                calles. Se enciende desde **Tipo de mapa**.
            - id: home.herramientas.capa.avl
              label: AVL
              description: >-
                Muestra la ubicación de los vehículos con localización
                automática. Se enciende desde **Capas del mapa**.
            - id: home.herramientas.capa.mobile
              label: Mobile
              description: >-
                Muestra la posición de los agentes de campo. Se enciende desde
                **Capas del mapa** y se activa por sí sola al abrir un caso
                desde la lista.
            - id: home.herramientas.capa.camaras
              label: Cámaras
              description: >-
                Muestra las cámaras de CCTV sobre el mapa. Se enciende desde
                **Capas del mapa**.
