# Home — written against the Bridge360 source (`bridge`, branch `develop`,
# 465f5eb9), cited by file and line.
#
# There is no module map for this product yet (no extractor exists for its
# shape), so every claim here carries its own provenance comment instead of
# tracing to `knowledge/`. Every quoted UI label is a QUOTATION, cited in the
# `labels` list below and checked by `broadsec-manual labels bridge-manual`.
# Since the product gained an i18n catalogue, a quotation is cited from the
# Spanish catalogue (`src/i18n/locales/es/*.json`) when the product keys it,
# and from the component when the product hardcodes the literal. The catalogue
# spells some strings without accents ("Sin ubicacion", "Buscar por tipo,
# direccion..."): a quotation is copied as the catalogue writes it, while the
# manual's own prose is written correctly.
#
# ORGANISATION. Home is ONE rail view composed of dock panels, and what the
# operator does there depends on one thing: whether a case is open. So the
# module is organised by STATE, not by panel:
#
#   - without a case: Reportes pendientes, Teclado, Mi turno;
#   - with a case: the report card and the call information, the case book,
#     CCTV, Fuerzas en Campo, the Log drawer, the action bar, and the
#     Post-Llamada that opens the case by itself when a call ends;
#   - across both: the panel bar and the panel arrangement, and the map tools.
#
# PERMISSIONS. Nothing in this view is conditioned on the manual's OWN axis
# (`permission`, from `canViewAllAgencies`): that predicate is consumed only in
# sitemap-view.tsx:36-37, so there is no `when` in this file. That sentence is
# true ONLY of the manual's axis. Two other permissions do reach Home, and they
# are stated in prose where they matter, with no `when`, because they are not
# what this manual builds its targets from:
#   - `dispatch.forces` (domain/can-dispatch-forces.ts:1) decides whether the
#     dispatch-workflow panels exist in Home at all
#     (views/home-right-slot.ts:233-235, `resolveExcludedHomePanels`), so it
#     decides two entries of the panel bar;
#   - `case.view.all` decides how much of the queue an operator sees on the map
#     (pages/dashboard.tsx:914-917, `onlyMyCases`) and is the reason a
#     reception supervisor sees other operators' cases.
#
# AGENCY TYPE. What ALSO varies this view is `agencyType`, which is not an axis
# of this manual: `HomeView` keys `HOME_LAYOUT_RULES` off it
# (views/home-right-slot.ts:67-116). This section describes the RECEPTION rules
# (views/home-right-slot.ts:68-79) — the manual's agreed scope, and the backend's
# own default (domain/types/agency.types.ts:9). See ESTADO.md. On `develop` those
# rules show Fuerzas en Campo and CCTV for RECEPTION
# (views/home-right-slot.ts:72-73, `showFieldForcesOnCase`, `showCctvOnCase`).
# The unmerged `feat/dashboard/role-based-views` branch would change that; it is
# NOT what this section documents.
#
# NOT DOCUMENTED, and not a gap: the Agencias panel and the DISPATCH agency's
# own case view (`agency-*` panels, views/home-view.tsx:304-341) only mount for
# other agency types, and `CaseRecommendedAgencies`
# (components/panels/dashboard/incident-summary/case-recommended-agencies.tsx)
# is not mounted by any RECEPTION layout.
#
# Paths in comments are relative to `src/modules/dashboard/presentation/ui/` in
# the `bridge` source repository, except where another module is named in full.

id: home
title: Home
subtitle: Punto de entrada del operador, sobre el mapa de la operación

sourceBase: src/modules/dashboard/presentation/ui/

# The screens of Home that the PRODUCT has not finished. Each is documented
# around and never named in the content, and each is exported by
# `broadsec-manual awaiting bridge-manual` to `awaiting-product.json`.
pending:
  - id: home.teclado-favoritos-simulados
    covers: [home.teclado.fichas]
    missing: >-
      The "Favoritos" tab of the Teclado panel, and the control beside the
      number field that adds the typed number to it. The other tabs of the
      panel (Teclado, Recientes, Directorio, Agentes en turno) are documented;
      this one is not mentioned.
    because: >-
      The tab lists `MOCK_FAVORITOS` (`components/panels/keypad-panel.tsx:73-77`),
      three literal entries with Argentine numbers ("Centro Médico", "Bomberos",
      "Policía Federal"). The list is component state seeded from that constant
      (`:287`); adding a number only prepends to that state
      (`handleAddFavorite`, `:294-297`) and nothing is persisted or fetched. The
      phone button of every row has no `onClick` (`:738-740`).
    settles: >-
      The product persisting favourites per operator and wiring the row's phone
      button, or the owner deciding how a manual describes a tab that is on
      screen and fabricated.

  - id: home.teclado-directorio-sin-marcado
    covers: [home.teclado.fichas]
    missing: >-
      That the rows of the "Directorio" tab offer no way to dial the agency. The
      tab is documented as a list of the registered agencies with their type,
      which is what it does.
    because: >-
      `DirectorioView` renders each agency as a name and a type and nothing
      else (`components/panels/keypad-panel.tsx:782-794`): there is no phone
      number in the row and no button, unlike the rows of "Recientes"
      (`:707-713`).
    settles: >-
      The product giving the directory a dial action, or the owner deciding how
      a manual describes a list that looks like a dialler and is not.

  - id: home.teclado-agentes-sin-accion
    covers: [home.teclado.fichas]
    missing: >-
      The two buttons on each row of the "Agentes en turno" tab (the eye and the
      phone, titled "Ver" and "Llamar"). The list itself — the connected agents,
      their status and their station — is real and documented.
    because: >-
      `AgentsTable` renders both buttons for every row
      (`components/panels/agents-on-shift-list.tsx:73-86`, `showActions` is
      passed as `true` at `:26`) and neither has an `onClick`.
    settles: >-
      The product wiring "Ver" and "Llamar", or removing them.

  - id: home.paneles-toggle-informacion-incidente
    covers: [home.paneles.lista]
    missing: >-
      The toggle labelled "Información del incidente" in the panel bar. Every
      other panel of the bar is documented; this one is not mentioned.
    because: >-
      `incident-info` is the id of the right-column SLOT
      (`RIGHT_SLOT_PANEL_ID`, `views/home-view.tsx:138`), registered in the
      manifest with the static label `homeView.incidentInfo`
      (`:275-285`, calls.json:419) and not excluded for RECEPTION
      (`views/home-right-slot.ts:224-257`). Its open state is driven by an
      effect from the slot's occupant (`:1201-1212`: `rightSlot != null`),
      and for RECEPTION with a case open `rightSlot` is null (`:782-789`),
      so the toggle opens a panel whose render branch returns null
      (`:1554-1619`, `default`). Without a case it acts as a second switch for
      Mi turno.
    settles: >-
      The product hiding the toggle for RECEPTION (or giving it a purpose), or
      the owner deciding how a manual describes a control that is on screen and
      does nothing.

  - id: home.revision-orden-inerte
    covers: [home.revision.controles]
    missing: >-
      The sort toggle in the toolbar of "Reportes pendientes" (the up-down
      arrows, titled "Mas recientes primero" / "Mas antiguos primero"). The
      search, the filters and the history control beside it are documented.
    because: >-
      The toggle flips `sortAscending`
      (`components/panels/dashboard/calls-review/calls-review-search.tsx:345-363`
      and `calls-review-panel.tsx:176`, `:430-431`), but Recepción's panel never
      reads it: its list is filtered and re-ordered at `:363-381` without
      touching `sortAscending`, so pressing the toggle changes the button's title
      and nothing on the list. (The legacy panel for other agency types does
      read it, `:594`.)
    settles: >-
      The product applying the order to Recepción's list, or removing the
      toggle.

  - id: home.revision-estado-transferido
    covers: [home.revision.estados]
    missing: >-
      The "Transferido" status of a case. It cannot be seen on screen today; the
      declaration exists so the status is not forgotten if it becomes reachable.
    because: >-
      `transferido` is a member of `CallReviewReceptionStatusKey`
      (`components/panels/dashboard/calls-review/calls-review.types.ts:193`) and
      has a label, a colour and an icon (`:224-229`, label
      `calls:receptionStatus.transferred`), but it is not in
      `CALL_REVIEW_RECEPTION_STATUS_ORDER` (`:265-266`) — so the Estado filter
      never lists it — and `resolveReceptionStatusKey` never returns it
      (`:268-282`).
    settles: >-
      The product assigning the status to a case, or deleting it.

