# Seatmap — written against the Bridge360 source (`bridge`, branch `develop`,
# 465f5eb9), cited by file and line.
#
# There is no module map for this product yet (no extractor exists for its
# shape), so every claim here carries its own provenance comment instead of
# tracing to `knowledge/`. Every quoted UI label is a QUOTATION, cited in the
# `labels` list below and checked by `broadsec-manual labels bridge-manual`.
# Since the product gained an i18n catalogue, a quotation is cited from the
# Spanish catalogue (`src/i18n/locales/es/*.json`) when the product keys it. The
# catalogue keeps its own spelling ("Tiempo de espera más larga", "En Espera" in
# the operator table and "En espera" in the status count, "Offline"): a
# quotation is copied as the catalogue writes it, while the manual's own prose
# is written correctly.
#
# This module was rewritten in full on 2026-09-30, with the owner's
# authorisation, from the previous version that was written against `58e2cc4d`.
# The drift audit is in engram, `bridge-manual/seatmap-drift-audit-2026-09-30`.
#
# The product calls the view `sitemap` internally, but the control the operator
# reads says "Seatmap" (`navigation.seatmap`, common.json:67, used at
# components/layout/icon-sidebar.tsx:74). The manual quotes the screen.
#
# ORGANISATION. Four areas, in the order an operator reads the screen: the
# recent-cases band above the top bar (`Nuevos incidentes`), the floor plan on
# the left with its agency tabs, the indicators column on the right, and the
# operator monitor in the bottom band. The floor plan carries the most
# behaviour, so it is split into the workstation card, the operator detail and
# the layout editing.
#
# CONDITIONING. The axis is `permission`, with values from `canViewAllAgencies`
# ALONE (domain/can-view-all-agencies.ts:5-7; `hasPermission` also grants `*`,
# auth/domain/has-permission.ts:2 and :10-11). It is consumed in
# views/sitemap-view.tsx:38 and reaches, in this file, exactly these places:
#   - the agency tabs, `SitemapAgencyTabs` (sitemap-view.tsx:140-146), and the
#     procedure that uses them;
#   - the loading notice, `sitemap.loadingAgencies` (sitemap-view.tsx:113-114),
#     which is the `canViewAll` branch of the ternary at :111-118;
#   - the no-agency notice (:117), the `else` branch, for the reader without it;
#   - the category donut: `useCategoryStats(canViewAll)` (sitemap-view.tsx:79)
#     passes `canViewAll` as `enabled` (hooks/use-category-stats.ts:15-20), so
#     without the permission the query never runs and the donut receives total 0
#     and no categories (components/sitemap/sitemap-stats-panel.tsx:62,
#     :64-65) — a grey ring, a 0 and no legend;
#   - the agencies card: `agenciesCases={canViewAll ? agenciesCases : []}`
#     (sitemap-view.tsx:175), so without the permission the card falls to its
#     empty state (components/sitemap/sitemap-operator-monitor-panel.tsx:289-292)
#     with the total at 0 (:303-309).
# `canManageSitemapLayout` (sitemap-view.tsx:39, domain/can-manage-sitemap-layout.ts:6-13)
# and the sidebar gate `view.sitemap` (components/layout/icon-sidebar.tsx:77,
# filter at :146-151) are independent of the axis (ESTADO.md, Ruled out and
# Unresolved #1): they are stated in prose and nothing is conditioned on them.
#
# WHAT THE CODE DOES NOT PROVE, and the text therefore does not claim:
#   - that a layout change applies to other users of the agency: the frontend
#     only sends a PATCH / POST / DELETE per change
#     (infrastructure/http/sitemap-layout-api.service.ts:35-83);
#   - that the category donut is scoped to the selected agency, or to any
#     period: the request carries neither an agency nor a period
#     (infrastructure/http/workforce-api.service.ts:449-456, called without
#     arguments at hooks/use-category-stats.ts:18);
#   - what makes the marquee time colour: it is a regex over the type label
#     (views/sitemap-cases-marquee.model.ts:17, :53-58); there is no severity
#     field on the backend row, so the text says only "según el tipo";
#   - why "Cargando agencias…" stays: errors are swallowed, so it is described
#     only as the loading state;
#   - that dragging is limited to edit mode: `useDraggable` is disabled only
#     while a change is being saved (components/sitemap/sitemap-zone-grid.tsx:457
#     passes `disabled={isSaving}`), so drag is described inside edit mode only;
#   - what triggers the operator state "En Espera": it arrives as `on_hold` from
#     the backend and nothing on the client says why.
#
# NOT DOCUMENTED, and not a gap:
#   - `sitemap.agencyLoadError` ("No se pudo cargar la agencia asignada.",
#     analytics.json:442). It is unreachable: it sits in the `!agencyId` branch
#     under `user?.agencyId ?`, but for a reader without the permission
#     `agencyId` IS `user?.agencyId` (sitemap-view.tsx:53-55), so inside that
#     branch `user?.agencyId` is always falsy and the ternary always yields
#     `noAgencyAssigned`. The previous version documented it under
#     `agencia-propia`; a message that cannot appear is dropped.
#   - the operator status `Vacío` (`operatorStatus.empty`, analytics.json:458)
#     in the table: rows are filtered to `assignedUser != null`
#     (sitemap-operator-monitor-panel.tsx:78), so an empty desk never reaches the
#     table. An empty desk is documented only as the blank card in the plan.
#   - the "zonas" of the previous version: there are none. The plan is a free
#     grid of row / column cells (sitemap-zone-grid.tsx:133-150).
#   - `sitemap-layout-mock.service.ts`: the store is built on the real API
#     service (stores/use-sitemap-position-store.ts:146-148).
#
# QUOTATIONS LEFT OUT ON PURPOSE. `sitemap.maxChairsReached`
# (common.json:653, "Ya no puedes agregar…") is in the familiar register the
# client PDF cannot carry, so the section describes the notice without quoting
# it.
#
# Paths in comments are relative to `src/modules/dashboard/presentation/ui/` in
# the `bridge` source repository, except where another module is named in full.

id: seatmap
title: Seatmap
subtitle: Estado de la sala de operación en tiempo real

# What `from` below is relative to. The prose comments in this file already said
# this in words; as data, `labels` can be checked.
sourceBase: src/modules/dashboard/presentation/ui/

