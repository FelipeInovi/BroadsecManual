# `broadsec-manual labels bridge-manual`.
#
# NOT cited, because they are the MANUAL's own naming and the product never said
# them: the column headings (`Área`, `Qué contiene`, `Dato`, `Qué indica`,
# `Estado`, `Qué agrupa`, `Columna`, `Contenido`, `Color`, `Control`,
# `Qué hace`), the row names that describe a region or a colour (`Banda
# superior`, `Código del puesto`, `Verde`, …) and the field-list names of the
# plan (`Cuadrícula de puestos`, `Selector de agencias`). The titles of the two
# monitor cards ("Estados de Operadores", "Agencias") are quoted in the
# `detail-header` blocks, which declare no label policy, so their source is in a
# comment there instead.
