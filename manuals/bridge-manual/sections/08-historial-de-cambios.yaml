# Historial de cambios — the manual's own delivery history.
#
# THIS SECTION IS NOT ABOUT THE PRODUCT, and that is what makes it different
# from every other file in this directory:
#
#  - **No `labels` block, and none is missing.** Every other section here cites
#    the source file and line each quoted UI label came from, because those are
#    the product's words. Nothing below is quoted from Bridge360 — a version
#    number is not a label, and the column headers are this manual's own. A
#    citation here would send `broadsec-manual labels bridge-manual` looking for
#    `1.0.0` in the product repository.
#
#  - **No overview figure, and none is missing either.** `module-completeness`
#    opens every module with a screenshot of the whole screen. There is no
#    screen. See `manuals/AGENTS.md`, "Versioning" — that rule does not reach a
#    module about the manual.
#
#  - **It must sort LAST.** `08-` puts it after `07-create-incident.yaml`, and
#    the build enforces the outcome (`assertChangeLog`, cli/src/main.ts).
#    A ninth module goes in as `08-…` renamed, never appended after this one.
#
# THE VERSION IN THE TABLE IS NOT `contentVersion`. The config still says 0.6.9,
# which counted internal work under the rule that has since been withdrawn. The
# row below is what the CLIENT receives, and the cover and filename are derived
# from it (`deliveredVersion`, cli/src/main.ts).
#
# WHY 1.0.0 AND NOT 0.0.1, which is what this row said first. Under the rule in
# `manuals/AGENTS.md` a new module is a MAJOR and a patch is "a step tweak, a
# wording or typo fix" — so `0.0.1` claims this manual, which carries eight
# modules, contains one corrected sentence. It is not reachable from our own
# rules. And `0.x` in SemVer does not mean "first delivery", it means initial
# development where anything may change without notice; this manual's structure
# and numbering are stable, and eight pending images make it INCOMPLETE, not
# UNSTABLE. 1.0.0 is what SemVer reserves for exactly this: the first delivery
# defines the contract every later one is measured against.

id: historial-cambios
title: Historial de cambios
subtitle: Versiones entregadas de este manual

