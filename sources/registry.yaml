# Source product repositories. Read-only inputs — never written to.
#
# `extract` tells the extractor where the facts live. Paths are relative to the
# source repo root. Adjust per product; nothing here is assumed to generalise.
#
# `extract.tenantConfigs` is OPTIONAL. A product can be genuinely multi-tenant
# and declare none: if tenancy is resolved outside the client repository — from a
# token claim, server-side — there is no per-tenant file to point at. Leave it
# out in that case. `broadsec-manual extract` then refuses, because a map with no
# tenants would claim the product ships a single deployment. Never point it at a
# directory to satisfy the field.

version: 1

sources:
  broadlineavida:
    name: Broadsec SIMM
    vendor: Inovisec AG
    # Relative to this repository's root.
    path: ../broadlineavida
    framework: react-vite-ts

    extract:
      # One config file per tenant — the authoritative tenant registry.
      tenantConfigs: src/render/config/*.config.ts
      # Route declarations and route-level gating (`allowedProjects`).
      routes: src/render/routes/AppRoutes.tsx
      routeAccess: src/render/routes/RouteAccess.tsx
      # UI strings. The manual quotes these; it never retypes them.
      i18n: src/render/locales/translations/es.json
      # Screens, for figure capture and module mapping.
      pages: src/render/pages
      components: src/render/components

    notes: |
      Tenant divergence in this product is mostly ELEMENT-level inside shared
      screens, not module-level. Route gating via `allowedProjects` covers only
      a small part of it; most differences are inline comparisons against the
      active tenant config scattered through components.

      Extraction must therefore collect inline tenant references, not just
      route gating, or the module map will claim every tenant sees everything.

    # What this product ships as image files, and where the joins live.
    # Findings for the `source-assets` skill — read by agents, NOT by any
    # command. They expire when the product changes, not when the manual does.
    assets:
      inventory: |
        389 image files AND three icon libraries. The mix is what matters: the
        right question is never "does the repo have images" but "does the
        control I need render from a file".
      folders:
        # Photographic assets and shipped glyphs. Takeable.
        images: src/render/assets/images
        # The product's OWN SVGs, written as React components. They carry
        # framework classes (`fill-white`, `stroke="white"`) because they sit on
        # dark controls, so extracted standalone they turn black or invisible.
        # Deliverable only with a deliberate recolouring.
        drawnIcons: src/render/assets/icons
      libraries:
        # Wrapper holds no files; the dependency `@tabler/icons` ships
        # `icons/outline/*.svg`, MIT. Copy the file, never parse the wrapper.
        "@tabler/icons-react": takeable-via-base-package
        # JS only, no SVG anywhere in the package.
        "@mui/icons-material": not-as-a-file
        # Resolved from a remote API at runtime. Nothing on disk.
        "@iconify/react": no
      joins: |
        Strongest first, matching the skill's hierarchy:

        1. CustomTag.tsx — a literal dictionary mapping 338 incident names onto
           68 of the 85 incident-type label images. The product states the
           mapping itself; nothing is inferred.
        2. LayersMap.tsx — object literals pairing asset and i18n key,
           `{ img: layer_camera, tittle: t("layers.cameras") }`.
        3. LayersMap.tsx also holds the hardcoded-label form,
           `{ img: layer_avl, tittle: "AVL" }` — there is no `layers.avl` key.
        4. BOTSidebar.tsx — Tabler outline SVGs for the BoT section glyphs.
      filenameHazards: |
        Measured, and the reason the skill forbids filename matching outright:

        - Of the nine top-bar icons the manual needed, exactly ONE had an asset
          of the same name.
        - The map layer control uses `layer_camera.webp`. Beside it in the same
          folder sit `cluster_camera.webp` and `cluster_cameras.webp`, which
          belong to map marker clustering — a different feature.
      runtimeOnly: |
        Google Maps native controls (street view, 3D, zoom) are drawn by their
        SDK. Nothing in this repository to take, at any effort.

  bridge:
    name: Bridge360
    vendor: Inovisec AG
    # Relative to this repository's root.
    path: ../bridge
    # NOT `react-vite-ts`. React 19 + Vite 7 + TS, but shipped as a Tauri 2
    # desktop app, routed with `wouter`, laid out hexagonally per module. No
    # code reads this field yet; it is the discriminator a second extractor
    # dispatches on (packages/extract/AGENTS.md), so it must not claim the
    # shape the existing extractor knows.
    framework: react-tauri-ts

    extract:
      # `tenantConfigs` is DELIBERATELY ABSENT. The product is multi-tenant and
      # enumerates no deployment anywhere in this repository: the tenant arrives
      # as the JWT claim `tid`
      # (src/modules/auth/infrastructure/mappers/user.mapper.ts:21) and the API
      # routes on the token (src/shared/config/api.ts:23). The Tauri side only
      # persists the id it was handed (src-tauri/src/lib.rs:226-247). There is
      # no per-tenant file to point at, and pointing this at a directory to
      # satisfy the field would invent a tenant registry.
      #
      # The seven views the operator actually moves between. This product has a
      # router, but it declares five routes and one of them is the whole
      # application (src/app/App.tsx:126-138) — screens are views switched
      # inside the dashboard, not routes.
      pages: src/modules/dashboard/presentation/ui/views
      components: src/modules/dashboard/presentation/ui/components
      # No `i18n` key: there is no catalogue. No locales, translations or i18n
      # module exists anywhere under `src/`.

    notes: |
      Divergence in this product is NOT on the tenant axis, and an extractor
      that looks for one will find nothing and report a single deployment.

      What varies the UI is the JWT `permissions[]` claim, through two domain
      predicates in src/modules/dashboard/domain/:

        - can-view-all-agencies.ts   — `view.sitemap.all`, or `*`
        - can-manage-sitemap-layout.ts — `manage.sitemap.layout`,
          `manage.sitemap.layout.all`, or `*`

      Both are consumed in exactly one place,
      src/modules/dashboard/presentation/ui/views/sitemap-view.tsx:36-37, and
      the two are INDEPENDENT: nothing in the product asserts that a reader
      holding one holds the other.

      Mechanisms checked and ruled out as divergence: `role` is typed
      (auth/domain/entities/user.entity.ts:1) but never compared anywhere;
      `agencyId` scopes which data is fetched, not which controls exist;
      `VITE_*_USE_MOCK` flags are build-time dev scaffolding.

      Two comments name deployments — create-incident.ts:183 ("only the LV
      deployment demanded them") and create-incident.schema.ts:51 — but neither
      is a gate. The code carries the union of deployment behaviours instead of
      branching, which is why there is nothing per-deployment to extract.

      There is no i18n catalogue, so every UI label this manual shows is a
      QUOTATION with file and line, not a keyed reference (hard rule 4 of the
      source-extraction skill). Labels here will not follow the product when the
      product changes. `uiLabel` blocks cannot be used against this source.

      The asset survey has been run — see `assets:` below.

    # What this product ships as image files, and where the joins live.
    # Findings for the `source-assets` skill — read by agents, NOT by any
    # command. They expire when the product changes, not when the manual does.
    assets:
      inventory: |
        ~186 image files under src/assets: 97 webp, 46 svg, 40 png, 2 gif, 1
        jpg. Folders: bot_status_icons, Forces, icons, intendence, labels,
        layers, phonebook, pins, Resources, sitemap, task-icons.

        The mix is not the point; the SHAPE of the UI is. This product draws
        almost every control with `lucide-react` components rather than with
        files, so a rich asset folder sits beside a UI whose controls are not in
        it. Of the 33 icon-convention slots the manual asked for, 30 were
        delivered: 7 as shipped files, 23 emitted from module geometry.
      libraries:
        # Only cjs/ and esm/ JS bundles — ZERO .svg files, and no `lucide-static`
        # installed. But the geometry IS here: `dist/esm/icons/<name>.js` is one
        # unminified file per icon holding its `__iconNode` and its ISC licence,
        # and the component names the icon, so the join is level 1. Emitted, not
        # copied. See the skill's "A JS-only icon library" section.
        "lucide-react": yes-by-reading-the-module
      joins: |
        Strongest first, matching the skill's hierarchy:

        1. `utils/force-icon.utils.ts:13-20` — `FORCE_IMAGES`, an object literal
           whose KEY is the UI string and whose `src` is the imported asset:
           `Salud: { src: medicalImg, alt: "Salud" }`. Level 2, nothing
           inferred. Six forces, from src/assets/phonebook/.
        2. `components/panels/available-agents-list.tsx:28-34` — `FORCE_FILTERS`,
           the same six assets paired with the same six labels in a second
           object literal. Independent confirmation of the same join, and the
           reason those icons are ONE shared slot rather than two copies.
        3. `components/panels/map-tools-panel.tsx:18-23` — six layer/street-view
           assets imported by name, each used in one identifiable control.
           `street_view_layer.png` reaches the street-view toggle at :274,
           beside `alt="streetViewOutside"`. Level 3.
        4. `lucide-react` — the component NAMES the icon, so `<Archive />` and
           `dist/esm/icons/archive.js` are the same identity stated by the
           library. Level 1, and the module is the very one the app imports.
      ownGlyphs: |
        `components/panels/dashboard/bridge-of-things/cctv-ptz-core.tsx` draws
        eleven glyphs as its OWN inline SVG components, and this is the trap that
        nearly cost a wrong delivery: the file exports `ArrowUp`, `ArrowDown`,
        `ArrowLeft`, `ArrowRight` — and they are CHEVRONS
        (`<polyline points="18 15 12 9 6 15" />`, :111), not lucide's shafted
        arrow. The PTZ bar imports them from HERE, not from the library, while
        naming them exactly as lucide names its own.

        So: follow the import even when the JSX name matches a library icon
        perfectly. Deliverable with recolouring — the arrows (:111, :125, :139,
        :153) and `HomeIcon` (:228) were.

        NOT deliverable: `ZoomInIcon` (:244) and `ZoomOutIcon` (:263) are
        fragments — the magnifier SVG plus a `<span>` holding `+` or `-` in the
        app's font. Extracting the SVG gives three quarters of the control.
      filenameHazards: |
        The `phonebook/` names describe the AGENT, not the filter: `medical_agent`
        for "Salud", `traffic_agent` for "Tránsito", `civil_defense` for "Defensa
        Civil". Matching a slot named `salud` by filename finds nothing at all —
        the join has to come from `FORCE_IMAGES`, which is the whole point of the
        rule.

        `assets/layers/layer_trafic.svg` is misspelled in the product. Do not
        "correct" it when following an import.
      runtimeOnly: |
        Every screen, panel and populated list — 148 of the manual's slots are
        `figure` convention and need the app running against real data. Also the
        Google Maps native controls, as in broadlineavida.
      contentGapFound: |
        `map-tools-panel.tsx:49-56` holds a well-joined family of five map-layer
        images — Tráfico, Satelital, AVL, Mobile, Cámaras — each an object
        literal pairing asset and label. **The manual has no table asking for
        any of them.** Its `home.herramientas` row "Capas de integración" names
        the control that OPENS the menu, not the layers inside it.

        Per the skill, that gap is in the CONTENT, not the extraction: writing
        that subsection is authoring work with its own decisions. Recorded in
        `manuals/bridge-manual/AGENTS.md`.
